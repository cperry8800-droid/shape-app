<!doctype html>
<html><head><meta charset="utf-8">
<!-- Shape's 30-second vertical ads (marketing/ads/2026-11-app-and-coaches.md): one page, drawn for a given
     frame. ?ad=member|coach picks the spec (specs.js). window.setFrame(n) lays the frame out with no clock, so
     a renderer can step it (render.cjs). Open it from a file: URL with --allow-file-access-from-files. -->
<style>
@font-face{font-family:'Anybody';src:url('../../src/app/fonts/anybody-latin-wdth-wght-normal.woff2') format('woff2');font-weight:100 900;font-stretch:50% 150%}
@font-face{font-family:'JBMono';src:url('../../src/app/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2');font-weight:100 800}
@font-face{font-family:'Inter';src:url('../../src/app/fonts/inter-latin-wght-normal.woff2') format('woff2');font-weight:100 900}
:root{--teal:#34d6c5;--ink:#06090a;--paper:#eef3f0;--mute:#7f8c89}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ink);font-family:'Inter',sans-serif;color:var(--paper)}
.glow{position:absolute;border-radius:50%;filter:blur(120px);pointer-events:none}
#g1{width:1100px;height:1100px;left:-380px;top:-420px;background:radial-gradient(circle,rgba(52,214,197,.34),transparent 66%)}
#g2{width:1200px;height:1200px;right:-520px;bottom:-560px;background:radial-gradient(circle,rgba(52,214,197,.22),transparent 66%)}
#grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:6px 6px;opacity:.5}
.scene{position:absolute;inset:0;opacity:0}
.ln{display:block;overflow:hidden;padding-bottom:.08em}
.ln b{display:inline-block;font-weight:inherit}
.kicker{position:absolute;left:84px;right:84px;top:168px;font-family:'JBMono',monospace;font-size:30px;letter-spacing:.24em;text-transform:uppercase;color:var(--teal);font-weight:500}
.kicker i{display:inline-block;width:56px;height:3px;background:var(--teal);vertical-align:middle;margin-right:22px}
.head{position:absolute;left:84px;right:60px;top:226px;font-family:'Anybody',sans-serif;font-weight:640;font-stretch:104%;font-size:90px;line-height:1.03;letter-spacing:-.012em;white-space:nowrap}
.head .ln{display:block;overflow:hidden;padding-bottom:.08em}
.head .ln b{display:inline-block;font-weight:inherit}
.head em{font-style:normal;color:var(--teal)}
.phonewrap{position:absolute;left:50%;top:480px;width:616px;height:1333px;margin-left:-308px}
.phoneglow{position:absolute;inset:-70px -110px;border-radius:50%;background:radial-gradient(ellipse at 50% 55%,rgba(52,214,197,.30),transparent 62%);filter:blur(40px)}
.phonewrap>.phone{position:absolute;inset:0;border-radius:91px / 92px;overflow:hidden;background:#000;box-shadow:0 60px 120px rgba(0,0,0,.65),0 0 0 2px rgba(255,255,255,.07)}
.phonewrap>.phone img{position:absolute;left:-1.1%;top:-.55%;width:102.2%;height:101.1%;display:block}
.note{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-size:23px;letter-spacing:.04em;color:var(--mute)}
/* the hook */
.hook .big{position:absolute;left:84px;right:60px;top:520px;white-space:nowrap;font-family:'Anybody',sans-serif;font-weight:680;font-stretch:104%;font-size:132px;line-height:1.0;letter-spacing:-.02em}
.hook .big .ln{display:block;overflow:hidden;padding-bottom:.08em}
.hook .big .ln b{display:inline-block;font-weight:inherit}
.hook .big em{font-style:normal;color:var(--teal)}
.hook .tag{position:absolute;left:84px;right:84px;top:1240px;font-size:44px;line-height:1.3;color:#c9d3d0;font-weight:400}
/* a number */
.stat .num{position:absolute;left:70px;right:70px;top:520px;font-family:'Anybody',sans-serif;font-weight:720;font-stretch:108%;font-size:400px;line-height:.9;letter-spacing:-.03em;color:var(--teal)}
.stat .lab{position:absolute;left:84px;right:84px;top:960px;font-family:'Anybody',sans-serif;font-weight:620;font-size:92px;line-height:1.04}
.stat .sub{position:absolute;left:84px;right:84px;top:1290px;font-size:44px;line-height:1.32;color:#c9d3d0}
.stat .fine{position:absolute;left:84px;right:84px;bottom:130px;font-size:31px;line-height:1.42;color:#93a09d}
/* the club */
.club .pic{position:absolute;inset:0;background-size:cover;background-position:50% 50%;transform-origin:50% 62%}
.club .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,10,.82) 0%,rgba(6,9,10,.25) 26%,rgba(6,9,10,0) 46%,rgba(6,9,10,.2) 74%,rgba(6,9,10,.9) 100%)}
.club .note{color:#aab5b2}
/* an outline drawing: the lines lie over the ad's own backdrop; a drawn screen can carry a real one */
.art .artwrap{position:absolute;left:0;top:-8px;width:1080px;height:1935px;will-change:transform}
.art .lines{position:absolute;left:0;top:0;width:1080px;height:1935px;display:block}
.art .screen{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#eef2f0}
.art .screen img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;opacity:0}
.art .screenglow{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(150,235,225,.34),transparent 66%);filter:blur(30px)}
.art .topshade{position:absolute;left:0;right:0;top:0;height:700px;background:linear-gradient(180deg,rgba(6,9,10,.92) 0%,rgba(6,9,10,.7) 52%,rgba(6,9,10,0) 100%)}
.art .botshade{position:absolute;left:0;right:0;bottom:0;height:220px;background:linear-gradient(0deg,rgba(6,9,10,.9),rgba(6,9,10,0))}
.art .note{color:#aab5b2}
/* the end card */
.end .logo{position:absolute;left:50%;top:560px;width:560px;margin-left:-280px}
.end .l1{position:absolute;left:60px;right:60px;top:980px;text-align:center;font-family:'Anybody',sans-serif;font-weight:660;font-size:104px;line-height:1.02}
.end .l1 em{font-style:normal;color:var(--teal)}
.end .l2{position:absolute;left:90px;right:90px;top:1130px;text-align:center;font-size:46px;line-height:1.3;color:#c9d3d0}
.end .url{position:absolute;left:50%;top:1400px;transform:translateX(-50%);font-family:'JBMono',monospace;font-size:38px;letter-spacing:.1em;color:var(--ink);background:var(--teal);padding:26px 44px;border-radius:999px;white-space:nowrap;font-weight:600}
.end .fine{position:absolute;left:90px;right:90px;bottom:70px;text-align:center;font-size:23px;line-height:1.4;color:var(--mute)}
</style></head>
<body><div id="stage"><div class="glow" id="g1"></div><div class="glow" id="g2"></div><div id="grain"></div><div id="scenes"></div></div>
<script src="specs.js"></script>
<script>
const q = new URLSearchParams(location.search);
const AD = window.ADS[q.get('ad') || 'member'];
const FPS = 30, N = Math.round(AD.seconds * FPS);
const BEAT = 60 / (AD.bpm || 124);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const lines = (html) => html.split('|').map((l) => `<span class="ln"><b>${l}</b></span>`).join('');
const SEQ = window.SEQ_BASE;
const pad3 = (n) => String(n).padStart(3, '0');
const root = document.getElementById('scenes');
const els = AD.scenes.map((s) => {
  const d = document.createElement('div');
  d.className = 'scene ' + s.type;
  if (s.type === 'hook') d.innerHTML = `<div class="kicker"><i></i>${s.kicker}</div><div class="big">${lines(s.big)}</div><div class="tag">${s.tag || ''}</div>`;
  if (s.type === 'phone') d.innerHTML = `<div class="kicker"><i></i>${s.kicker}</div><div class="head"${s.size ? ` style="font-size:${s.size}px"` : ''}>${lines(s.head)}</div><div class="phonewrap"><div class="phoneglow"></div><div class="phone"><img src="${s.seq ? SEQ + s.seq + '/f000.jpg' : s.img}"></div></div><div class="note">${s.note || AD.sample}</div>`;
  if (s.type === 'stat') d.innerHTML = `<div class="kicker"><i></i>${s.kicker}</div><div class="num">${s.num}</div><div class="lab">${lines(s.lab)}</div><div class="sub">${s.sub || ''}</div><div class="fine">${s.fine || ''}</div>`;
  if (s.type === 'club') d.innerHTML = `<div class="pic" style="background-image:url('${s.img}')"></div><div class="shade"></div><div class="kicker"><i></i>${s.kicker}</div><div class="head">${lines(s.head)}</div><div class="note">${s.note}</div>`;
  if (s.type === 'art') d.innerHTML = `<div class="artwrap">${s.screen ? `<div class="screenglow"></div><div class="screen">${s.screen.shots.map((u) => `<img src="${u}">`).join('')}</div>` : ''}<img class="lines" src="${s.img}"></div><div class="topshade"></div><div class="botshade"></div><div class="kicker"><i></i>${s.kicker}</div><div class="head"${s.size ? ` style="font-size:${s.size}px"` : ''}>${lines(s.head)}</div><div class="note">${s.note || ''}</div>`;
  if (s.type === 'end') d.innerHTML = `<img class="logo" src="${s.logo}"><div class="l1">${s.l1}</div><div class="l2">${s.l2}</div><div class="url">${s.url}</div><div class="fine">${s.fine}</div>`;
  root.appendChild(d);
  return d;
});
// The CSS transform that carries a w x h box onto a quad (top-left, top-right, bottom-right, bottom-left).
function quadMatrix(w, h, q) {
  const src = [[0, 0], [w, 0], [w, h], [0, h]], A = [], B = [];
  for (let i = 0; i < 4; i++) { const [x, y] = src[i], [u, v] = q[i]; A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); B.push(u); A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); B.push(v); }
  for (let c = 0; c < 8; c++) { let p = c; for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r; [A[c], A[p]] = [A[p], A[c]]; [B[c], B[p]] = [B[p], B[c]];
    for (let r = 0; r < 8; r++) { if (r === c) continue; const f = A[r][c] / A[c][c]; for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k]; B[r] -= f * B[c]; } }
  const [a, b, c2, d, e, f, g, hh] = B.map((v, i) => v / A[i][i]);
  return `matrix3d(${a},${d},0,${g}, ${b},${e},0,${hh}, 0,0,1,0, ${c2},${f},0,1)`;
}
const ARTK = 1080 / 1536;   // the drawings are 1536 x 2752; the stage shows them 1080 wide
AD.scenes.forEach((s, i) => {
  if (s.type !== 'art' || !s.screen) return;
  const q = s.screen.quad.map(([x, y]) => [x * ARTK, y * ARTK]);
  const sc = els[i].querySelector('.screen');
  sc.style.width = s.screen.w + 'px'; sc.style.height = s.screen.h + 'px'; sc.style.transform = quadMatrix(s.screen.w, s.screen.h, q);
  const xs = q.map((p) => p[0]), ys = q.map((p) => p[1]), gl = els[i].querySelector('.screenglow');
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), mx = (x1 - x0) * 0.42, my = (y1 - y0) * 0.5;
  gl.style.left = (x0 - mx) + 'px'; gl.style.top = (y0 - my) + 'px'; gl.style.width = (x1 - x0 + 2 * mx) + 'px'; gl.style.height = (y1 - y0 + 2 * my) + 'px';
});
// One frame. Each scene runs from its start to its end (seconds): it cuts in (no cross-fade: the cut
// lands on the beat), its words rise line by line over the first 0.4 s, and it holds.
window.setFrame = (n) => {
  const t = n / FPS;
  document.getElementById('g1').style.transform = `translate(${Math.sin(t * 0.21) * 60}px, ${Math.cos(t * 0.17) * 50}px)`;
  document.getElementById('g2').style.transform = `translate(${Math.cos(t * 0.19) * 70}px, ${Math.sin(t * 0.23) * 60}px)`;
  const waits = [];
  AD.scenes.forEach((s, i) => {
    const el = els[i], on = t >= s.start && t < s.end;
    el.style.opacity = on ? 1 : 0;
    if (!on) return;
    const u = t - s.start, len = s.end - s.start;
    el.querySelectorAll('.ln b').forEach((b, j) => { const k = ease((u - 0.05 - j * 0.09) / 0.38); b.style.transform = `translateY(${(1 - k) * 105}%)`; });
    const kick = el.querySelector('.kicker'); if (kick) kick.style.opacity = ease(u / 0.3);
    for (const sel of ['.tag', '.sub', '.fine', '.l2', '.url']) { const x = el.querySelector(sel); if (x) x.style.opacity = ease((u - 0.35) / 0.4); }
    // a recorded screen: the frame of the recording that belongs to this moment (it holds on its last)
    if (s.seq) { const im = el.querySelector('.phone img'), src = SEQ + s.seq + '/f' + pad3(Math.min(s.frames - 1, Math.max(0, Math.round(u * FPS)))) + '.jpg'; if (!im.src.endsWith(src.split('/').slice(-2).join('/'))) { im.src = src; waits.push(im.decode().catch(() => {})); } }
    const pw = el.querySelector('.phonewrap');
    if (pw) { const k = ease(u / 0.42); pw.style.transform = `translateY(${(1 - k) * 150}px) scale(${0.94 + 0.06 * k + 0.018 * (u / len)})`; pw.style.opacity = ease(u / 0.2); }
    const num = el.querySelector('.num'); if (num) { const k = ease(u / 0.4); num.style.transform = `scale(${0.86 + 0.14 * k})`; num.style.transformOrigin = '0 60%'; num.style.opacity = k; }
    const pic = el.querySelector('.pic'); if (pic) pic.style.transform = `scale(${1.04 + 0.07 * (u / len)})`;
    if (s.type === 'art') {
      // the drawing: its lines come up from the floor in the first half second (the opening scene starts drawn),
      // breathe a little on each beat, and the whole picture pushes slowly toward its point of interest
      const ln = el.querySelector('.lines'), wrap = el.querySelector('.artwrap');
      const p = s.drawn ? 130 : ease(u / 0.55) * 130;
      const m = p >= 129.5 ? 'none' : `linear-gradient(to top, #000 0%, #000 ${p - 16}%, transparent ${p}%)`;
      ln.style.webkitMaskImage = m; ln.style.maskImage = m;
      const ph = ((t / BEAT) % 1 + 1) % 1, pulse = Math.exp(-5 * ph);
      ln.style.filter = `brightness(${(1.04 + 0.2 * pulse).toFixed(3)})`;
      const z = s.zoom || [1.02, 1.1], kz = u / len, zz = z[0] + (z[1] - z[0]) * (kz * kz * (3 - 2 * kz));
      const fo = s.focus || [50, 62];
      const pn = s.pan || [0, 0], kp = kz * kz * (3 - 2 * kz);
      wrap.style.transformOrigin = `${fo[0]}% ${fo[1]}%`; wrap.style.transform = `translate(${(pn[0] * kp).toFixed(2)}px, ${(pn[1] * kp).toFixed(2)}px) scale(${zz.toFixed(4)})`;
      if (s.screen) {
        // the screen comes on a moment after the lines, then shows the next page of the dashboard on the beats given
        const on = ease((u - 0.3) / 0.35), imgs = el.querySelectorAll('.screen img');
        let cur = 0; s.screen.at.forEach((b, j) => { if (u >= b) cur = j; });
        imgs.forEach((im, j) => { im.style.opacity = j === cur ? 1 : 0; });
        el.querySelector('.screen').style.opacity = on; el.querySelector('.screenglow').style.opacity = on;
      }
      const nt = el.querySelector('.note'); if (nt) nt.style.opacity = ease((u - 0.35) / 0.4);
    }
    const logo = el.querySelector('.logo'); if (logo) { const k = ease(u / 0.5); logo.style.opacity = k; logo.style.transform = `scale(${0.92 + 0.08 * k})`; }
    const l1 = el.querySelector('.l1'); if (l1) { const k = ease((u - 0.2) / 0.45); l1.style.opacity = k; l1.style.transform = `translateY(${(1 - k) * 40}px)`; }
  });
  return Promise.all(waits).then(() => N);
};
window.FRAMES = N;
document.fonts.ready.then(() => Promise.all([...document.images].map((im) => im.decode().catch(() => {})))).then(() => { window.setFrame(Number(q.get('f') || 0)); window.READY = true; });
</script></body></html>

<!-- ⚠ THIS PAGE IS A REDIRECT NOW, AND ITS RETIREMENT IS THE POINT.
     Shape Radio was two web pages for one station: a marketing page that could not
     play and this player, which could not sell and was reached from it. The app has
     ONE Radio screen; the web sent a member from one page to the other and asked
     them to learn two instruments. /newdesign/Radio.html is both now.

     What this page was still carrying when it was retired, all of it live:
       • fourteen canvas rings breathing on a SYNTHETIC SINE while paused, with the
         reason in its own comment — "so the canvas keeps moving";
       • `currentBpm = 120`, a typed constant presented as the track's tempo;
       • a "Demo HR" slider that fabricated a heart rate, under a badge reading
         "Locked — your pace is the song" derived from it.
     The app deleted its own equivalents — demoHr and BSBeatRing — on 2026-09-14 for
     exactly this, and the new page measures all three or prints an em-dash.

     ⚠ THE REDIRECT STAYS RATHER THAN THE FILE BEING DELETED. Four legacy pages
     (ai-trainers.html, client-profile.html, clients.html and the old footers) link
     here by relative href, and the URL is in the wild. It replaces rather than
     pushes, so Back goes where the visitor came from instead of bouncing.

     Nora's booth was the one thing here that the new page did not have; it was
     ported before this went in, so nothing shipped was lost. -->
<script>
  (function () {
    try {
      var q = location.search || '';
      location.replace('/newdesign/Radio.html' + q + (location.hash || ''));
    } catch (e) {
      location.href = '/newdesign/Radio.html';
    }
  })();
</script>

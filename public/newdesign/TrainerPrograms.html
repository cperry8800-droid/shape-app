<html>
<head>
<meta charset="utf-8" />
<title>Programs · Shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dash.css?v=20260612">
<script defer src="/_vercel/insights/script.js"></script></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="pageShell.jsx?v=20260612"></script>
<script type="text/babel" src="trainerDashboard.jsx?v=20260612c"></script>
<script type="text/babel" src="coachNav.jsx"></script>
<script type="text/babel" src="aiGenerator.jsx"></script>
<script type="text/babel">
function planMoney(cents) {
  try { return "$" + Math.round((cents || 0) / 100).toLocaleString(); }
  catch (e) { return "$0"; }
}
function planMeta(p) {
  return [
    p.durationWeeks ? p.durationWeeks + "w" : null,
    p.daysPerWeek ? p.daysPerWeek + " days/wk" : null,
    p.level || null,
  ].filter(Boolean).join(" · ");
}

// Mock templates — shown while the API loads, or when the viewer isn't a
// signed-in trainer.
const MOCK_PROGRAMS = [
  { id: "p1", title: "Strength + hybrid (12w)", goal: "Build strength with conditioning carryover.", level: "Intermediate", durationWeeks: 12, daysPerWeek: 4, status: "published", source: "manual", priceCents: 22000, clients: 18 },
  { id: "p2", title: "Beginner barbell (8w)", goal: "Learn the main lifts with confident technique.", level: "Beginner", durationWeeks: 8, daysPerWeek: 3, status: "published", source: "manual", priceCents: 18000, clients: 6 },
  { id: "p3", title: "Hybrid cut protocol (10w)", goal: "Lean out while holding onto strength.", level: "Advanced", durationWeeks: 10, daysPerWeek: 5, status: "draft", source: "ai_generated", priceCents: null, clients: 0 },
];

function ProgramCard({ p }) {
  const meta = planMeta(p);
  return (
    <Card style={{ padding: 22, display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <Pill tone={p.status === "published" ? "teal" : undefined}>{String(p.status || "draft").toUpperCase()}</Pill>
        {p.source === "ai_generated" && (
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.12em", color: TEAL_BRIGHT }}>AI</span>
        )}
      </div>
      <div style={{ fontFamily: serif, fontSize: 20, letterSpacing: "-0.01em", marginBottom: 8 }}>{p.title}</div>
      {p.goal && <div style={{ fontSize: 12.5, color: "rgba(242,237,228,0.6)", lineHeight: 1.45, marginBottom: 12 }}>{p.goal}</div>}
      {meta && <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.06em", color: "rgba(242,237,228,0.55)", marginBottom: 14 }}>{meta}</div>}
      <div style={{ marginTop: "auto", display: "flex", alignItems: "center", gap: 8, paddingTop: 14, borderTop: "1px solid rgba(242,237,228,0.08)", fontSize: 11.5, fontFamily: "'JetBrains Mono', monospace" }}>
        <span style={{ color: TEAL_BRIGHT }}>{p.priceCents != null ? planMoney(p.priceCents) + "/mo" : "Not listed"}</span>
        <span style={{ color: "rgba(242,237,228,0.55)" }}>· {p.clients} client{p.clients === 1 ? "" : "s"}</span>
        <a href={`TrainerNewProgram.html?mode=edit&program=${encodeURIComponent(p.id)}`} style={{ marginLeft: "auto", color: "rgba(242,237,228,0.6)", letterSpacing: "0.1em" }}>MANAGE →</a>
      </div>
    </Card>
  );
}

function TrainerProgramsPage() {
  const [live, setLive] = React.useState(null);
  React.useEffect(() => {
    let cancelled = false;
    fetch('/api/trainer/programs', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (!cancelled && d && d.isTrainer) setLive(d); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const programs = live ? live.programs : MOCK_PROGRAMS;

  return (
    <DashPage
      navItems={trainerNavItems("programs")}
      payoutCard={trainerPayoutCard}
      eyebrow={programs.length + " PROGRAM" + (programs.length === 1 ? "" : "S")}
      title="Programs"
      subtitle="Your saved program templates — generate one with AI or build it from scratch."
      actions={
        <a href="TrainerNewProgram.html" style={{ background: INK, color: PAPER, border: 0, padding: "10px 22px", borderRadius: 999, fontFamily: sans, fontSize: 13, fontWeight: 500, cursor: "pointer" }}>+ New program</a>
      }
    >
      <AIGeneratorCard kind="program" role="trainer" />
      <div style={{ marginTop: 20 }}>
        {programs.length === 0 && (
          <Card style={{ padding: "34px 22px", textAlign: "center", color: "rgba(242,237,228,0.6)", fontSize: 13.5 }}>
            No programs yet. Use the generator above or “New program” to create your first one.
          </Card>
        )}
        {programs.length > 0 && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 280px), 1fr))", gap: 16 }}>
            {programs.map((p) => <ProgramCard key={p.id} p={p} />)}
          </div>
        )}
      </div>
    </DashPage>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<TrainerProgramsPage />);
</script>
<script src="globalChatButton.js?v=20260609" defer></script>
</body>
</html>

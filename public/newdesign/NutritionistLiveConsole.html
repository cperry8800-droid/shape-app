function newId() { return "m" + Math.random().toString(36).slice(2, 9); }
function firstName(name) { return (name || "").split(" ")[0]; }

// Trajectory series — per-client params drive a deterministic 26-week series
// (sin/cos wiggle around a start->end baseline) sliced by the range toggle.
const RANGE_DAYS = { "3d": 3, "1w": 7, "4w": 28, "12w": 84, "6m": 182, "1y": 365 };
const SERIES_DAYS = 365;

function isoDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function shortDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }).toUpperCase();
}
const TODAY_ISO = isoDate(new Date());
const DEFAULT_START_ISO = isoDate(new Date(Date.now() - 28 * 86400000));
const TRAJECTORY_PARAMS = {
  charlie: {
    score:   { start: 1200, end: 1480,  noise: 18,  decimals: 0 },
    weight:  { start: 188,  end: 184.2, noise: 0.4, decimals: 1 },
    protein: { start: 100,  end: 135,   noise: 6,   decimals: 0 },
    sleep:   { start: 6.5,  end: 7.4,   noise: 0.3, decimals: 1 },
  },
  priya: {

    sleep:   { start: 7.0,  end: 6.4,   noise: 0.3, decimals: 1 },
  },
  mia: {

    weight:  { start: 146,  end: 146,  noise: 0.3, decimals: 1 },
    protein: { start: 110,  end: 110,  noise: 5,   decimals: 0 },
    sleep:   { start: 7.2,  end: 7.2,  noise: 0.3, decimals: 1 },
  },
  tomas: {
    score:   { start: 1700, end: 1700, noise: 12,  decimals: 0 },
    weight:  { start: 176,  end: 176,  noise: 0.4, decimals: 1 },
    protein: { start: 120,  end: 120,  noise: 5,   decimals: 0 },
    sleep:   { start: 7.0,  end: 7.0,  noise: 0.3, decimals: 1 },
  },
};

function trajSeries(p, n) {
  // The start->end transition spans the most recent TRANSITION_DAYS; anything
  // older is held flat at p.start. Keeps existing <= 6m views identical and
  // lets the 1y view show a clear "before / after" arc.
  const TRANSITION_DAYS = 182;
  const out = [];
  for (let i = 0; i < n; i++) {
    const daysFromNow = n - 1 - i;
    let base;
    if (daysFromNow >= TRANSITION_DAYS) {
      base = p.start;
    } else {
      const t = 1 - (daysFromNow / Math.max(1, TRANSITION_DAYS - 1));
      base = p.start + (p.end - p.start) * t;
    }
    const wiggle = (Math.sin(i * 1.3) + Math.cos(i * 0.7)) * (p.noise || 0);
    const v = base + wiggle;
    out.push(p.decimals ? +v.toFixed(p.decimals) : Math.round(v));
  }
  return out;
}

const METRICS = [
  { key: "score",   label: "Shape Score", unit: "",     goodWhen: "up"   },
  { key: "weight",  label: "Bodyweight",  unit: " lb",  goodWhen: "down" },
  { key: "protein", label: "Protein avg", unit: " g",   goodWhen: "up"   },
  { key: "sleep",   label: "Sleep avg",   unit: " hrs", goodWhen: "up"   },
];

function NutritionistLiveConsolePage() {
  const [clientId, setClientId] = React.useState(CONSOLE_CLIENTS[0].id);
  const [clientMenuOpen, setClientMenuOpen] = React.useState(false);
  const [range, setRange] = React.useState("12w");
  const [metric, setMetric] = React.useState("score");
  const [customStart, setCustomStart] = React.useState(DEFAULT_START_ISO);
  const [customEnd, setCustomEnd] = React.useState(TODAY_ISO);
  const [live, setLive] = React.useState(false);
  const [serverClients, setServerClients] = React.useState(null);
  // Per-client editable state (focus banner + today's meal plan)
  const [focusById, setFocusById] = React.useState(() => Object.fromEntries(CONSOLE_CLIENTS.map(c => [c.id, c.focusBanner])));
  const [groceryNoteById, setGroceryNoteById] = React.useState({});
  const [plansById, setPlansById] = React.useState(() => Object.fromEntries(CONSOLE_CLIENTS.map(c => [c.id, c.plan])));
  // Add-meal form
  const [meal, setMeal] = React.useState({ name: "", time: "", kcal: "", protein: "", note: "", ingredients: "", alternatives: "" });
  // Transient toast
  const [toast, setToast] = React.useState("");
  const toastTimer = React.useRef(null);
  const flash = (msg) => {
    setToast(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2400);
  };

  // Hydrate from /api/nutritionist/console on mount. For a real signed-in
  // nutritionist: replace the demo client roster with serverClients, overlay
  // focus + items, and flip live=true so send/add/remove POST through.
  React.useEffect(() => {
    let cancelled = false;
    fetch('/api/nutritionist/console', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => {
        if (cancelled || !d || !d.isNutritionist) return;
        setLive(true);
        if (Array.isArray(d.clients) && d.clients.length) {
          const snapByClient = d.snapshotByClient || {};
          const profByClient = d.profileByClient || {};
          const seriesByClient = d.seriesByClient || {};
          const mapped = d.clients.map(c => {
            const s = snapByClient[c.id] || {};
            const p = profByClient[c.id] || {};
            const series = seriesByClient[c.id] || null;
            const fmt1 = (v) => (v == null ? '—' : Number(v).toFixed(1));
            return {
              id: c.id,
              isReal: true,
              status: c.status || 'current',
              lastAt: c.lastAt || null,
              name: c.name || 'Client',
              age: p.age != null ? p.age : '—',
              weight: s.weight_lb != null ? Number(s.weight_lb).toFixed(1) + ' lbs' : '—',
              height: '—',
              focus: p.focus || '—',
              meals: { done: 0, total: 0, note: s.snapshot_date ? 'Last log ' + s.snapshot_date : '—' },
              nutrition: {
                kcal: s.calories != null ? Number(s.calories) : 0,
                protein: s.protein_g != null ? Number(s.protein_g) : 0,
              },
              recovery: {
                restingHR: s.resting_hr != null ? Math.round(Number(s.resting_hr)) : '—',
                sleep: s.sleep_hours != null ? fmt1(s.sleep_hours) : '—',
                stress: s.stress != null ? Number(s.stress) : '—',
              },
              recoveryNote: s.snapshot_date
                ? 'Latest snapshot ' + s.snapshot_date + '. Resting HR, sleep, and stress refresh as new wearable / check-in data syncs.'
                : 'Recovery signals will appear once a wearable connects or the client logs a daily snapshot.',
              focusBanner: '',
              plan: [],
              realSeries: series,
            };
          });
          setServerClients(mapped);
          if (mapped.length && !mapped.find(c => c.id === clientId)) {
            setClientId(mapped[0].id);
          }
        }
        if (d.focusByClient && Object.keys(d.focusByClient).length) {
          setFocusById(prev => ({ ...prev, ...d.focusByClient }));
        }
        if (d.groceryNoteByClient && Object.keys(d.groceryNoteByClient).length) {
          setGroceryNoteById(prev => ({ ...prev, ...d.groceryNoteByClient }));
        }
        if (d.itemsByClient && Object.keys(d.itemsByClient).length) {
          setPlansById(prev => {
            const next = { ...prev };
            for (const [cid, items] of Object.entries(d.itemsByClient)) {
              next[cid] = items;
            }
            return next;
          });
        }
      })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const effectiveClients = (serverClients && serverClients.length) ? serverClients : CONSOLE_CLIENTS;
  const client = effectiveClients.find(c => c.id === clientId) || effectiveClients[0];
  const plan = plansById[clientId] || [];
  const focus = focusById[clientId] || "";

  const setFocus = (v) => setFocusById({ ...focusById, [clientId]: v });
  const sendFocus = () => {
    if (!focus.trim()) { flash("Add a focus first"); return; }
    flash("Sent to " + firstName(client.name) + "'s phone");
    if (live) {
      fetch('/api/nutritionist/console', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clientId, action: 'focus', text: focus }),
      }).catch(() => {});
    }
  };
  // Grocery note — separate from the focus banner; shows on the client's grocery page.
  const groceryNote = groceryNoteById[clientId] || "";
  const setGroceryNote = (v) => setGroceryNoteById({ ...groceryNoteById, [clientId]: v });
  const sendGroceryNote = () => {
    flash(groceryNote.trim() ? "Grocery note sent to " + firstName(client.name) : "Grocery note cleared");
    if (live) {
      fetch('/api/nutritionist/console', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clientId, action: 'groceryNote', text: groceryNote }),
      }).catch(() => {});
    }
  };
  const addMeal = () => {
    if (!meal.name.trim()) { flash("Add a meal name first"); return; }
    const ingredients = meal.ingredients
      .split(/\r?\n|,/)
      .map(s => s.trim())
      .filter(Boolean);
    const alternatives = meal.alternatives
      .split(/\r?\n|,/)
      .map(s => s.trim())
      .filter(Boolean);
    const payload = {
      name: meal.name.trim(),
      time: meal.time.trim() || "—",
      kcal: meal.kcal ? Number(meal.kcal) : null,
      protein: meal.protein ? Number(meal.protein) : null,
      note: meal.note.trim(),
      ingredients,
      alternatives,
    };
    const tempId = newId();
    setPlansById({ ...plansById, [clientId]: [...plan, { id: tempId, ...payload }] });
    setMeal({ name: "", time: "", kcal: "", protein: "", note: "", ingredients: "", alternatives: "" });
    flash("Added to " + firstName(client.name) + "'s plan");
    if (live) {
      fetch('/api/nutritionist/console', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clientId, action: 'addItem', payload }),
      })
        .then(r => (r.ok ? r.json() : null))
        .then(d => {
          if (!d || !d.id) return;
          setPlansById(prev => ({
            ...prev,
            [clientId]: (prev[clientId] || []).map(it => it.id === tempId ? { ...it, id: d.id } : it),
          }));
        })
        .catch(() => {});
    }
  };
  const removeMeal = (id) => {
    setPlansById({ ...plansById, [clientId]: plan.filter(m => m.id !== id) });
    if (live) {
      fetch('/api/nutritionist/console', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clientId, action: 'removeItem', itemId: id }),
      }).catch(() => {});
    }
  };

  const progressPct = client.meals.total ? Math.round((client.meals.done / client.meals.total) * 100) : 0;
  const traj = TRAJECTORY_PARAMS[clientId] || TRAJECTORY_PARAMS.charlie;
  const sliceFor = (key) => {
    // Real clients: pull from realSeries (server-fetched daily_health_snapshot
    // for this client) and slice by range. Demo clients fall through to the
    // sin/cos-generated series below.
    if (client.isReal) {
      const series = client.realSeries && client.realSeries[key];
      if (!series) return [];
      const raw = series.filter(v => v != null);
      if (raw.length === 0) return [];
      if (range === "custom") return raw.slice(-Math.min(28, raw.length));
      return raw.slice(-Math.min(RANGE_DAYS[range], raw.length));
    }
    const full = trajSeries(traj[key], SERIES_DAYS);
    if (range !== "custom") return full.slice(-RANGE_DAYS[range]);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    let a = SERIES_DAYS - 1 - Math.round((today - new Date(customStart + "T00:00:00")) / 86400000);
    let b = SERIES_DAYS - 1 - Math.round((today - new Date(customEnd + "T00:00:00")) / 86400000);
    if (a > b) { const t = a; a = b; b = t; }
    a = Math.max(0, Math.min(SERIES_DAYS - 1, a));
    b = Math.max(0, Math.min(SERIES_DAYS - 1, b));
    return full.slice(a, b + 1);
  };
  const trajData = {
    score:   sliceFor("score"),
    weight:  sliceFor("weight"),
    protein: sliceFor("protein"),
    sleep:   sliceFor("sleep"),
  };
  // Real clients don't have Shape Score data yet, and may not have every
  // other metric either. Filter the tab list down to metrics with data.
  const metricsForView = client.isReal
    ? METRICS.filter(m => (trajData[m.key] || []).length > 0)
    : METRICS;
  const activeMetric = metricsForView.find(m => m.key === metric) || metricsForView[0];
  const windowLabel = range === "custom"
    ? shortDate(customStart) + " → " + shortDate(customEnd)
    : range.toUpperCase() + " WINDOW";

  return (
    <DashPage
      navItems={nutriNavItems("console")}
      payoutCard={nutriPayoutCard}
      eyebrow={<span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}><LiveDot /> LIVE COACHING</span>}
      title="Clients · Console"
      subtitle="See what a client is eating and recovering from right now — and coach them in the moment."
    >
      <div style={{ display: "flex", gap: 10, marginBottom: 20, flexWrap: "wrap" }}>
        {[
          { l: "All clients",    href: "NutritionistClients.html",     on: false },
          { l: "Shared clients", href: "NutritionistClients.html?tab=shared", on: false },
          { l: "Console",        href: "NutritionistLiveConsole.html", on: true  },
          { l: "Business",       href: "NutritionistAnalytics.html",   on: false },
        ].map((s, i) => (
          <a key={i} href={s.href} style={{ background: s.on ? "rgba(46,224,196,0.14)" : "transparent", color: s.on ? "#2ee0c4" : "rgba(242,237,228,0.65)", border: s.on ? "1px solid rgba(46,224,196,0.35)" : "1px solid rgba(242,237,228,0.12)", padding: "8px 16px", borderRadius: 999, fontFamily: "'Space Grotesk', sans-serif", fontSize: 12.5, fontWeight: 500, cursor: "pointer", letterSpacing: "0.02em", textDecoration: "none" }}>{s.l}</a>
        ))}
      </div>
      {/* Client picker — dropdown grouped by Current / Past */}
      <div style={{ position: "relative", display: "inline-block", marginBottom: 20 }}>
        <button
          onClick={() => setClientMenuOpen(o => !o)}
          style={{
            display: "flex", alignItems: "center", gap: 12,
            padding: "10px 18px", borderRadius: 999, cursor: "pointer",
            background: "rgba(242,237,228,0.04)",
            color: INK,
            border: "1px solid rgba(242,237,228,0.16)",
            fontFamily: sans, fontSize: 14, fontWeight: 500,
            minWidth: 260,
          }}
        >
          <span style={{ flex: 1, textAlign: "left" }}>{client.name}</span>
          {(client.status || "current") === "past" && (
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9, letterSpacing: "0.12em", color: "rgba(242,237,228,0.5)", padding: "2px 6px", border: "1px solid rgba(242,237,228,0.18)", borderRadius: 4 }}>PAST</span>
          )}
          <span style={{ fontSize: 10, color: "rgba(242,237,228,0.5)", transform: clientMenuOpen ? "rotate(180deg)" : "none", transition: "transform .15s" }}>▾</span>
        </button>
        {clientMenuOpen && (
          <React.Fragment>
            <div onClick={() => setClientMenuOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 40 }} />
            <div style={{
              position: "absolute", top: "calc(100% + 6px)", left: 0,
              background: "#14110e", border: "1px solid rgba(242,237,228,0.12)",
              borderRadius: 12, minWidth: 280, maxWidth: 340,
              boxShadow: "0 18px 48px rgba(0,0,0,0.55)",
              zIndex: 50, padding: "6px 0", overflow: "hidden",
            }}>
              {[["current", "Current"], ["past", "Past"]].map(([status, label]) => {
                const group = effectiveClients.filter(c => (c.status || "current") === status);
                if (group.length === 0) return null;
                return (
                  <div key={status}>
                    <div style={{
                      fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.14em",
                      textTransform: "uppercase", color: "rgba(242,237,228,0.45)",
                      padding: "10px 18px 6px",
                    }}>{label}</div>
                    {group.map(c => {

          <Card>
            <SectionTitle right="LIVE">Client right now</SectionTitle>
            <div style={{ fontFamily: serif, fontSize: 30, letterSpacing: "-0.02em", lineHeight: 1, marginTop: 4 }}>{client.name}</div>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.08em", color: "rgba(242,237,228,0.55)", marginTop: 8 }}>

          </div>
        )}
        <div style={{ display: "flex", gap: 4, marginBottom: 22, borderBottom: "1px solid rgba(242,237,228,0.08)" }}>
          {metricsForView.map(m => {
            const on = activeMetric && m.key === activeMetric.key;
            return (
              <button key={m.key} onClick={() => setMetric(m.key)} style={{
                padding: "12px 16px", cursor: "pointer",
                background: "transparent",
                color: on ? INK : "rgba(242,237,228,0.55)",
                border: 0,
                borderBottom: on ? "2px solid " + TEAL : "2px solid transparent",

        {activeMetric && (
          <TrajChart label={activeMetric.label} data={trajData[activeMetric.key]} unit={activeMetric.unit} goodWhen={activeMetric.goodWhen} windowLabel={windowLabel} />
        )}

      </Card>

      {/* Demo-only banner — hidden once /api/nutritionist/console responds as signed-in */}
      {!live && (

// ─── small UI primitives ─────────────────────────────────────
function InsetBox({ label, children }) {
  return (
    <div style={{ background: "rgba(242,237,228,0.03)", border: "1px solid rgba(242,237,228,0.08)", borderRadius: 12, padding: "14px 16px" }}>
      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: "rgba(242,237,228,0.5)", marginBottom: 10 }}>{label}</div>
      {children}
    </div>
  );
}

function StatBox({ icon, label, value, unit }) {
  return (
    <div style={{ background: "rgba(242,237,228,0.03)", border: "1px solid rgba(242,237,228,0.08)", borderRadius: 12, padding: "14px 16px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
        <span style={{ color: TEAL_BRIGHT, display: "inline-flex" }}>{icon}</span>
        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: "rgba(242,237,228,0.55)" }}>{label}</div>
      </div>
      <div style={{ fontFamily: serif, fontSize: 24, lineHeight: 1 }}>{value} <span style={{ fontSize: 12, color: "rgba(242,237,228,0.55)", fontFamily: sans }}>{unit}</span></div>
    </div>
  );
}

function ProgressBar({ pct }) {
  return (
    <div style={{ height: 4, background: "rgba(242,237,228,0.08)", borderRadius: 3, marginTop: 10, overflow: "hidden" }}>
      <div style={{ width: pct + "%", height: "100%", background: TEAL, transition: "width .3s" }} />
    </div>
  );
}

function FieldLabel({ children, title }) {
  return (
    <div title={title} style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.12em", textTransform: "uppercase", color: "rgba(242,237,228,0.55)", marginBottom: 6 }}>{children}</div>
  );
}

function ConsoleInput({ value, onChange, placeholder }) {
  return (
    <input
      value={value}
      onChange={(e) => onChange(e.target.value)}
      placeholder={placeholder}
      style={{ width: "100%", background: "rgba(242,237,228,0.04)", color: INK, border: "1px solid rgba(242,237,228,0.1)", borderRadius: 8, padding: "10px 12px", fontSize: 14, outline: "none", fontFamily: sans }}
    />
  );
}

function LiveDot() {
  return (
    <span style={{ width: 7, height: 7, borderRadius: "50%", background: TEAL_BRIGHT, display: "inline-block", boxShadow: "0 0 0 4px rgba(46,224,196,0.18)" }} />
  );
}

function HeartIcon() {
  return (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
  );
}
function MoonIcon() {
  return (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  );
}
function PulseIcon() {
  return (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
  );
}

function TrajChart({ label, data, unit, goodWhen, windowLabel }) {
  if (!data || data.length === 0) return null;
  const w = 100, h = 40;
  const min = Math.min.apply(null, data);
  const max = Math.max.apply(null, data);
  const span = max - min || 1;
  const pts = data.map((v, i) => {
    const x = data.length === 1 ? w / 2 : (i / (data.length - 1)) * w;
    const y = h - ((v - min) / span) * h;
    return [x, y];
  });
  const line = pts.map(([x, y], i) => (i === 0 ? "M" : "L") + x.toFixed(2) + "," + y.toFixed(2)).join(" ");
  const area = "M0," + h + " " + pts.map(([x, y]) => "L" + x.toFixed(2) + "," + y.toFixed(2)).join(" ") + " L" + w + "," + h + " Z";
  const latest = data[data.length - 1];
  const first  = data[0];
  const delta  = latest - first;
  const tiny   = Math.abs(delta) < Math.max(Math.abs(first) * 0.005, 0.5);
  const good   = goodWhen === "up" ? delta > 0 : delta < 0;
  const deltaColor = tiny ? "rgba(242,237,228,0.55)" : good ? TEAL_BRIGHT : "#e07856";
  const fmt = (v) => {
    if (Math.abs(v) >= 100) return Math.round(v).toLocaleString();
    if (Math.abs(v) >= 10)  return v.toFixed(1).replace(/\.0$/, "");
    return v.toFixed(1);
  };
  const sign = delta > 0 ? "+" : "";
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 18 }}>
        <div>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.14em", textTransform: "uppercase", color: "rgba(242,237,228,0.55)" }}>{label}</div>
          <div style={{ fontFamily: serif, fontSize: 40, lineHeight: 1, letterSpacing: "-0.02em", marginTop: 6 }}>
            {fmt(latest)}<span style={{ fontSize: 16, color: "rgba(242,237,228,0.55)", fontFamily: sans, marginLeft: 4 }}>{unit}</span>
          </div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, letterSpacing: "0.06em", color: deltaColor, fontWeight: 500 }}>
            {sign}{fmt(delta)}{unit}
          </div>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: "rgba(242,237,228,0.4)", marginTop: 4, letterSpacing: "0.08em" }}>
            {windowLabel || (data.length + "D WINDOW")}
          </div>
        </div>
      </div>
      <svg viewBox={"0 0 " + w + " " + h} preserveAspectRatio="none" style={{ width: "100%", height: 200, display: "block" }}>
        <defs>
          <linearGradient id="trajGradBig" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stopColor={TEAL} stopOpacity="0.25" />
            <stop offset="100%" stopColor={TEAL} stopOpacity="0" />
          </linearGradient>
        </defs>
        <path d={area} fill="url(#trajGradBig)" />
        <path d={line} fill="none" stroke={TEAL} strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10, fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.08em", color: "rgba(242,237,228,0.45)" }}>
        <span>LOW {fmt(min)}{unit}</span>
        <span>HIGH {fmt(max)}{unit}</span>
      </div>
    </div>
  );
}

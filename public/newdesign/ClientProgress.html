<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Progress · Shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#1a1612}*{box-sizing:border-box}a{text-decoration:none;color:inherit}</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="pageShell.jsx"></script>
<script type="text/babel" src="chatWidget.jsx"></script>
<script type="text/babel" src="clientChatThreads.jsx"></script>
<script type="text/babel" src="trainerDashboard.jsx"></script>
<script type="text/babel" src="clientNav.jsx"></script>
<script type="text/babel">
function BigChart({ points, height = 260 }) {
  const W = 1000, H = height, pad = 28;
  const max = Math.max(...points);
  const min = Math.min(...points);
  const range = max - min || 1;
  const step = (W - pad * 2) / (points.length - 1);
  const path = points.map((v, i) => {
    const x = pad + i * step;
    const y = H - pad - ((v - min) / range) * (H - pad * 2);
    return `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const area = path + ` L${pad + (points.length - 1) * step},${H - pad} L${pad},${H - pad} Z`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
      <defs>
        <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor={TEAL} stopOpacity="0.25" />
          <stop offset="100%" stopColor={TEAL} stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0, 0.25, 0.5, 0.75, 1].map(t => (
        <line key={t} x1={pad} x2={W - pad} y1={pad + t * (H - pad * 2)} y2={pad + t * (H - pad * 2)} stroke="rgba(242,237,228,0.06)" />
      ))}
      <path d={area} fill="url(#g)" />
      <path d={path} fill="none" stroke={TEAL} strokeWidth="2" />
    </svg>
  );
}

function fmtWeightChange(c) {
  if (c == null) return "—";
  const r = Math.round(c);
  return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r) + " lb";
}
function prDate(iso) {
  if (!iso) return "";
  try { return new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" }); }
  catch (e) { return ""; }
}

// Mock data — shown while the API loads, or when the viewer is signed out.
const MOCK_PROGRESS = {
  weightSeries: [184,183,184,182,181,181,180,179,178,178,177,177,176,175,176,174,173,173,172,171].map((v) => ({ value: v })),
  kpis: { weightChange: -13, weightLatest: 171, bodyFatLatest: 22.1, bodyFatFirst: 26.4, restingHr: 58, restingHrDelta: -6, sleepAvg: 7.4 },
  prs: [
    { move: "Back squat", best: 265, bestReps: 5, unit: "lb", bestAt: "2026-04-16" },
    { move: "Deadlift", best: 345, bestReps: 2, unit: "lb", bestAt: "2026-04-14" },
    { move: "Bench press", best: 200, bestReps: 3, unit: "lb", bestAt: "2026-04-09" },
    { move: "Overhead press", best: 135, bestReps: 5, unit: "lb", bestAt: "2026-04-02" },
  ],
};

function ClientProgressPage() {
  const [data, setData] = React.useState(MOCK_PROGRESS);
  const [live, setLive] = React.useState(false);

  React.useEffect(() => {
    let cancelled = false;
    fetch('/api/client/progress', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (!cancelled && d && d.ok) { setData(d); setLive(true); } })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const kpis = data.kpis || {};
  const points = (data.weightSeries || []).map(s => s.value);
  const prs = data.prs || [];

  const kpiCards = [
    { k: fmtWeightChange(kpis.weightChange), l: "Bodyweight change", sub: kpis.weightLatest != null ? `now ${Math.round(kpis.weightLatest)} lb` : "no weigh-ins yet" },
    { k: kpis.bodyFatLatest != null ? kpis.bodyFatLatest.toFixed(1) + "%" : "—", l: "Body fat", sub: kpis.bodyFatFirst != null ? `from ${kpis.bodyFatFirst.toFixed(1)}%` : "latest reading" },
    { k: kpis.restingHr != null ? kpis.restingHr + " bpm" : "—", l: "Resting HR", sub: kpis.restingHrDelta != null ? `${kpis.restingHrDelta > 0 ? "+" : kpis.restingHrDelta < 0 ? "−" : ""}${Math.abs(kpis.restingHrDelta)} vs prior week` : "7-day average" },
    { k: kpis.sleepAvg != null ? kpis.sleepAvg + " h" : "—", l: "Sleep", sub: "30-day average" },
  ];

  return (
    <DashPage
      navItems={clientNavItems("progress")}
      payoutCard={clientPayoutCard}
      eyebrow="STRENGTH · BODY · RECOVERY"
      title="Progress"
      subtitle="Everything your team tracks — rolled up from your workouts, weigh-ins, wearables and logs."
    >
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 16, marginBottom: 20 }}>
        {kpiCards.map((k, i) => (
          <Card key={i} style={{ padding: "22px 22px 20px" }}>
            <div style={{ fontFamily: serif, fontSize: 42, fontWeight: 400, letterSpacing: "-0.02em", lineHeight: 1 }}>{k.k}</div>
            <div style={{ fontSize: 13, marginTop: 12 }}>{k.l}</div>
            <div style={{ fontSize: 11, color: "rgba(242,237,228,0.5)", marginTop: 4 }}>{k.sub}</div>
          </Card>
        ))}
      </div>

      <Card style={{ marginBottom: 20 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
          <div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>Bodyweight</div>
            <div style={{ fontSize: 12, color: "rgba(242,237,228,0.5)", marginTop: 2 }}>lb · from your weigh-ins</div>
          </div>
        </div>
        {points.length >= 2 ? (
          <BigChart points={points} />
        ) : (
          <div style={{ padding: "48px 4px", textAlign: "center", color: "rgba(242,237,228,0.5)", fontSize: 13 }}>
            {live ? "Log a couple of weigh-ins to see your trend here." : "Not enough data yet."}
          </div>
        )}
      </Card>

      <Card>
        <SectionTitle right="FROM YOUR LOGGED SETS">Personal records</SectionTitle>
        {prs.length === 0 && (
          <div style={{ padding: "26px 4px", color: "rgba(242,237,228,0.5)", fontSize: 13 }}>
            No logged sets yet. Your heaviest lifts will appear here once you start training.
          </div>
        )}
        {prs.length > 0 && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 0 }}>
            {prs.map((p, i) => (
              <div key={i} style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr 70px", gap: 16, alignItems: "center", padding: "16px 4px", borderTop: i < 2 ? "none" : "1px solid rgba(242,237,228,0.06)", borderLeft: i % 2 === 1 ? "1px solid rgba(242,237,228,0.06)" : "none", paddingLeft: i % 2 === 1 ? 24 : 4 }}>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 500 }}>{p.move}</div>
                  <div style={{ fontSize: 11.5, color: "rgba(242,237,228,0.5)", marginTop: 2 }}>{prDate(p.bestAt)}</div>
                </div>
                <div style={{ fontFamily: serif, fontSize: 20, letterSpacing: "-0.01em" }}>{Math.round(p.best)} {p.unit}</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: TEAL_BRIGHT, textAlign: "right" }}>{p.bestReps != null ? "× " + p.bestReps : ""}</div>
              </div>
            ))}
          </div>
        )}
      </Card>
    </DashPage>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(
  <React.Fragment>
    <ClientProgressPage />
    <ChatWidget tabs={clientChatTabs} />
  </React.Fragment>
);
</script>
<script src="globalChatButton.js" defer></script>
</body>
</html>

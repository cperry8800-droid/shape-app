<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Trainer Analytics · Shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#1a1612}*{box-sizing:border-box}a{text-decoration:none;color:inherit}</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="pageShell.jsx"></script>
<script type="text/babel" src="trainerDashboard.jsx"></script>
<script type="text/babel" src="coachNav.jsx"></script>
<script type="text/babel">
function atRiskParam(){ try { return (new URLSearchParams(location.search).get("client") || "").toLowerCase(); } catch(e){ return ""; } }
function titleCaseSlug(slug){ return slug.split("-").filter(Boolean).map(function(w){ return w.charAt(0).toUpperCase()+w.slice(1); }).join(" "); }

var CLIENT_RISK = {
  "priya-shah": {
    name: "Priya Shah", adherence: "92%", streak: "14d", level: "FLAG", flagged: "Today",
    drivers: [
      { tag: "ADHR",  title: "Adherence slipped mid-block", detail: "92% overall, but 3 of the last 5 sessions only partially logged — volume completion down to 74%.", status: "FLAG" },
      { tag: "ENGMT", title: "Check-in unanswered", detail: "Last coach message read but no reply for 4 days.", status: "FLAG" },
      { tag: "RECOV", title: "Load tolerance trending down", detail: "Reported RPE up ~1.5 at the same loads; sleep under 6h on 4 of 7 nights.", status: "WATCH" },
    ],
    action: "Send a short personal check-in today, hold week-4 progression, and keep load flat until sleep stabilizes 3+ nights.",
  },
};

function riskFor(slug){
  if (CLIENT_RISK[slug]) return CLIENT_RISK[slug];
  var name = titleCaseSlug(slug) || "This client";
  return {
    name: name, adherence: "—", streak: "—", level: "WATCH", flagged: "Today",
    drivers: [
      { tag: "ADHR",  title: "Adherence below threshold", detail: name + " has dropped under the 85% adherence line across the last 7 days.", status: "FLAG" },
      { tag: "ENGMT", title: "Reduced engagement", detail: "Fewer logged sessions and slower replies to coach messages.", status: "WATCH" },
      { tag: "RECOV", title: "Recovery signals soft", detail: "Sleep and readiness trending below personal baseline.", status: "WATCH" },
    ],
    action: "Reach out with a personal check-in, ease this week's progression, and reassess in 3 days.",
  };
}

function TrainerAnalyticsPage() {
  var slug = atRiskParam();
  var f = slug ? riskFor(slug) : null;

  var kpis = f
    ? [ { k: f.adherence, l: "Adherence" }, { k: f.streak, l: "Streak" }, { k: f.level, l: "Risk" }, { k: f.flagged, l: "Flagged" } ]
    : [ { k: "92%", l: "Avg adherence" }, { k: "18d", l: "Avg streak" }, { k: "$7,640", l: "MRR" }, { k: "3", l: "At-risk today" } ];

  var scheduleTitle = f ? ("Why " + f.name + " is at risk") : "At-risk clients";
  var schedule = f
    ? f.drivers.map(function(d){ return { time: d.tag, who: d.title, sub: d.detail, status: d.status }; })
    : [
        { time: "NOW", who: "Casey Lee",   sub: "Macros 31% under target · 2 days", status: "FLAG" },
        { time: "NOW", who: "Drew Park",   sub: "Missed last session · no message 8d", status: "FLAG" },
        { time: "NOW", who: "Jonah Weiss", sub: "Sleep + recovery trend down", status: "WATCH" },
      ];

  var extraSections = [];
  if (f) extraSections.push({
    title: "Recommended action",
    render: function(){ return (
      <div style={{ padding: 20, border: "1px solid rgba(242,237,228,0.12)", borderRadius: 12 }}>
        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: "rgba(242,237,228,0.7)", marginBottom: 10 }}>FOR {f.name.toUpperCase()}</div>
        <div style={{ fontFamily: "Fraunces, serif", fontSize: 22, lineHeight: 1.25, color: "#f2ede4", marginBottom: 12 }}>{f.action}</div>
        <a href="TrainerClients.html" style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.14em", color: "#2ee0c4" }}>← BACK TO CLIENTS</a>
      </div>
    ); },
  });
  extraSections.push({
    title: "Correlations",
    render: function(){ return (
      <div style={{ padding: 20, border: "1px solid rgba(242,237,228,0.12)", borderRadius: 12 }}>
        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: "rgba(242,237,228,0.7)", marginBottom: 10 }}>ANALYTICS PRO · LIVE</div>
        <div style={{ fontFamily: "Fraunces, serif", fontSize: 22, lineHeight: 1.2, color: "#f2ede4", marginBottom: 8 }}>Sleep <span style={{ color: "#1ec0a8" }}>&#8593;</span> and macro adherence <span style={{ color: "#1ec0a8" }}>&#8593;</span> correlate with PR rate in 12 of 14 active clients.</div>
        <div style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 14, color: "rgba(242,237,228,0.72)" }}>Focus outreach on the flagged clients first, then push week-4 progression only where sleep is stable.</div>
      </div>
    ); },
  });

  return (
    <DashShell
      role="trainer"
      userName="Maya"
      date="WEDNESDAY APR 18"
      greeting={f ? ("Analytics — " + f.name) : "Analytics."}
      primaryCta={["Clients", "TrainerClients.html"]}
      secondaryCta={["Programs", "TrainerPrograms.html"]}
      navItems={trainerNavItems("analytics")}
      payoutCard={trainerPayoutCard}
      kpis={kpis}
      scheduleTitle={scheduleTitle}
      schedule={schedule}
      pulseTitle="Compliance signals"
      pulse={[
        { who: "Workout compliance", sub: "88% · vs 82% prior 30d", trend: [0.4,0.5,0.6,0.55,0.62,0.7,0.74] },
        { who: "Nutrition compliance", sub: "84% · vs 79% prior 30d", trend: [0.35,0.38,0.45,0.5,0.56,0.6,0.65] },
        { who: "Sleep target hit", sub: "71% · 7h+ goal", trend: [0.3,0.36,0.4,0.35,0.44,0.5,0.48] },
        { who: "Recovery readiness", sub: "Avg 67%", trend: [0.45,0.5,0.48,0.52,0.58,0.61,0.66] },
      ]}
      extraSections={extraSections}
    />
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<TrainerAnalyticsPage />);
</script>
<script src="globalChatButton.js" defer></script>
</body>
</html>

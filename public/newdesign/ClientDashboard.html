<html>
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#1a1612}*{box-sizing:border-box}a{text-decoration:none;color:inherit}</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="pageShell.jsx"></script>
<script type="text/babel" src="chatWidget.jsx"></script>
<script type="text/babel" src="clientChatThreads.jsx"></script>
<script type="text/babel" src="trainerDashboard.jsx"></script>
<script type="text/babel" src="clientNav.jsx"></script>
<script type="text/babel" src="habits.jsx"></script>
<script type="text/babel" src="recipes.jsx"></script>
<script type="text/babel">
const CLIENT_CAL_EVENTS = [
  { date: "2026-04-13", time: "07:00", kind: "WORKOUT", title: "Lower push",   sub: "60 min · with Maya" },
  { date: "2026-04-13", time: "12:30", kind: "MEAL",    title: "Chicken bowl", sub: "620 cal" },
  { date: "2026-04-14", time: "08:00", kind: "WORKOUT", title: "Mobility",     sub: "30 min · solo" },
  { date: "2026-04-14", time: "13:00", kind: "MEAL",    title: "Salmon + quinoa", sub: "720 cal" },
  { date: "2026-04-15", time: "17:30", kind: "WORKOUT", title: "Upper push",   sub: "Bench 4×6 · 185 lb" },
  { date: "2026-04-15", time: "19:00", kind: "MEAL",    title: "Post-lift shake", sub: "30g whey" },
  { date: "2026-04-16", time: "06:30", kind: "WORKOUT", title: "Long run",     sub: "Prospect Park 10k" },
  { date: "2026-04-16", time: "18:00", kind: "CHECKIN", title: "Rae · nutrition", sub: "Video · 20 min" },
  { date: "2026-04-17", time: "09:00", kind: "WORKOUT", title: "Upper pull",   sub: "45 min · 6 exercises" },
  { date: "2026-04-17", time: "12:30", kind: "MEAL",    title: "Grilled chicken bowl", sub: "620 cal · 52g P" },
  { date: "2026-04-18", time: "09:00", kind: "WORKOUT", title: "Upper Body Pull", sub: "45 min · 6 exercises" },
  { date: "2026-04-18", time: "12:30", kind: "MEAL",    title: "Grilled chicken bowl", sub: "620 cal" },
  { date: "2026-04-18", time: "18:30", kind: "CHECKIN", title: "Weekly w/ Maya", sub: "20 min · video" },
  { date: "2026-04-19", time: "10:00", kind: "WORKOUT", title: "Rest / mobility", sub: "20 min" },
  { date: "2026-04-20", time: "07:30", kind: "WORKOUT", title: "Lower pull",   sub: "Deadlift 5×3" },
  { date: "2026-04-21", time: "17:00", kind: "WORKOUT", title: "Upper push",   sub: "Tempo" },
  { date: "2026-04-22", time: "18:00", kind: "CHECKIN", title: "Bloodwork review", sub: "Rae · 30 min" },
  { date: "2026-04-24", time: "08:00", kind: "WORKOUT", title: "Accessory",    sub: "Arms + core" },
  { date: "2026-04-25", time: "09:00", kind: "WORKOUT", title: "Long run",     sub: "12k" },
  { date: "2026-04-28", time: "17:30", kind: "CHECKIN", title: "Monthly review", sub: "Maya + Rae" },
  { date: "2026-04-30", time: "07:00", kind: "WORKOUT", title: "Strength test", sub: "Squat 1RM" },
];

// Mock data — shown while the live dashboard API is loading, or when it's
// unreachable (e.g. previewing this page signed out).
const MOCK_CLIENT_KPIS = [
  { k: "14d", l: "Current streak", sub: "best 22d" },
  { k: "4/6", l: "Workouts this week", sub: "on track" },
  { k: "92%", l: "Plan adherence", sub: "last 30d" },
  { k: "+22", l: "Squat PR (lb)", sub: "since Feb" },
];
const MOCK_CLIENT_SCHEDULE = [
  { time: "TUE", who: "Upper push · Maya", sub: "Bench 4×6 · 185lb", status: "DONE" },
  { time: "WED", who: "Intake call · Rae", sub: "Nutrition baseline", status: "NEXT" },
  { time: "THU", who: "Lower pull · Maya", sub: "Remote · video review" },
  { time: "FRI", who: "Rest day", sub: "Mobility 10 min" },
  { time: "SAT", who: "Long run · Diego", sub: "Prospect Park 10k" },
];
function cdFmtDay(iso) {
  try { return new Date(iso).toLocaleDateString([], { weekday: "short" }).toUpperCase(); }
  catch (e) { return ""; }
}
function cdFmtTime(iso) {
  try { return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  catch (e) { return ""; }
}
function cdCalDate(iso) {
  try { const d = new Date(iso); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
  catch (e) { return ""; }
}
function cdCalTime(iso) {
  try { const d = new Date(iso); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
  catch (e) { return ""; }
}
const CD_FLAT_TREND = [0.5,0.5,0.5,0.5,0.5,0.5,0.5];
const MOCK_CLIENT_PULSE = [
  { who: "Maya Okafor",   sub: "Trainer · replied 2m", trend: [0.3,0.5,0.4,0.7,0.6,0.8,0.7] },
  { who: "Rae Lindqvist", sub: "Nutritionist · 14m",   trend: [0.4,0.3,0.5,0.4,0.6,0.5,0.7] },
];

function ClientDashboardPage() {
  const [live, setLive] = React.useState(null);
  React.useEffect(() => {
    let cancelled = false;
    fetch('/api/client/dashboard', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (!cancelled && d && d.kpis) setLive(d); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const firstName = live ? live.user.firstName : "Priya";
  const kpis = live ? [
    { k: live.kpis.streak + "d", l: "Current streak", sub: live.kpis.streak ? "keep it going" : "start today" },
    { k: String(live.kpis.workoutsThisWeek), l: "Workouts this week", sub: "logged" },
    { k: String(live.kpis.totalWorkouts), l: "Total workouts", sub: "all time" },
    { k: live.kpis.lastDurationMin ? live.kpis.lastDurationMin + "m" : "—", l: "Last session", sub: live.kpis.totalWorkouts ? "duration" : "none yet" },
  ] : MOCK_CLIENT_KPIS;

  const upcoming = live && Array.isArray(live.upcoming) ? live.upcoming : null;
  const schedule = !upcoming
    ? MOCK_CLIENT_SCHEDULE
    : upcoming.length
      ? upcoming.map((u, i) => ({
          time: cdFmtDay(u.scheduledAt),
          who: u.topic || (u.providerName ? "Session · " + u.providerName : "Coaching session"),
          sub: [cdFmtTime(u.scheduledAt), (u.durationMin || 15) + " min", u.type].filter(Boolean).join(" · "),
          status: i === 0 ? (u.status === "confirmed" ? "NEXT" : "PENDING") : undefined,
        }))
      : [{ time: "—", who: "No upcoming sessions", sub: "Book a session with your coach" }];
  const scheduleTitle = upcoming ? "Upcoming sessions" : "This week";

  const calendarEvents = live && Array.isArray(live.calendar)
    ? live.calendar.map(e => ({ date: cdCalDate(e.at), time: cdCalTime(e.at), kind: e.kind, title: e.title, sub: e.sub }))
    : CLIENT_CAL_EVENTS;
  const team = live && Array.isArray(live.team) ? live.team : null;
  const pulse = !team
    ? MOCK_CLIENT_PULSE
    : team.length
      ? team.map(m => ({ who: m.name, sub: m.role, trend: CD_FLAT_TREND }))
      : [{ who: "No coaches yet", sub: "Browse the marketplace", trend: CD_FLAT_TREND }];

  return (
    <DashShell
      role="client"
      userName={firstName}
      date="WEDNESDAY APR 18"
      greeting={"Welcome back, " + firstName + "."}
      primaryCta={["Log workout", "ClientTrain.html"]}
      secondaryCta={["Book session", "ClientTeam.html"]}
      navItems={clientNavItems("today")}
      payoutCard={clientPayoutCard}
      kpis={kpis}
      scheduleTitle={scheduleTitle}
      todayItems={[
        { time: "9:00 AM",  kind: "WORKOUT",  title: "Upper Body Pull",      sub: "45 min · 6 exercises · programmed by Marcus", cta: { label: "START", primary: true, href: "ClientTrain.html" },
          playlist: { name: "Upper Pull — Peak", provider: "spotify", bpm: "95–130", tracks: 31, accent: "#6a8cff", cover: "linear-gradient(135deg, #2a3a6a 0%, #1a1612 70%)", note: "Builds across the session. Peaks at top sets.", author: "Marcus", href: "ClientPlaylists.html" } },
        { time: "12:30 PM", kind: "MEAL",     title: "Grilled chicken bowl", sub: "620 cal · 52g P · 68g C · 18g F",              cta: { label: "LOG MEAL", href: "ClientNutri.html" } },
        { time: "6:30 PM",  kind: "CHECK-IN", title: "Weekly with Marcus",   sub: "20 min · video call",                          cta: { label: "JOIN", href: "ClientTeam.html" } },
      ]}
      schedule={schedule}
      calendarEvents={calendarEvents}
      pulseTitle="Your team"
      pulse={pulse}
      extraSections={[
        {
          title: "Today's habits",
          render: () => <HabitsWidget max={6} />,
        },
        {
          title: "Recipe of the day",
          render: () => <RecipeOfTheDayWidget />,
        },
        {
          title: "This week's focus",
          render: () => (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 16 }}>
              {[
                ["Overreach week", "Push 185 today, deload next week. Ice shoulder tonight.", "Maya · 9:02"],
                ["Post-run fueling", "30g whey + 60g carbs within 45 min. Template added to your plan.", "Rae · Tue"],
                ["Sleep protocol", "Mg glycinate 300mg PM, no caffeine after 1pm for 2 weeks.", "Rae · 9:16"],
              ].map(([t, b, m], i) => (
                <div key={i} style={{ padding: 18, background: "rgba(10,197,168,0.06)", border: "1px solid rgba(10,197,168,0.2)", borderRadius: 8 }}>
                  <div style={{ fontFamily: serif, fontSize: 22, letterSpacing: "-0.015em", marginBottom: 6 }}>{t}</div>
                  <div style={{ fontSize: 13, color: "rgba(242,237,228,0.75)", lineHeight: 1.5 }}>{b}</div>
                  <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: TEAL_BRIGHT, letterSpacing: "0.1em", marginTop: 12 }}>{m}</div>
                </div>
              ))}
            </div>
          )
        }
      ]}
    />
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(
  <React.Fragment>
    <ClientDashboardPage />
    <ChatWidget tabs={clientChatTabs} />
  </React.Fragment>
);
</script>
<script src="globalChatButton.js" defer></script>
</body>
</html>

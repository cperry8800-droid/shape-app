// Role guard — keep the dashboard in sync with the signed-in user's ACTIVE role.
// A client/nutritionist who lands on the trainer SPA is redirected to their own
// dashboard. Signed-out preview and trainers are unaffected (no redirect).
(function () {
  fetch('/api/me', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var role = d && d.user && d.user.role;
      var dash = role === 'client' ? 'ClientApp.html' : role === 'nutritionist' ? 'NutritionistApp.html' : null;
      if (dash) window.location.replace('/newdesign/' + dash + (window.location.hash || ''));
    })
    .catch(function () {});
})();
</script>

<script type="text/babel" data-presets="react">
// Each route renders exactly what the standalone trainer page mounted; only the
// navigation is now client-side (no reload, no recompile per tab).
// Playlists context (was inline on TrainerPlaylists.html).
const TRAINER_CTX = {
  role: "trainer",
  playlists: TRAINER_PLAYLISTS,
  attachTargets: TRAINER_WORKOUTS,
  attachmentUnit: "workout",
  attachmentUnitPlural: "workouts",
  navItems: trainerNavItems,
  payoutCard: trainerPayoutCard,
  subtitle: "Paste a Spotify or Apple Music link, attach it to a workout, and your client gets a play button on the session card. Optional, always skippable."
};
// Tells dashClientPageHref() that a client link is the `#client/<id>` route here
// (an instant, same-document switch that keeps the sidebar), not the standalone page.
window.__shapeCoachShell = "trainer";
window.__shapeDashShell = "trainer";   // read by pageShell's dashShellHref (R19)
const TA_ROUTES = {
  today:     () => <CoachDashboardPage role="trainer" />,
  week:      () => <CoachWeekPage role="trainer" />,
  schedule:  () => <CoachSchedulePage role="trainer" />,
  clients:   () => <TrainerClientsPage />,
  programs:  () => <TrainerProgramsPage />,
  business:  () => <CoachBusinessPage role="trainer" />,
  playlists: () => <PlaylistPage ctx={TRAINER_CTX} />,
  community: () => <CommunityPage navItems={trainerNavItems("community")} payoutCard={trainerPayoutCard} />,
  goal:      () => <TrainerGoalPage />,
  score:     () => <TrainerScorePage />,
  profile:   () => <LiveProfilePage demoRole="trainer" shell={{ navItems: trainerNavItems("profile"), payoutCard: trainerPayoutCard }} extras={<DashProfileExtras />} />,
  // The per-client deep dive (review 2026-09-09, R2): the same page TrainerClient.html /
  // NutritionistClient.html mount standalone, keyed so switching clients remounts it.
  client:    (id) => <CoachClientDetailPage key={id} clientId={id} role="trainer" inShell />,
};
function taParse() {
  const raw = (window.location.hash || "").replace(/^#/, "");
  const m = /^client\/(.+)$/.exec(raw);
  if (m) { try { return { slug: "client", param: decodeURIComponent(m[1]) }; } catch (e) { return { slug: "clients", param: null }; } }
  const h = raw.toLowerCase();
  // hasOwnProperty, not a bare lookup: `#constructor` resolves through
  // Object.prototype, and the route call then returns an Object that React
  // throws on instead of falling back to Today.
  const known = h !== "client" && Object.prototype.hasOwnProperty.call(TA_ROUTES, h);
  return { slug: known ? h : "today", param: null };
}
function TrainerApp() {
  const [route, setRoute] = React.useState(taParse());
  React.useEffect(() => {
    if (!window.location.hash) { try { window.history.replaceState(null, "", "#" + route.slug); } catch (e) {} }
    const onHash = () => { setRoute(taParse()); try { window.scrollTo(0, 0); } catch (e) {} };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  const view = Object.prototype.hasOwnProperty.call(TA_ROUTES, route.slug) ? TA_ROUTES[route.slug] : TA_ROUTES.today;
  return view(route.param);
}
ReactDOM.createRoot(document.getElementById("root")).render(<TrainerApp />);
window.ShapeDashTour && window.ShapeDashTour.init('trainer');
</script>

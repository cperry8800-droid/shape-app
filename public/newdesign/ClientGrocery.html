<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Grocery list · Shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#1a1612}*{box-sizing:border-box}a{text-decoration:none;color:inherit}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="pageShell.jsx"></script>
<script type="text/babel" src="chatWidget.jsx"></script>
<script type="text/babel" src="clientChatThreads.jsx"></script>
<script type="text/babel" src="trainerDashboard.jsx"></script>
<script type="text/babel" src="clientNav.jsx"></script>
<script type="text/babel">
const CATEGORIES = [
  { key: "protein", label: "Protein",  color: "#e07856" },
  { key: "produce", label: "Produce",  color: "#a3e09a" },
  { key: "dairy",   label: "Dairy",    color: "#7ed4ff" },
  { key: "pantry",  label: "Pantry",   color: "#f4b860" },
  { key: "frozen",  label: "Frozen",   color: "#b390f5" },
  { key: "other",   label: "Other",    color: "rgba(242,237,228,0.6)" },
];

const SEED_GROCERY = [
  { id: "g1", item: "Chicken breast",       qty: "3 lb",     category: "protein", checked: false, fromPlan: true },
  { id: "g2", item: "Salmon fillets",        qty: "2",        category: "protein", checked: false, fromPlan: true },
  { id: "g3", item: "Greek yogurt",          qty: "32 oz",    category: "dairy",   checked: false, fromPlan: true },
  { id: "g4", item: "Whey protein",          qty: "1 tub",    category: "pantry",  checked: false, fromPlan: true },
  { id: "g5", item: "Sweet potatoes",        qty: "5",        category: "produce", checked: false, fromPlan: true },
  { id: "g6", item: "Broccoli",              qty: "2 heads",  category: "produce", checked: false, fromPlan: true },
  { id: "g7", item: "Avocados",              qty: "4",        category: "produce", checked: false, fromPlan: false },
  { id: "g8", item: "Brown rice",            qty: "2 lb",     category: "pantry",  checked: false, fromPlan: true },
  { id: "g9", item: "Oats (rolled)",         qty: "1 box",    category: "pantry",  checked: false, fromPlan: false },
  { id: "g10", item: "Almond milk",          qty: "64 oz",    category: "dairy",   checked: true,  fromPlan: false },
  { id: "g11", item: "Frozen mixed berries", qty: "2 bags",   category: "frozen",  checked: true,  fromPlan: false },
  { id: "g12", item: "Eggs",                 qty: "18 ct",    category: "dairy",   checked: false, fromPlan: true },
  { id: "g13", item: "Spinach",              qty: "1 bag",    category: "produce", checked: false, fromPlan: true },
  { id: "g14", item: "Olive oil",            qty: "1 btl",    category: "pantry",  checked: true,  fromPlan: false },
  { id: "g15", item: "Almonds (raw)",        qty: "1 lb",     category: "pantry",  checked: false, fromPlan: false },
  { id: "g16", item: "Cottage cheese",       qty: "16 oz",    category: "dairy",   checked: false, fromPlan: false },
];

function loadGrocery() {
  try {
    const raw = window.localStorage.getItem("shape.grocery");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return SEED_GROCERY;
}
function saveGrocery(list) {
  try { window.localStorage.setItem("shape.grocery", JSON.stringify(list)); } catch (e) {}
}

function ClientGroceryPage() {
  const [items, setItems] = React.useState(loadGrocery);
  const [filter, setFilter] = React.useState("buy"); // buy | have | all
  const [search, setSearch] = React.useState("");
  const [newItem, setNewItem] = React.useState("");
  const [newQty, setNewQty] = React.useState("");
  const [newCat, setNewCat] = React.useState("other");

  React.useEffect(() => { saveGrocery(items); }, [items]);

  const toggle = (id) => setItems(prev => prev.map(it => it.id === id ? { ...it, checked: !it.checked } : it));
  const remove = (id) => setItems(prev => prev.filter(it => it.id !== id));
  const addItem = () => {
    const name = newItem.trim();
    if (!name) return;
    const id = "u" + Date.now();
    setItems(prev => [{ id, item: name, qty: newQty.trim() || "1", category: newCat, checked: false, fromPlan: false }, ...prev]);
    setNewItem(""); setNewQty(""); setNewCat("other");
  };
  const clearChecked = () => {
    if (!confirm("Clear all checked items?")) return;
    setItems(prev => prev.filter(it => !it.checked));
  };
  const checkAll = () => setItems(prev => prev.map(it => ({ ...it, checked: true })));
  const uncheckAll = () => setItems(prev => prev.map(it => ({ ...it, checked: false })));

  const q = search.trim().toLowerCase();
  const visible = items.filter(it => {
    if (filter === "buy" && it.checked) return false;
    if (filter === "have" && !it.checked) return false;
    if (q && !it.item.toLowerCase().includes(q)) return false;
    return true;
  });

  const grouped = CATEGORIES.map(cat => ({
    ...cat,
    items: visible.filter(it => it.category === cat.key),
  })).filter(g => g.items.length > 0);

  const toBuyCount = items.filter(it => !it.checked).length;
  const haveCount = items.filter(it => it.checked).length;
  const fromPlanCount = items.filter(it => it.fromPlan && !it.checked).length;

  const FilterPill = ({ k, label, count }) => {
    const active = filter === k;
    return (
      <button onClick={() => setFilter(k)} style={{
        fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.1em",
        padding: "7px 14px", borderRadius: 999,
        background: active ? INK : "rgba(242,237,228,0.04)",
        color: active ? PAPER : "rgba(242,237,228,0.7)",
        border: active ? "none" : "1px solid rgba(242,237,228,0.12)",
        cursor: "pointer",
      }}>{label}{count != null ? ` · ${count}` : ""}</button>
    );
  };

  const cards = [
    { k: String(toBuyCount), l: "To buy" },
    { k: String(fromPlanCount), l: "From your plan" },
    { k: String(haveCount), l: "Have" },
    { k: String(items.length), l: "Total" },
  ];

  return (
    <DashPage
      navItems={clientNavItems("nutri")}
      payoutCard={clientPayoutCard}
      eyebrow="WHAT TO BUY · FROM YOUR MEAL PLAN"
      title="Grocery list"
      subtitle="Pulled from your nutritionist's plan plus anything you've added. Saved to your device — check items off as you shop."
      actions={<>
        <a href="ClientNutri.html" style={{ background: "transparent", color: INK, border: "1px solid rgba(242,237,228,0.25)", padding: "10px 20px", borderRadius: 999, fontFamily: sans, fontSize: 13, cursor: "pointer", whiteSpace: "nowrap" }}>← Back to Nutri</a>
        <button onClick={() => window.print()} style={{ background: INK, color: PAPER, border: 0, padding: "10px 22px", borderRadius: 999, fontFamily: sans, fontSize: 13, fontWeight: 500, cursor: "pointer", whiteSpace: "nowrap" }}>Print</button>
      </>}
    >
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 12, marginBottom: 20 }}>
        {cards.map((c, i) => (
          <Card key={i} style={{ padding: "20px 22px 18px" }}>
            <div style={{ fontFamily: serif, fontSize: 36, letterSpacing: "-0.02em", lineHeight: 1, fontVariantNumeric: "tabular-nums" }}>{c.k}</div>
            <div style={{ fontSize: 12, marginTop: 10, color: "rgba(242,237,228,0.7)" }}>{c.l}</div>
          </Card>
        ))}
      </div>

      {/* Add item row */}
      <Card style={{ marginBottom: 20 }}>
        <SectionTitle>Add item</SectionTitle>
        <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1.2fr auto", gap: 10 }}>
          <input
            value={newItem}
            onChange={e => setNewItem(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") addItem(); }}
            placeholder="e.g. Almond butter"
            style={{ padding: "10px 14px", borderRadius: 8, background: "rgba(242,237,228,0.04)", border: "1px solid rgba(242,237,228,0.12)", color: INK, fontFamily: sans, fontSize: 13.5, outline: "none" }}
          />
          <input
            value={newQty}
            onChange={e => setNewQty(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") addItem(); }}
            placeholder="qty (1 jar, 2 lb…)"
            style={{ padding: "10px 14px", borderRadius: 8, background: "rgba(242,237,228,0.04)", border: "1px solid rgba(242,237,228,0.12)", color: INK, fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5, outline: "none" }}
          />
          <select
            value={newCat}
            onChange={e => setNewCat(e.target.value)}
            style={{ padding: "10px 14px", borderRadius: 8, background: "rgba(242,237,228,0.04)", border: "1px solid rgba(242,237,228,0.12)", color: INK, fontFamily: sans, fontSize: 13, outline: "none", colorScheme: "dark" }}
          >
            {CATEGORIES.map(c => <option key={c.key} value={c.key}>{c.label}</option>)}
          </select>
          <button onClick={addItem} disabled={!newItem.trim()} style={{
            padding: "10px 22px", borderRadius: 8, background: newItem.trim() ? TEAL : "rgba(242,237,228,0.08)",
            color: newItem.trim() ? PAPER : "rgba(242,237,228,0.4)",
            border: 0, fontFamily: sans, fontSize: 13, fontWeight: 500,
            cursor: newItem.trim() ? "pointer" : "default", whiteSpace: "nowrap",
          }}>+ Add</button>
        </div>
      </Card>

      {/* Filters + actions */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", marginBottom: 16 }}>
        <FilterPill k="buy" label="TO BUY" count={toBuyCount} />
        <FilterPill k="have" label="HAVE" count={haveCount} />
        <FilterPill k="all" label="ALL" count={items.length} />
        <input
          type="search"
          value={search}
          onChange={e => setSearch(e.target.value)}
          placeholder="Search items…"
          style={{ flex: 1, minWidth: 200, padding: "8px 14px", borderRadius: 999, background: "rgba(242,237,228,0.04)", border: "1px solid rgba(242,237,228,0.12)", color: INK, fontFamily: sans, fontSize: 13, outline: "none" }}
        />
        <button onClick={haveCount === items.length ? uncheckAll : checkAll} style={{
          fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.1em",
          padding: "8px 14px", borderRadius: 999, background: "rgba(242,237,228,0.04)",
          color: "rgba(242,237,228,0.7)", border: "1px solid rgba(242,237,228,0.12)", cursor: "pointer",
        }}>{haveCount === items.length ? "UNCHECK ALL" : "CHECK ALL"}</button>
        {haveCount > 0 && (
          <button onClick={clearChecked} style={{
            fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.1em",
            padding: "8px 14px", borderRadius: 999, background: "rgba(255,107,93,0.08)",
            color: "#ff6b5d", border: "1px solid rgba(255,107,93,0.3)", cursor: "pointer",
          }}>CLEAR CHECKED</button>
        )}
      </div>

      {/* Grouped list */}
      {grouped.length === 0 ? (
        <Card>
          <div style={{ padding: "32px 4px", color: "rgba(242,237,228,0.55)", fontSize: 14, textAlign: "center" }}>
            {filter === "buy" ? "Nothing to buy — your list is clear." :
             filter === "have" ? "Nothing checked off yet." :
             "List is empty. Add an item above to get started."}
          </div>
        </Card>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))", gap: 16 }}>
          {grouped.map(group => (
            <Card key={group.key}>
              <SectionTitle right={`${group.items.length} ITEM${group.items.length === 1 ? "" : "S"}`}>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 10, height: 10, borderRadius: 2, background: group.color }} />
                  {group.label}
                </span>
              </SectionTitle>
              {group.items.map((it, i) => (
                <div key={it.id} style={{ display: "grid", gridTemplateColumns: "auto 1fr auto auto", gap: 10, alignItems: "center", padding: "11px 0", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.06)" }}>
                  <button onClick={() => toggle(it.id)} aria-label={it.checked ? "Uncheck" : "Check"} style={{
                    width: 20, height: 20, borderRadius: 5, padding: 0,
                    border: `1px solid ${it.checked ? "rgba(10,197,168,0.5)" : "rgba(242,237,228,0.3)"}`,
                    background: it.checked ? "rgba(10,197,168,0.25)" : "transparent",
                    display: "inline-flex", alignItems: "center", justifyContent: "center",
                    color: TEAL_BRIGHT, fontSize: 12, cursor: "pointer",
                  }}>{it.checked && "✓"}</button>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 13.5, color: it.checked ? "rgba(242,237,228,0.5)" : INK, textDecoration: it.checked ? "line-through" : "none" }}>{it.item}</div>
                    {it.fromPlan && (
                      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, letterSpacing: "0.1em", color: "rgba(242,237,228,0.4)", marginTop: 2 }}>FROM PLAN</div>
                    )}
                  </div>
                  <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, color: "rgba(242,237,228,0.65)" }}>{it.qty}</span>
                  <button onClick={() => remove(it.id)} aria-label="Remove" style={{
                    background: "transparent", border: 0, padding: 2, cursor: "pointer",
                    color: "rgba(242,237,228,0.4)", fontSize: 16, lineHeight: 1,
                  }}>×</button>
                </div>
              ))}
            </Card>
          ))}
        </div>
      )}
    </DashPage>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(
  <React.Fragment>
    <ClientGroceryPage />
    <ChatWidget tabs={clientChatTabs} />
  </React.Fragment>
);
</script>
<script src="globalChatButton.js" defer></script>
</body>
</html>

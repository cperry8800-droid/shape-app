<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dash.css?v=20260613">

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="/vendor/supabase-js-2.108.2.umd.js" integrity="sha384-nD3dwv4+ZqdYnmZKe/249ImlV04om7xTCcsoSeQYI+RO+XlKPoqAWaJR1M5SJH9p" crossorigin="anonymous"></script>

<script type="text/babel" src="clientChatThreads.jsx?v=20260609"></script>

<script type="text/babel">
const CATEGORIES = [
  { key: "protein", label: "Protein",  color: "#e07856" },
  { key: "produce", label: "Produce",  color: "#a3e09a" },
  { key: "dairy",   label: "Dairy",    color: "#7ed4ff" },
  { key: "pantry",  label: "Pantry",   color: "#f4b860" },
  { key: "frozen",  label: "Frozen",   color: "#b390f5" },
  { key: "other",   label: "Other",    color: "rgba(242,237,228,0.6)" },
];

// Heuristic category guesser based on item name keywords. Keeps the
// nutritionist's pushed ingredients tidy when they don't tag categories.
function guessCategory(name) {
  const s = (name || "").toLowerCase();
  if (/chicken|beef|pork|turkey|salmon|tuna|fish|shrimp|tofu|tempeh|steak|lamb|bacon|sausage|egg/.test(s)) return "protein";
  if (/spinach|kale|broccoli|carrot|tomato|cucumber|pepper|onion|garlic|lettuce|berries|apple|banana|orange|potato|avocado|lemon|lime|herb|cilantro|parsley|fruit|vegetable|veggie/.test(s)) return "produce";
  if (/yogurt|milk|cheese|butter|cream|kefir/.test(s)) return "dairy";
  if (/rice|oat|pasta|bread|quinoa|flour|sugar|salt|oil|vinegar|sauce|spice|nut|seed|bean|lentil|whey|protein\s*powder|honey|syrup/.test(s)) return "pantry";
  if (/frozen|ice/.test(s)) return "frozen";
  return "other";
}

// Storage helpers — versioned key so we can evolve schema later.
const STORE_KEY = "shape.grocery.lists.v1";
const ACTIVE_KEY = "shape.grocery.activeListId.v1";
const HIDE_KEY = "shape.grocery.hiddenPlanItems.v1";
const CHECK_KEY = "shape.grocery.planItemChecks.v1";

function defaultLists() {
  return [{
    id: "default",
    name: "My groceries",
    items: [
      { id: "g1",  item: "Avocados",       qty: "4",       category: "produce", checked: false },
      { id: "g2",  item: "Almond milk",    qty: "64 oz",   category: "dairy",   checked: true  },
      { id: "g3",  item: "Olive oil",      qty: "1 btl",   category: "pantry",  checked: true  },
    ],
  }];
}

function loadLists() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    }
  } catch (e) {}
  // Migrate from old single-list storage if present
  try {
    const legacy = window.localStorage.getItem("shape.grocery");
    if (legacy) {
      const items = JSON.parse(legacy);
      if (Array.isArray(items) && items.length > 0) {
        return [{ id: "default", name: "My groceries", items: items.map(it => ({ id: it.id, item: it.item, qty: it.qty || "", category: it.category || guessCategory(it.item), checked: !!it.checked })) }];
      }
    }
  } catch (e) {}
  return defaultLists();
}
function saveLists(lists) {
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(lists)); } catch (e) {}
}
function loadActiveId(lists) {
  try {
    const v = window.localStorage.getItem(ACTIVE_KEY);
    if (v && lists.some(l => l.id === v)) return v;
  } catch (e) {}
  return lists[0]?.id || null;
}
function saveActiveId(id) { try { window.localStorage.setItem(ACTIVE_KEY, id); } catch (e) {} }
function loadHidden() { try { return new Set(JSON.parse(window.localStorage.getItem(HIDE_KEY) || "[]")); } catch (e) { return new Set(); } }
function saveHidden(set) { try { window.localStorage.setItem(HIDE_KEY, JSON.stringify([...set])); } catch (e) {} }
function loadChecks() { try { return JSON.parse(window.localStorage.getItem(CHECK_KEY) || "{}"); } catch (e) { return {}; } }
function saveChecks(map) { try { window.localStorage.setItem(CHECK_KEY, JSON.stringify(map)); } catch (e) {} }

// Cross-device sync with the mobile app via user_goals('client_grocery_lists').
const SYNC_KEY = "client_grocery_lists";
function syncedToWeb(list) {
  const items = (list.items && list.items.length) ? list.items : ((list.aisles || []).flatMap(a => a.items || []));
  return { id: list.id, name: list.name || "Saved list", items: (items || []).map((it, i) => ({ id: it.id || `s${list.id}-${i}`, item: it.n || it.item || "", qty: it.q || it.qty || "", category: guessCategory(it.n || it.item || ""), checked: false })) };
}
function webToSynced(lists) {
  return lists.map(l => {
    const flat = (l.items || []).map(it => ({ id: it.id, n: it.item, q: it.qty || "1", meals: l.name }));
    return { id: l.id, name: l.name, kind: "custom", editable: true, eyebrow: "Custom · Synced", usedCount: 0, count: flat.length, preview: flat.slice(0, 3).map(i => i.n).join(" · "), items: flat, aisles: [{ aisle: "Items", items: flat }] };
  });
}

function ClientGroceryPage() {
  const [lists, setLists] = React.useState(loadLists);
  const [activeListId, setActiveListId] = React.useState(() => loadActiveId(loadLists()));
  const [search, setSearch] = React.useState("");
  const [shareMsg, setShareMsg] = React.useState("");
  const [newItem, setNewItem] = React.useState("");
  const [newQty, setNewQty] = React.useState("");
  const [newCat, setNewCat] = React.useState("other");
  const [planItems, setPlanItems] = React.useState([]); // [{id, item, qty, category, mealName, mealId}]
  const [hidden, setHidden] = React.useState(loadHidden);
  const [planChecks, setPlanChecks] = React.useState(loadChecks);

  const grocSynced = React.useRef(false);
  // Pull saved lists from the shared store (lists created on the mobile app).
  React.useEffect(() => {
    if (!(window.shapeDb && window.shapeDb.getUserGoals)) { grocSynced.current = true; return; }
    let cancelled = false;
    window.shapeDb.getUserGoals(SYNC_KEY).then(saved => {
      if (!cancelled && Array.isArray(saved) && saved.length) {
        setLists(prev => { const have = new Set(prev.map(l => l.id)); const extra = saved.filter(l => l && l.id && !have.has(l.id)).map(syncedToWeb); return extra.length ? [...prev, ...extra] : prev; });
      }
    }).catch(() => {}).finally(() => { grocSynced.current = true; });
    return () => { cancelled = true; };
  }, []);
  React.useEffect(() => {
    saveLists(lists);
    if (grocSynced.current && window.shapeDb && window.shapeDb.saveUserGoals) { try { window.shapeDb.saveUserGoals(SYNC_KEY, webToSynced(lists)); } catch (e) {} }
  }, [lists]);
  React.useEffect(() => { if (activeListId) saveActiveId(activeListId); }, [activeListId]);
  React.useEffect(() => { saveHidden(hidden); }, [hidden]);
  React.useEffect(() => { saveChecks(planChecks); }, [planChecks]);

  // Fetch grocery-from-plan items (pushed meals from your nutritionist).
  React.useEffect(() => {
    let cancelled = false;
    fetch('/api/client/grocery', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (!cancelled && d && Array.isArray(d.items)) setPlanItems(d.items); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const isPlanList = (activeListId || "").startsWith("__plan__");
  const activePlanMealId = isPlanList ? (activeListId.split(":")[1] || "") : "";
  const activeList = lists.find(l => l.id === activeListId) || (!isPlanList ? lists[0] : null);
  const [dropdownOpen, setDropdownOpen] = React.useState(false);

  // ── List management ──────────────────────────────────────────────────
  const addList = () => {
    const name = prompt("New list name", "Costco trip");
    if (!name || !name.trim()) return;
    const id = "list-" + Date.now();
    setLists(prev => [...prev, { id, name: name.trim(), items: [] }]);
    setActiveListId(id);
  };
  const renameList = () => {
    if (!activeList || isPlanList) return;
    const name = prompt("Rename list", activeList.name);
    if (!name || !name.trim()) return;
    setLists(prev => prev.map(l => l.id === activeListId ? { ...l, name: name.trim() } : l));
  };
  const deleteList = () => {
    if (!activeList || isPlanList) return;
    if (lists.length === 1) { alert("Can't delete your last list. Create a new one first."); return; }
    if (!confirm(`Delete "${activeList.name}" and all ${activeList.items.length} items?`)) return;
    setLists(prev => {
      const next = prev.filter(l => l.id !== activeListId);
      setActiveListId(next[0]?.id || null);
      return next;
    });
  };

  // ── Item management (user-created list only) ─────────────────────────
  const toggleItem = (id) => {
    if (isPlanList) {
      setPlanChecks(prev => ({ ...prev, [id]: !prev[id] }));
      return;
    }
    setLists(prev => prev.map(l => l.id === activeListId ? {
      ...l, items: l.items.map(it => it.id === id ? { ...it, checked: !it.checked } : it),
    } : l));
  };
  const removeItem = (id) => {
    if (isPlanList) {
      setHidden(prev => { const n = new Set(prev); n.add(id); return n; });
      return;
    }
    setLists(prev => prev.map(l => l.id === activeListId ? {
      ...l, items: l.items.filter(it => it.id !== id),
    } : l));
  };
  const addItemToActive = () => {
    if (isPlanList) { alert("This list is auto-synced from your nutritionist. Switch to one of your own lists to add items."); return; }
    const name = newItem.trim();
    if (!name) return;
    const id = "u" + Date.now();
    setLists(prev => prev.map(l => l.id === activeListId ? {
      ...l, items: [{ id, item: name, qty: newQty.trim() || "1", category: newCat, checked: false }, ...l.items],
    } : l));
    setNewItem(""); setNewQty(""); setNewCat("other");
  };
  const copyFromPlanToActive = (planItem) => {
    if (lists.length === 0) return;
    // Move to first user list (or the active list if it's not the plan list)
    const targetId = isPlanList ? lists[0].id : activeListId;
    const id = "u" + Date.now();
    setLists(prev => prev.map(l => l.id === targetId ? {
      ...l, items: [{ id, item: planItem.item, qty: planItem.qty || "1", category: planItem.category || "other", checked: false }, ...l.items],
    } : l));
    setHidden(prev => { const n = new Set(prev); n.add(planItem.id); return n; });
  };

  // ── Derive the list of items to render ───────────────────────────────
  const visiblePlanItems = planItems.filter(p => !hidden.has(p.id)).map(p => ({
    ...p,
    checked: !!planChecks[p.id],
    fromPlan: true,
  }));
  // Group plan items by source meal so each pushed meal becomes its own
  // nutritionist grocery list in the dropdown.
  const planByMeal = React.useMemo(() => {
    const map = new Map();
    for (const p of visiblePlanItems) {
      const key = p.mealId || "_unknown";
      if (!map.has(key)) map.set(key, { mealId: key, mealName: p.mealName || "Untitled meal", items: [] });
      map.get(key).items.push(p);
    }
    return [...map.values()].sort((a, b) => (a.mealName || "").localeCompare(b.mealName || ""));
  }, [visiblePlanItems]);

  const activePlanGroup = isPlanList
    ? (activePlanMealId ? planByMeal.find(m => m.mealId === activePlanMealId) : null)
    : null;
  const planVisibleForActive = isPlanList
    ? (activePlanGroup ? activePlanGroup.items : visiblePlanItems)
    : [];
  const rawItems = isPlanList ? planVisibleForActive : (activeList?.items || []);
  const q = search.trim().toLowerCase();
  // The list itself is the hero — every aisle renders inline (checked items just
  // dim + strike through), so there's no buy/have view filter; only search narrows it.
  const visible = rawItems.filter(it => (q ? it.item.toLowerCase().includes(q) : true));
  const grouped = CATEGORIES.map(cat => ({
    ...cat,
    items: visible.filter(it => it.category === cat.key),
  })).filter(g => g.items.length > 0);

  const haveCount = rawItems.filter(it => it.checked).length;

  // ── Active list label for the dropdown trigger ───────────────────────
  const activeLabel = isPlanList
    ? (activePlanGroup ? activePlanGroup.mealName : "All from your nutritionist")
    : (activeList?.name || "Choose a list");
  const activeCount = isPlanList
    ? planVisibleForActive.length
    : (activeList?.items?.length || 0);

  // Share the current list — native share sheet when available, else clipboard.
  const shareList = async () => {
    if (!rawItems.length) { setShareMsg("List is empty"); setTimeout(() => setShareMsg(""), 1800); return; }
    const byCat = CATEGORIES.map(c => ({ label: c.label, items: rawItems.filter(it => it.category === c.key) })).filter(g => g.items.length);
    const lines = byCat.map(g => `${g.label.toUpperCase()}\n${g.items.map(it => `  • ${it.qty ? it.qty + " " : ""}${it.item}`).join("\n")}`).join("\n\n");
    const body = `${activeLabel} — Shop list\n\n${lines}`;
    try {
      if (navigator.share) { await navigator.share({ title: `${activeLabel} — Shop list`, text: body }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(body); setShareMsg("Copied to clipboard"); }
    catch (e) { setShareMsg("Couldn't copy"); }
    setTimeout(() => setShareMsg(""), 1800);
  };
  // Save the current list as a new editable list of your own — turns a read-only
  // nutritionist plan into your own list, or duplicates a custom one.
  const saveCopy = () => {
    if (!rawItems.length) return;
    const base = isPlanList ? (activeLabel === "All from your nutritionist" ? "Nutritionist plan" : activeLabel) : `${activeLabel} (copy)`;
    const id = "list-" + Date.now();
    const items = rawItems.map((it, i) => ({ id: "u" + Date.now() + "-" + i, item: it.item, qty: it.qty || "1", category: it.category || "other", checked: false }));
    setLists(prev => [...prev, { id, name: base, items }]);
    setActiveListId(id);
  };

  // Shopping progress for the slim strip (whole list, not the search-narrowed view).
  const AVG_ITEM_COST = 3.2; // rough per-item $ estimate for the "to go" total
  const groTotal = rawItems.length;
  const groDone = haveCount;
  const groPct = groTotal ? Math.round((groDone / groTotal) * 100) : 0;
  const groLeft = Math.round((groTotal - groDone) * AVG_ITEM_COST);

  return (
    <DashPage
      navItems={clientNavItems("nutrition")}
      payoutCard={clientPayoutCard}
      eyebrow={isPlanList ? "AUTO-SYNCED FROM YOUR NUTRITIONIST" : "YOUR GROCERY LISTS"}
      title="Grocery lists"
      subtitle={isPlanList
        ? "Ingredients from every meal your nutritionist has pushed. Tap to copy items to one of your own lists."
        : "Make as many lists as you want — weekly groceries, a Costco run, party prep. Saved to your device."}
      actions={<>
        <button onClick={() => window.print()} style={{ background: "transparent", color: INK, border: "1px solid rgba(242,237,228,0.25)", padding: "10px 20px", borderRadius: 999, fontFamily: sans, fontSize: 13, cursor: "pointer", whiteSpace: "nowrap" }}>Print</button>
      </>}
    >
      {/* Tab strip — Nutrition + Grocery (active) */}
      <div style={{ display: "flex", gap: 6, marginBottom: 20, borderBottom: "1px solid rgba(242,237,228,0.08)", paddingBottom: 1 }}>
        {[
          { label: "Nutrition", href: "ClientNutri.html" },
          { label: "Grocery",   href: null, active: true },
        ].map(t => {
          const baseStyle = {
            fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase",
            padding: "10px 18px", borderRadius: "8px 8px 0 0", textDecoration: "none",
            border: "1px solid rgba(242,237,228,0.08)", borderBottom: "none",
          };
          if (t.active) {
            return <span key={t.label} style={{ ...baseStyle, background: "rgba(10,197,168,0.12)", color: TEAL_BRIGHT, borderColor: "rgba(10,197,168,0.28)", marginBottom: -1 }}>{t.label}</span>;
          }
          return <a key={t.label} href={t.href} style={{ ...baseStyle, background: "rgba(242,237,228,0.02)", color: "rgba(242,237,228,0.65)", cursor: "pointer" }}>{t.label}</a>;
        })}
      </div>

      {/* List switcher dropdown + actions */}
      <Card style={{ marginBottom: 20, overflow: "visible", position: "relative", zIndex: 50, backdropFilter: "none", WebkitBackdropFilter: "none" }}>
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          {/* Dropdown */}
          <div style={{ position: "relative", flex: "0 1 360px", minWidth: 240 }}>
            <button onClick={() => setDropdownOpen(o => !o)} style={{
              width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12,
              padding: "11px 16px", borderRadius: 10,
              background: "rgba(242,237,228,0.04)", color: INK, border: "1px solid rgba(242,237,228,0.18)",
              cursor: "pointer", fontFamily: sans, fontSize: 14,
            }}>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                {isPlanList && <span style={{ width: 8, height: 8, borderRadius: 999, background: "#f4b860", flex: "none" }} />}
                <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{activeLabel}</span>
                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: "rgba(242,237,228,0.5)", flex: "none" }}>{activeCount}</span>
              </span>
              <span style={{ fontSize: 10, color: "rgba(242,237,228,0.55)" }}>{dropdownOpen ? "▲" : "▼"}</span>
            </button>
            {dropdownOpen && (
              <>
                <div onClick={() => setDropdownOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 999, background: "transparent" }} />
                <div style={{
                  position: "absolute", top: "calc(100% + 6px)", left: 0, right: 0, zIndex: 1000,
                  background: "#15110d", border: "1px solid rgba(242,237,228,0.22)", borderRadius: 10,
                  boxShadow: "0 24px 60px rgba(0,0,0,0.75), 0 0 0 1px rgba(0,0,0,0.4)",
                  maxHeight: 380, overflowY: "auto",
                  backdropFilter: "none", WebkitBackdropFilter: "none",
                }}>
                {/* Custom section */}
                <div style={{ padding: "10px 14px 6px", fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, letterSpacing: "0.16em", color: TEAL_BRIGHT, borderBottom: "1px solid rgba(242,237,228,0.06)" }}>CUSTOM LISTS</div>
                {lists.length === 0 && (
                  <div style={{ padding: "12px 14px", fontSize: 12, color: "rgba(242,237,228,0.5)" }}>No custom lists yet.</div>
                )}
                {lists.map(l => {
                  const on = l.id === activeListId;
                  return (
                    <button key={l.id} onClick={() => { setActiveListId(l.id); setDropdownOpen(false); }} style={{
                      display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10,
                      width: "100%", padding: "11px 14px", textAlign: "left", cursor: "pointer",
                      background: on ? "rgba(10,197,168,0.12)" : "transparent",
                      border: "none", borderBottom: "1px solid rgba(242,237,228,0.04)",
                      color: on ? TEAL_BRIGHT : INK, fontFamily: sans, fontSize: 13.5,
                    }}>
                      <span style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.name}</span>
                      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "rgba(242,237,228,0.55)", flex: "none" }}>{l.items.length}</span>
                    </button>
                  );
                })}
                <button onClick={() => { setDropdownOpen(false); addList(); }} style={{
                  display: "block", width: "100%", padding: "11px 14px", textAlign: "left", cursor: "pointer",
                  background: "transparent", border: "none", borderBottom: "1px solid rgba(242,237,228,0.04)",
                  color: TEAL_BRIGHT, fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.14em",
                }}>+ NEW CUSTOM LIST</button>

                {/* Nutritionist section */}
                <div style={{ padding: "12px 14px 6px", fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, letterSpacing: "0.16em", color: "#f4b860", borderTop: "1px solid rgba(242,237,228,0.08)", borderBottom: "1px solid rgba(242,237,228,0.06)" }}>NUTRITIONIST LISTS</div>
                {planByMeal.length === 0 ? (
                  <div style={{ padding: "12px 14px", fontSize: 12, color: "rgba(242,237,228,0.5)" }}>No meals pushed yet. Your nutritionist's meal-plan ingredients will appear here.</div>
                ) : (
                  <>
                    {(() => {
                      const id = "__plan__";
                      const on = id === activeListId;
                      return (
                        <button onClick={() => { setActiveListId(id); setDropdownOpen(false); }} style={{
                          display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10,
                          width: "100%", padding: "11px 14px", textAlign: "left", cursor: "pointer",
                          background: on ? "rgba(244,184,96,0.14)" : "transparent",
                          border: "none", borderBottom: "1px solid rgba(242,237,228,0.04)",
                          color: on ? "#f4b860" : INK, fontFamily: sans, fontSize: 13.5,
                          fontWeight: 500,
                        }}>
                          <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
                            <span style={{ width: 7, height: 7, borderRadius: 999, background: "#f4b860" }} />
                            All from your nutritionist
                          </span>
                          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "rgba(242,237,228,0.55)", flex: "none" }}>{visiblePlanItems.length}</span>
                        </button>
                      );
                    })()}
                    {planByMeal.map(g => {
                      const id = `__plan__:${g.mealId}`;
                      const on = id === activeListId;
                      return (
                        <button key={g.mealId} onClick={() => { setActiveListId(id); setDropdownOpen(false); }} style={{
                          display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10,
                          width: "100%", padding: "10px 14px 10px 28px", textAlign: "left", cursor: "pointer",
                          background: on ? "rgba(244,184,96,0.12)" : "transparent",
                          border: "none", borderBottom: "1px solid rgba(242,237,228,0.04)",
                          color: on ? "#f4b860" : "rgba(242,237,228,0.82)", fontFamily: sans, fontSize: 13,
                        }}>
                          <span style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{g.mealName}</span>
                          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "rgba(242,237,228,0.55)", flex: "none" }}>{g.items.length}</span>
                        </button>
                      );
                    })}
                  </>
                )}
                </div>
              </>
            )}
          </div>

          {/* Inline actions */}
          {!isPlanList && activeList && (
            <>
              <button onClick={renameList} style={{
                fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.1em",
                padding: "9px 14px", borderRadius: 999,
                background: "transparent", color: "rgba(242,237,228,0.7)",
                border: "1px solid rgba(242,237,228,0.18)", cursor: "pointer", whiteSpace: "nowrap",
              }}>RENAME</button>
              <button onClick={deleteList} style={{
                fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.1em",
                padding: "9px 14px", borderRadius: 999,
                background: "rgba(255,107,93,0.08)", color: "#ff6b5d",
                border: "1px solid rgba(255,107,93,0.3)", cursor: "pointer", whiteSpace: "nowrap",
              }}>DELETE LIST</button>
            </>
          )}
          <button onClick={addList} style={{
            marginLeft: "auto",
            fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.1em",
            padding: "9px 16px", borderRadius: 999,
            background: INK, color: PAPER, border: 0, cursor: "pointer", whiteSpace: "nowrap",
          }}>+ NEW LIST</button>
        </div>
      </Card>

      {/* Add item row — only for user lists */}
      {!isPlanList && (
        <Card style={{ marginBottom: 20 }}>
          <SectionTitle right={activeList ? activeList.name.toUpperCase() : ""}>Add item</SectionTitle>
          <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1.2fr auto", gap: 10 }}>
            <input
              value={newItem}
              onChange={e => setNewItem(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") addItemToActive(); }}
              placeholder="e.g. Almond butter"
              style={{ padding: "10px 14px", borderRadius: 8, background: "rgba(242,237,228,0.04)", border: "1px solid rgba(242,237,228,0.12)", color: INK, fontFamily: sans, fontSize: 13.5, outline: "none" }}
            />
            <input
              value={newQty}
              onChange={e => setNewQty(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") addItemToActive(); }}
              placeholder="qty (1 jar, 2 lb…)"
              style={{ padding: "10px 14px", borderRadius: 8, background: "rgba(242,237,228,0.04)", border: "1px solid rgba(242,237,228,0.12)", color: INK, fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5, outline: "none" }}
            />
            <select
              value={newCat}
              onChange={e => setNewCat(e.target.value)}
              style={{ padding: "10px 14px", borderRadius: 8, background: "rgba(242,237,228,0.04)", border: "1px solid rgba(242,237,228,0.12)", color: INK, fontFamily: sans, fontSize: 13, outline: "none", colorScheme: "dark" }}
            >
              {CATEGORIES.map(c => <option key={c.key} value={c.key}>{c.label}</option>)}
            </select>
            <button onClick={addItemToActive} disabled={!newItem.trim()} style={{
              padding: "10px 22px", borderRadius: 8, background: newItem.trim() ? TEAL : "rgba(242,237,228,0.08)",
              color: newItem.trim() ? PAPER : "rgba(242,237,228,0.4)",
              border: 0, fontFamily: sans, fontSize: 13, fontWeight: 500,
              cursor: newItem.trim() ? "pointer" : "default", whiteSpace: "nowrap",
            }}>+ Add</button>
          </div>
        </Card>
      )}

      {/* Slim progress strip — one line + a thin fill (the list below is the hero) */}
      {rawItems.length > 0 && (
        <div style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10 }}>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.08em", color: "rgba(242,237,228,0.7)" }}>
              {groDone}/{groTotal} got · <span style={{ color: TEAL_BRIGHT }}>{groDone < groTotal ? `~$${groLeft} to go` : "all set"}</span>
            </span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, fontWeight: 600, color: TEAL_BRIGHT }}>{groPct}%</span>
          </div>
          <div style={{ marginTop: 7, height: 5, borderRadius: 3, background: "rgba(242,237,228,0.08)", overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${groPct}%`, background: TEAL, borderRadius: 3, transition: "width 0.25s ease" }} />
          </div>
        </div>
      )}

      {/* Search — narrows the list (no buy/have view filter; checked items just dim inline) */}
      <div style={{ marginBottom: 16 }}>
        <input
          type="search"
          value={search}
          onChange={e => setSearch(e.target.value)}
          placeholder="Search items…"
          style={{ width: "100%", boxSizing: "border-box", padding: "9px 14px", borderRadius: 999, background: "rgba(242,237,228,0.04)", border: "1px solid rgba(242,237,228,0.12)", color: INK, fontFamily: sans, fontSize: 13, outline: "none" }}
        />
      </div>

      {/* Grouped list */}
      {grouped.length === 0 ? (
        <Card>
          <div style={{ padding: "32px 4px", color: "rgba(242,237,228,0.55)", fontSize: 14, textAlign: "center" }}>
            {isPlanList ? "Your nutritionist hasn't pushed any meals yet." :
             rawItems.length === 0 ? "List is empty. Add an item above to get started." :
             "No items match your search."}
          </div>
        </Card>
      ) : (
        <Card>
          <SectionTitle right={`${rawItems.filter(it => !it.checked).length} TO BUY · ${rawItems.length} TOTAL`}>{activeLabel}</SectionTitle>
          {grouped.map((group, gi) => (
            <div key={group.key} style={{
              paddingTop: gi === 0 ? 0 : 18,
              marginTop: gi === 0 ? 0 : 18,
              borderTop: gi === 0 ? "none" : "1px solid rgba(242,237,228,0.08)",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 8, fontSize: 13, fontWeight: 500 }}>
                  <span style={{ width: 10, height: 10, borderRadius: 2, background: group.color }} />
                  {group.label}
                </span>
                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.08em", color: "rgba(242,237,228,0.5)" }}>
                  {group.items.length} ITEM{group.items.length === 1 ? "" : "S"}
                </span>
              </div>
              {group.items.map((it, i) => (
                <div key={it.id} style={{ display: "grid", gridTemplateColumns: "auto 1fr auto auto", gap: 10, alignItems: "center", padding: "11px 0", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.04)" }}>
                  <button onClick={() => toggleItem(it.id)} aria-label={it.checked ? "Uncheck" : "Check"} style={{
                    width: 20, height: 20, borderRadius: 5, padding: 0,
                    border: `1px solid ${it.checked ? "rgba(10,197,168,0.5)" : "rgba(242,237,228,0.3)"}`,
                    background: it.checked ? "rgba(10,197,168,0.25)" : "transparent",
                    display: "inline-flex", alignItems: "center", justifyContent: "center",
                    color: TEAL_BRIGHT, fontSize: 12, cursor: "pointer",
                  }}>{it.checked && "✓"}</button>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 13.5, color: it.checked ? "rgba(242,237,228,0.5)" : INK, textDecoration: it.checked ? "line-through" : "none" }}>{it.item}</div>
                    {it.fromPlan && it.mealName && (
                      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, letterSpacing: "0.1em", color: "rgba(244,184,96,0.7)", marginTop: 2 }}>FROM · {it.mealName.toUpperCase()}</div>
                    )}
                  </div>
                  <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, color: "rgba(242,237,228,0.65)" }}>{it.qty}</span>
                  {isPlanList ? (
                    <button onClick={() => copyFromPlanToActive(it)} aria-label="Copy to my list" title="Copy to my list" style={{
                      background: "rgba(10,197,168,0.08)", color: TEAL_BRIGHT, border: "1px solid rgba(10,197,168,0.28)",
                      padding: "3px 8px", borderRadius: 999, fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, letterSpacing: "0.08em", cursor: "pointer",
                    }}>COPY</button>
                  ) : (
                    <button onClick={() => removeItem(it.id)} aria-label="Remove" style={{
                      background: "transparent", border: 0, padding: 2, cursor: "pointer",
                      color: "rgba(242,237,228,0.4)", fontSize: 16, lineHeight: 1,
                    }}>×</button>
                  )}
                </div>
              ))}
            </div>
          ))}
        </Card>
      )}

      {/* One action bar — Send to Instacart (primary) + Save a copy + Share */}
      <InstacartSendCard
        activeListId={activeListId}
        activeLabel={activeLabel}
        userLists={lists}
        planGroups={planByMeal}
        allPlanItems={visiblePlanItems}
        onShare={shareList}
        onSaveCopy={saveCopy}
        shareMsg={shareMsg}
        canAct={rawItems.length > 0}
      />
    </DashPage>
  );
}

// Instacart hand-off. Defaults to the currently active list but lets the
// user combine multiple grocery lists in one batch — picks deduped items
// from every selected list, copies them all to clipboard, and opens an
// Instacart search prefilled with the first few item names. The full
// list is on the clipboard so the user can paste directly into Instacart's
// search to add each item.
function InstacartSendCard({ activeListId, activeLabel, userLists, planGroups, allPlanItems, onShare, onSaveCopy, shareMsg, canAct }) {
  // Pre-select the currently active list as the default selection.
  const [selectedIds, setSelectedIds] = React.useState(() => new Set([activeListId]));
  const [pickerOpen, setPickerOpen] = React.useState(false);
  const [copied, setCopied] = React.useState(false);

  // Reset selection to follow the active list when the user switches lists.
  React.useEffect(() => {
    setSelectedIds(new Set([activeListId]));
  }, [activeListId]);

  // Resolve every selected list id to its items.
  const itemsForListId = (id) => {
    if (id === "__plan__") return allPlanItems;
    if ((id || "").startsWith("__plan__:")) {
      const mealId = id.slice("__plan__:".length);
      const group = planGroups.find(g => g.mealId === mealId);
      return group ? group.items : [];
    }
    const list = userLists.find(l => l.id === id);
    return list ? list.items : [];
  };
  const labelForListId = (id) => {
    if (id === "__plan__") return "All from your nutritionist";
    if ((id || "").startsWith("__plan__:")) {
      const mealId = id.slice("__plan__:".length);
      const g = planGroups.find(x => x.mealId === mealId);
      return g ? g.mealName : "Plan list";
    }
    const l = userLists.find(x => x.id === id);
    return l ? l.name : "List";
  };

  // Dedupe unchecked items across every selected list — case-insensitive on
  // item name. Quantity from the first occurrence wins.
  const merged = React.useMemo(() => {
    const seen = new Map();
    for (const id of selectedIds) {
      for (const it of itemsForListId(id)) {
        if (it.checked) continue;
        const key = String(it.item || "").trim().toLowerCase();
        if (!key || seen.has(key)) continue;
        seen.set(key, { item: it.item, qty: it.qty || "" });
      }
    }
    return [...seen.values()];
  }, [selectedIds, userLists, planGroups, allPlanItems]);

  const count = merged.length;
  const selectedCount = selectedIds.size;

  const toggle = (id) => setSelectedIds(prev => {
    const next = new Set(prev);
    if (next.has(id)) next.delete(id); else next.add(id);
    return next;
  });

  const sendToInstacart = () => {
    if (count === 0) return;
    const lines = merged.map(it => it.qty ? `${it.item} (${it.qty})` : it.item);
    try { if (navigator.clipboard) navigator.clipboard.writeText(lines.join("\n")); } catch (e) {}
    setCopied(true);
    setTimeout(() => setCopied(false), 2500);
    const q = encodeURIComponent(lines.slice(0, 8).map(l => l.split(" (")[0]).join(", "));
    window.open(`https://www.instacart.com/store/s?k=${q}`, "_blank", "noopener");
  };

  // Render one checkbox row for the list picker.
  const PickRow = ({ id, label, isPlan, count: lineCount }) => {
    const on = selectedIds.has(id);
    return (
      <button onClick={() => toggle(id)} style={{
        display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10,
        width: "100%", padding: "10px 14px", textAlign: "left", cursor: "pointer",
        background: on ? "rgba(67,176,42,0.10)" : "transparent",
        border: "none", borderBottom: "1px solid rgba(242,237,228,0.05)",
        color: INK, fontFamily: sans, fontSize: 13,
      }}>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 10, minWidth: 0 }}>
          <span style={{
            width: 16, height: 16, borderRadius: 4, flex: "none",
            border: `1px solid ${on ? "rgba(67,176,42,0.7)" : "rgba(242,237,228,0.3)"}`,
            background: on ? "#43B02A" : "transparent",
            display: "inline-flex", alignItems: "center", justifyContent: "center",
            color: "#fff", fontSize: 11,
          }}>{on && "✓"}</span>
          {isPlan && <span style={{ width: 7, height: 7, borderRadius: 999, background: "#f4b860", flex: "none" }} />}
          <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{label}</span>
        </span>
        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "rgba(242,237,228,0.55)", flex: "none" }}>{lineCount}</span>
      </button>
    );
  };

  const summaryText = selectedCount === 1
    ? `${count} item${count === 1 ? "" : "s"} from ${labelForListId([...selectedIds][0]) || activeLabel}`
    : `${count} item${count === 1 ? "" : "s"} from ${selectedCount} lists`;

  return (
    <Card style={{ marginTop: 20, background: "linear-gradient(135deg, rgba(67,176,42,0.10), rgba(67,176,42,0.03))", border: "1px solid rgba(67,176,42,0.32)", position: "relative", overflow: "visible" }}>
      <div style={{ display: "grid", gridTemplateColumns: "auto 1fr auto", gap: 18, alignItems: "center" }}>
        <div style={{
          width: 48, height: 48, borderRadius: 12, background: "#43B02A",
          display: "flex", alignItems: "center", justifyContent: "center", flex: "none",
          boxShadow: "0 6px 18px rgba(67,176,42,0.35)",
        }}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M6 6h13l-1.5 9h-10L6 6Z" stroke="#fff" strokeWidth="2" strokeLinejoin="round"/>
            <circle cx="9" cy="19" r="1.4" fill="#fff"/>
            <circle cx="16" cy="19" r="1.4" fill="#fff"/>
            <path d="M3 4h2.5l.5 2" stroke="#fff" strokeWidth="2" strokeLinecap="round"/>
          </svg>
        </div>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.14em", color: "#67c64a", fontWeight: 600 }}>SEND TO INSTACART</div>
          <div style={{ fontFamily: serif, fontSize: 18, letterSpacing: "-0.01em", color: INK, marginTop: 4, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
            {count > 0 ? summaryText : "Nothing to send — every item is checked off"}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 6, flexWrap: "wrap" }}>
            <span style={{ fontSize: 11.5, color: "rgba(242,237,228,0.55)" }}>
              {count > 0 ? "Opens Instacart and copies the combined list to clipboard." : "Add items or pick another list to send."}
            </span>
            <button onClick={() => setPickerOpen(o => !o)} style={{
              fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.12em",
              padding: "4px 10px", borderRadius: 999, cursor: "pointer",
              background: pickerOpen ? "rgba(67,176,42,0.18)" : "rgba(242,237,228,0.04)",
              color: pickerOpen ? "#67c64a" : "rgba(242,237,228,0.7)",
              border: "1px solid " + (pickerOpen ? "rgba(67,176,42,0.4)" : "rgba(242,237,228,0.18)"),
            }}>{pickerOpen ? "HIDE LISTS" : "+ COMBINE LISTS"}</button>
          </div>
        </div>
        <button onClick={sendToInstacart} disabled={count === 0} style={{
          padding: "12px 22px", borderRadius: 999,
          background: count > 0 ? "#43B02A" : "rgba(67,176,42,0.18)",
          color: count > 0 ? "#fff" : "rgba(255,255,255,0.6)",
          border: 0, fontFamily: sans, fontSize: 13, fontWeight: 600,
          cursor: count > 0 ? "pointer" : "default", whiteSpace: "nowrap",
        }}>{copied ? "✓ Copied · opening…" : "Send to Instacart"}</button>
      </div>

      {/* Save a copy + Share — secondary actions in the same bar */}
      <div style={{ display: "flex", gap: 10, marginTop: 14, flexWrap: "wrap" }}>
        <button onClick={onSaveCopy} disabled={!canAct} style={{
          flex: 1, minWidth: 130, padding: "10px 14px", borderRadius: 999, cursor: canAct ? "pointer" : "default",
          background: "transparent", color: canAct ? TEAL_BRIGHT : "rgba(242,237,228,0.4)",
          border: `1px solid ${canAct ? "rgba(10,197,168,0.4)" : "rgba(242,237,228,0.12)"}`,
          fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", fontWeight: 600,
        }}>+ Save a copy</button>
        <button onClick={onShare} disabled={!canAct} style={{
          flex: 1, minWidth: 130, padding: "10px 14px", borderRadius: 999, cursor: canAct ? "pointer" : "default",
          background: "transparent", color: canAct ? INK : "rgba(242,237,228,0.4)",
          border: `1px solid ${canAct ? "rgba(242,237,228,0.25)" : "rgba(242,237,228,0.12)"}`,
          fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", fontWeight: 600,
        }}>{shareMsg || "Share"}</button>
      </div>

      {pickerOpen && (
        <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px solid rgba(67,176,42,0.18)" }}>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.12em", color: "rgba(242,237,228,0.7)", marginBottom: 10 }}>
            PICK LISTS TO COMBINE · {selectedCount} SELECTED
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0 }}>
            <div>
              <div style={{ padding: "6px 14px", fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, letterSpacing: "0.16em", color: TEAL_BRIGHT }}>CUSTOM</div>
              {userLists.length === 0 && (
                <div style={{ padding: "10px 14px", fontSize: 12, color: "rgba(242,237,228,0.5)" }}>No custom lists.</div>
              )}
              {userLists.map(l => (
                <PickRow key={l.id} id={l.id} label={l.name} isPlan={false} count={l.items.filter(it => !it.checked).length} />
              ))}
            </div>
            <div>
              <div style={{ padding: "6px 14px", fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, letterSpacing: "0.16em", color: "#f4b860" }}>NUTRITIONIST</div>
              {planGroups.length === 0 ? (
                <div style={{ padding: "10px 14px", fontSize: 12, color: "rgba(242,237,228,0.5)" }}>No meals pushed yet.</div>
              ) : (
                <>
                  <PickRow id="__plan__" label="All from your nutritionist" isPlan={true} count={allPlanItems.filter(it => !it.checked).length} />
                  {planGroups.map(g => (
                    <PickRow key={g.mealId} id={`__plan__:${g.mealId}`} label={g.mealName} isPlan={true} count={g.items.filter(it => !it.checked).length} />
                  ))}
                </>
              )}
            </div>
          </div>
        </div>
      )}
    </Card>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <React.Fragment>
    <ClientGroceryPage />
    <ChatWidget tabs={clientChatTabs} />
  </React.Fragment>
);
</script>

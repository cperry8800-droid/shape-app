<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Messages · Shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="pageShell.jsx?v=20260714a"></script>
<script type="text/babel" src="trainerDashboard.jsx?v=20260622a"></script>
<script type="text/babel" src="coachNav.jsx"></script>
<script type="text/babel">
function msgRelTime(iso) {
  if (!iso) return "";
  const d = new Date(iso).getTime();
  if (!Number.isFinite(d)) return "";
  const m = Math.floor((Date.now() - d) / 60000);
  if (m < 1) return "now";
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h";
  const days = Math.floor(h / 24);
  if (days === 1) return "Yesterday";
  if (days < 7) return days + "d";
  try { return new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" }); }
  catch (e) { return ""; }
}
function msgClock(iso) {
  if (!iso) return "";
  try { return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  catch (e) { return ""; }
}

// Mock inbox — shown while the API loads, or when the viewer isn't a
// signed-in trainer. Fully interactive (select + send append locally).
const MMIN = (n) => new Date(Date.now() - n * 60000).toISOString();
const MOCK_THREADS = [
  { id: "m1", clientName: "Priya Shah", lastMessage: "Got it, pushing 185 today.", lastMessageAt: MMIN(2),
    messages: [
      { id: "a", body: "Morning — squat 185 feels heavy on warmups. Should I back off?", mine: false, createdAt: MMIN(70) },
      { id: "b", body: "Stick with 185 for the top set. Drop backoffs to 165 — protect the knee.", mine: true, createdAt: MMIN(62) },
      { id: "c", body: "Also ice tonight and log sleep before Friday's call.", mine: true, createdAt: MMIN(61) },
      { id: "d", body: "Got it, pushing 185 today.", mine: false, createdAt: MMIN(2) },
    ] },
  { id: "m2", clientName: "Sam Okafor", lastMessage: "Onboarding questions — attached.", lastMessageAt: MMIN(14),
    messages: [ { id: "e", body: "Onboarding questions — attached.", mine: false, createdAt: MMIN(14) } ] },
  { id: "m3", clientName: "Marcus Johnson", lastMessage: "Can you check my bench cue?", lastMessageAt: MMIN(60),
    messages: [ { id: "f", body: "Can you check my bench cue?", mine: false, createdAt: MMIN(60) } ] },
  { id: "m4", clientName: "Elena Rivera", lastMessage: "Thanks! Feeling great this week.", lastMessageAt: MMIN(180),
    messages: [ { id: "g", body: "Thanks! Feeling great this week.", mine: false, createdAt: MMIN(180) } ] },
];

function TrainerMessagesPage() {
  const [threads, setThreads] = React.useState(MOCK_THREADS);
  const [live, setLive] = React.useState(false);
  const [selectedId, setSelectedId] = React.useState(MOCK_THREADS[0].id);
  const [draft, setDraft] = React.useState("");
  const [sending, setSending] = React.useState(false);
  const scrollRef = React.useRef(null);

  React.useEffect(() => {
    let cancelled = false;
    fetch('/api/trainer/messages', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => {
        if (cancelled || !d || !d.isTrainer) return;
        setLive(true);
        setThreads(d.threads);
        setSelectedId(d.threads.length ? d.threads[0].id : null);
      })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const selected = threads.find(t => t.id === selectedId) || null;

  React.useEffect(() => {
    const el = scrollRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [selectedId, selected ? selected.messages.length : 0]);

  function send() {
    const text = draft.trim();
    if (!text || !selected || sending) return;
    const now = new Date().toISOString();
    const optimistic = { id: "tmp-" + Date.now(), body: text, mine: true, createdAt: now };
    setThreads(prev => prev.map(t => t.id === selected.id
      ? { ...t, messages: [...t.messages, optimistic], lastMessage: text, lastMessageAt: now }
      : t));
    setDraft("");
    if (!live) return;
    setSending(true);
    fetch('/api/trainer/messages', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversationId: selected.id, message: text }),
    })
      .catch(() => {})
      .finally(() => setSending(false));
  }

  return (
    <DashPage
      navItems={trainerNavItems("messages")}
      payoutCard={trainerPayoutCard}
      eyebrow={threads.length + " ACTIVE THREAD" + (threads.length === 1 ? "" : "S")}
      title="Messages"
      subtitle="Every client conversation in one place."
    >
      <div style={{ display: "grid", gridTemplateColumns: "340px 1fr", gap: 20 }}>
        <Card style={{ padding: 0, overflow: "hidden" }}>
          <div style={{ padding: "18px 18px 10px" }}><SectionTitle>Inbox</SectionTitle></div>
          {threads.length === 0 && (
            <div style={{ padding: "26px 18px", fontSize: 13, color: "rgba(242,237,228,0.55)" }}>
              No conversations yet. Clients can message you from your public profile.
            </div>
          )}
          {threads.map((t, i) => (
            <div
              key={t.id}
              onClick={() => setSelectedId(t.id)}
              style={{ padding: "14px 18px", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.05)", background: t.id === selectedId ? "rgba(10,197,168,0.08)" : "transparent", cursor: "pointer", borderLeft: t.id === selectedId ? `2px solid ${TEAL}` : "2px solid transparent" }}
            >
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                <div style={{ fontSize: 13.5, fontWeight: 500 }}>{t.clientName}</div>
                <div style={{ fontSize: 10, color: "rgba(242,237,228,0.45)", fontFamily: "'JetBrains Mono', monospace" }}>{msgRelTime(t.lastMessageAt)}</div>
              </div>
              <div style={{ fontSize: 12, color: "rgba(242,237,228,0.55)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.lastMessage}</div>
            </div>
          ))}
        </Card>

        <Card style={{ padding: 0, display: "flex", flexDirection: "column", height: 600 }}>
          {!selected && (
            <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", color: "rgba(242,237,228,0.5)", fontSize: 13.5 }}>
              Select a conversation to read it.
            </div>
          )}
          {selected && (
            <>
              <div style={{ padding: "18px 24px", borderBottom: "1px solid rgba(242,237,228,0.08)" }}>
                <div style={{ fontSize: 15, fontWeight: 500 }}>{selected.clientName}</div>
                <div style={{ fontSize: 11.5, color: "rgba(242,237,228,0.55)", marginTop: 2 }}>
                  {selected.messages.length} message{selected.messages.length === 1 ? "" : "s"}
                </div>
              </div>
              <div ref={scrollRef} style={{ flex: 1, padding: 24, overflowY: "auto", display: "flex", flexDirection: "column", gap: 12 }}>
                {selected.messages.length === 0 && (
                  <div style={{ margin: "auto", color: "rgba(242,237,228,0.45)", fontSize: 13 }}>No messages yet — say hello.</div>
                )}
                {selected.messages.map((m) => (
                  <div key={m.id} style={{ display: "flex", justifyContent: m.mine ? "flex-end" : "flex-start" }}>
                    <div style={{ maxWidth: "68%", background: m.mine ? TEAL : "rgba(242,237,228,0.06)", color: m.mine ? PAPER : INK, padding: "10px 14px", borderRadius: 14, fontSize: 13.5, lineHeight: 1.5 }}>
                      {m.body}
                      <div style={{ fontSize: 10, color: m.mine ? "rgba(26,22,18,0.5)" : "rgba(242,237,228,0.4)", marginTop: 4, fontFamily: "'JetBrains Mono', monospace" }}>{msgClock(m.createdAt)}</div>
                    </div>
                  </div>
                ))}
              </div>
              <div style={{ padding: 18, borderTop: "1px solid rgba(242,237,228,0.08)", display: "flex", gap: 10 }}>
                <input
                  value={draft}
                  onChange={(e) => setDraft(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); send(); } }}
                  placeholder={`Write to ${selected.clientName}…`}
                  style={{ flex: 1, background: "rgba(242,237,228,0.04)", border: "1px solid rgba(242,237,228,0.1)", padding: "10px 14px", borderRadius: 999, color: INK, fontSize: 13, outline: "none", fontFamily: sans }}
                />
                <button
                  onClick={send}
                  disabled={sending || !draft.trim()}
                  style={{ background: INK, color: PAPER, border: 0, padding: "10px 20px", borderRadius: 999, fontSize: 13, fontWeight: 500, cursor: sending || !draft.trim() ? "default" : "pointer", opacity: sending || !draft.trim() ? 0.5 : 1 }}
                >
                  {sending ? "Sending…" : "Send"}
                </button>
              </div>
            </>
          )}
        </Card>
      </div>
    </DashPage>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<TrainerMessagesPage />);
</script>
<script src="globalChatButton.js?v=20260613" defer></script>
</body>
</html>

<!-- ⚠ FOR NORA'S BOOTH, AND IT MUST PRECEDE EVERY MODULE SCRIPT — a document gets

     resolves it for the web. A bump moved the app to three 0.185.1 / three-vrm 3.5.5

     tests/nora-stage-version-parity.test.mjs now fails the build if they drift again. -->

    "@pixiv/three-vrm": "https://esm.sh/@pixiv/three-vrm@3.5.5?deps=three@0.185.1"
  }
}
</script>

<!-- ⚠ THESE THREE CACHE KEYS ARE CONTENT HASHES, AND THAT IS A FIX RATHER THAN A
     STYLE. `scripts/build-newdesign.mjs` rewrites text/babel tags ONLY — its
     BABEL_TAG pattern matches that type and no other — so every .jsx on this page
     ships under a content-hashed `nd/<name>?v=<hash>` URL and is re-fetched the
     moment it changes, while a module import keeps whatever
     `?v=` a human last typed. A dated key therefore goes stale silently: edit a module
     without touching the date and a returning browser pairs the NEW instrument with
     its OWN CACHED COPY of the OLD module.
     That is not hypothetical here. `rdLib` requires `F.wallWordFit`, which exists only
     in the new radioField.mjs; against a cached old one the guard correctly returns
     null, the field effect bails, and the hero renders its chrome over an empty black
     canvas. It is the module-cache lesson radio.jsx's own RdSetsComingUp comment cites
     from #1772, one tag over.
     The keys are the first 10 hex of each file's sha256, and
     tests/radio-module-cache-keys.test.mjs recomputes them from the bytes — so a
     module edited without a re-hash FAILS rather than shipping a stale pairing. -->
<script type="module">
  import * as SF from "/newdesign/radioSignalField.mjs?v=6b7fb4fce1";
  import * as TD from "/newdesign/radioTempo.mjs?v=081af8cfe9";

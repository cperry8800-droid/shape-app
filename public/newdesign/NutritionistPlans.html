<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Plans · Shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dash.css?v=20260612">
<script defer src="/_vercel/insights/script.js"></script></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="pageShell.jsx?v=20260612"></script>
<script type="text/babel" src="trainerDashboard.jsx?v=20260612b"></script>
<script type="text/babel" src="coachNav.jsx"></script>
<script type="text/babel" src="aiGenerator.jsx"></script>
<script type="text/babel">
function planMoney(cents) {
  try { return "$" + Math.round((cents || 0) / 100).toLocaleString(); }
  catch (e) { return "$0"; }
}
function planMeta(p) {
  return [
    p.durationWeeks ? p.durationWeeks + "w" : null,
    p.daysPerWeek ? p.daysPerWeek + " days/wk" : null,
    p.level || null,
  ].filter(Boolean).join(" · ");
}

// Mock templates — shown while the API loads, or when the viewer isn't a
// signed-in nutritionist.
const MOCK_PLANS = [
  { id: "n1", title: "Performance fuel (12w)", goal: "Fuel hard training without the crash.", level: "Intermediate", durationWeeks: 12, daysPerWeek: 7, status: "published", source: "manual", priceCents: 18000, clients: 14 },
  { id: "n2", title: "Protein-led cut (10w)", goal: "Lean out while protecting muscle.", level: "All levels", durationWeeks: 10, daysPerWeek: 7, status: "published", source: "manual", priceCents: 16000, clients: 7 },
  { id: "n3", title: "Plant-forward performance", goal: "Plant-based plan built for output.", level: "Intermediate", durationWeeks: 8, daysPerWeek: 7, status: "draft", source: "ai_generated", priceCents: null, clients: 0 },
];

function PlanCard({ p }) {
  const meta = planMeta(p);
  return (
    <Card style={{ padding: 22, display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <Pill tone={p.status === "published" ? "teal" : undefined}>{String(p.status || "draft").toUpperCase()}</Pill>
        {p.source === "ai_generated" && (
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.12em", color: TEAL_BRIGHT }}>AI</span>
        )}
      </div>
      <div style={{ fontFamily: serif, fontSize: 20, letterSpacing: "-0.01em", marginBottom: 8 }}>{p.title}</div>
      {p.goal && <div style={{ fontSize: 12.5, color: "rgba(242,237,228,0.6)", lineHeight: 1.45, marginBottom: 12 }}>{p.goal}</div>}
      {meta && <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.06em", color: "rgba(242,237,228,0.55)", marginBottom: 14 }}>{meta}</div>}
      <div style={{ marginTop: "auto", display: "flex", alignItems: "center", gap: 8, paddingTop: 14, borderTop: "1px solid rgba(242,237,228,0.08)", fontSize: 11.5, fontFamily: "'JetBrains Mono', monospace" }}>
        <span style={{ color: TEAL_BRIGHT }}>{p.priceCents != null ? planMoney(p.priceCents) + "/mo" : "Not listed"}</span>
        <span style={{ color: "rgba(242,237,228,0.55)" }}>· {p.clients} client{p.clients === 1 ? "" : "s"}</span>
      </div>
    </Card>
  );
}

// ── Client meal-menu builder ──────────────────────────────────────────────
// Authors the structured weekly menu (days -> meals -> macros) that the mobile
// Eat screen renders, and assigns it to a client via /api/nutritionist/meal-plan.
const MB_SLOTS = ["Breakfast", "Lunch", "Snack", "Dinner"];
const MB_DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const mbEmptyMeal = (slot) => ({ slot, time: "", title: "", kcal: "", p: "", c: "", f: "", desc: "", ingredients: [], stepsText: "", exp: false });
const mbEmptyIng = () => ({ qty: "", name: "", kcal: "" });
const mbNum = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };

function MBInput({ value, onChange, placeholder, w, type }) {
  return (
    <input
      value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder}
      type={type || "text"} inputMode={type === "number" ? "numeric" : undefined}
      style={{ width: w || "100%", background: "rgba(242,237,228,0.04)", border: "1px solid rgba(242,237,228,0.16)",
        borderRadius: 7, color: INK, fontFamily: sans, fontSize: 13, padding: "9px 11px", outline: "none" }}
    />
  );
}

function MealPlanBuilder({ clients, onClose, onSaved }) {
  const assignable = (clients || []).filter((c) => c.id);
  const [clientId, setClientId] = React.useState(assignable[0] ? assignable[0].id : "");
  const [title, setTitle] = React.useState("");
  const [activeDay, setActiveDay] = React.useState(0);
  const [dayTitles, setDayTitles] = React.useState(() => Array(7).fill(""));
  const [dayMeals, setDayMeals] = React.useState(() => Array.from({ length: 7 }, () => []));
  const [busy, setBusy] = React.useState(false);
  const [err, setErr] = React.useState("");

  const meals = dayMeals[activeDay];
  const setMeals = (next) => setDayMeals((prev) => prev.map((m, i) => (i === activeDay ? next : m)));
  const addMeal = () => setMeals([...meals, mbEmptyMeal("Lunch")]);
  const updMeal = (idx, patch) => setMeals(meals.map((m, i) => (i === idx ? { ...m, ...patch } : m)));
  const rmMeal = (idx) => setMeals(meals.filter((_, i) => i !== idx));
  const addIng = (mi) => updMeal(mi, { ingredients: [...(meals[mi].ingredients || []), mbEmptyIng()] });
  const setIng = (mi, gi, patch) => updMeal(mi, { ingredients: meals[mi].ingredients.map((g, j) => (j === gi ? { ...g, ...patch } : g)) });
  const rmIng = (mi, gi) => updMeal(mi, { ingredients: meals[mi].ingredients.filter((_, j) => j !== gi) });
  const dayTotal = (ms) => ms.reduce((a, m) => ({ cal: a.cal + mbNum(m.kcal), p: a.p + mbNum(m.p), c: a.c + mbNum(m.c), f: a.f + mbNum(m.f) }), { cal: 0, p: 0, c: 0, f: 0 });
  const tot = dayTotal(meals);
  const totalMeals = dayMeals.reduce((a, m) => a + m.length, 0);

  const submit = async () => {
    setErr("");
    if (!clientId) return setErr("Pick a client to assign this menu to.");
    if (!title.trim()) return setErr("Give the plan a name.");
    const days = dayMeals
      .map((ms, i) => ({ i, ms }))
      .filter((x) => x.ms.length > 0)
      .map(({ i, ms }) => ({
        dow: i,
        title: dayTitles[i].trim() || MB_DOW[i],
        totals: dayTotal(ms),
        targets: { cal: "", p: "", c: "", f: "" },
        meals: ms.map((m) => ({
          slot: m.slot, time: m.time, title: m.title.trim() || "Meal",
          kcal: mbNum(m.kcal), p: mbNum(m.p), c: mbNum(m.c), f: mbNum(m.f),
          hero: m.desc.trim(), brief: m.desc.trim(),
          ingredients: (m.ingredients || [])
            .filter((g) => (g.name || "").trim())
            .map((g) => ({ qty: g.qty.trim(), name: g.name.trim(), kcal: g.kcal === "" ? null : mbNum(g.kcal) })),
          steps: (m.stepsText || "").split("\n").map((s) => s.trim()).filter(Boolean),
          coachNote: "",
        })),
      }));
    if (!days.length) return setErr("Add at least one meal to a day.");
    setBusy(true);
    try {
      const res = await fetch('/api/nutritionist/meal-plan', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clientId, title: title.trim(), weekStart: null, days }),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || 'Could not save the plan.');
      onSaved && onSaved();
      onClose();
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };

  const mono = "'JetBrains Mono', monospace";
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(10,8,6,0.72)", zIndex: 200, display: "flex", justifyContent: "center", alignItems: "flex-start", padding: "5vh 16px", overflowY: "auto" }}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 760, background: "#1f1a15", border: "1px solid rgba(242,237,228,0.14)", borderRadius: 14, padding: 26 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18 }}>
          <div>
            <div style={{ fontFamily: mono, fontSize: 10, letterSpacing: "0.16em", color: TEAL_BRIGHT, marginBottom: 6 }}>NEW CLIENT MENU</div>
            <div style={{ fontFamily: serif, fontSize: 26, letterSpacing: "-0.02em" }}>Build a weekly menu</div>
          </div>
          <button onClick={onClose} style={{ background: "transparent", border: 0, color: "rgba(242,237,228,0.5)", fontSize: 22, cursor: "pointer", lineHeight: 1 }}>×</button>
        </div>

        {/* Basics */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 18 }}>
          <div>
            <div style={{ fontSize: 11, color: "rgba(242,237,228,0.55)", marginBottom: 6, fontFamily: mono, letterSpacing: "0.08em" }}>CLIENT</div>
            {assignable.length > 0 ? (
              <select value={clientId} onChange={(e) => setClientId(e.target.value)}
                style={{ width: "100%", background: "rgba(242,237,228,0.04)", border: "1px solid rgba(242,237,228,0.16)", borderRadius: 7, color: INK, fontFamily: sans, fontSize: 13, padding: "9px 11px" }}>
                {assignable.map((c) => <option key={c.id} value={c.id} style={{ background: "#1f1a15" }}>{c.name}</option>)}
              </select>
            ) : (
              <div style={{ fontSize: 12.5, color: "rgba(242,237,228,0.5)", padding: "9px 0" }}>No active clients with an account yet.</div>
            )}
          </div>
          <div>
            <div style={{ fontSize: 11, color: "rgba(242,237,228,0.55)", marginBottom: 6, fontFamily: mono, letterSpacing: "0.08em" }}>PLAN NAME</div>
            <MBInput value={title} onChange={setTitle} placeholder="e.g. Performance fuel — week 1" />
          </div>
        </div>

        {/* Day tabs */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 5, marginBottom: 16 }}>
          {MB_DOW.map((d, i) => {
            const count = dayMeals[i].length;
            const on = i === activeDay;
            return (
              <button key={i} onClick={() => setActiveDay(i)}
                style={{ padding: "8px 0", borderRadius: 7, cursor: "pointer", border: on ? "1px solid " + TEAL : "1px solid rgba(242,237,228,0.12)",
                  background: on ? "rgba(10,197,168,0.14)" : "transparent", color: on ? TEAL_BRIGHT : "rgba(242,237,228,0.7)", fontFamily: mono, fontSize: 11, letterSpacing: "0.04em" }}>
                {d}{count ? " ·" + count : ""}
              </button>
            );
          })}
        </div>

        {/* Active day editor */}
        <div style={{ marginBottom: 8 }}>
          <MBInput value={dayTitles[activeDay]} onChange={(v) => setDayTitles((prev) => prev.map((t, i) => (i === activeDay ? v : t)))} placeholder={"Day title (e.g. Loading day) — optional"} />
        </div>

        {meals.map((m, idx) => (
          <div key={idx} style={{ border: "1px solid rgba(242,237,228,0.1)", borderRadius: 10, padding: 12, marginBottom: 10 }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <select value={m.slot} onChange={(e) => updMeal(idx, { slot: e.target.value })}
                style={{ background: "rgba(242,237,228,0.04)", border: "1px solid rgba(242,237,228,0.16)", borderRadius: 7, color: INK, fontFamily: sans, fontSize: 12.5, padding: "8px 9px" }}>
                {MB_SLOTS.map((s) => <option key={s} value={s} style={{ background: "#1f1a15" }}>{s}</option>)}
              </select>
              <MBInput value={m.time} onChange={(v) => updMeal(idx, { time: v })} placeholder="07:00" w={88} />
              <MBInput value={m.title} onChange={(v) => updMeal(idx, { title: v })} placeholder="Meal name" />
              <button onClick={() => rmMeal(idx)} aria-label="Remove meal" style={{ background: "transparent", border: 0, color: "rgba(242,237,228,0.5)", fontSize: 18, cursor: "pointer", lineHeight: 1, flex: "none" }}>×</button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginBottom: 8 }}>
              <MBInput value={m.kcal} onChange={(v) => updMeal(idx, { kcal: v })} placeholder="kcal" type="number" />
              <MBInput value={m.p} onChange={(v) => updMeal(idx, { p: v })} placeholder="P (g)" type="number" />
              <MBInput value={m.c} onChange={(v) => updMeal(idx, { c: v })} placeholder="C (g)" type="number" />
              <MBInput value={m.f} onChange={(v) => updMeal(idx, { f: v })} placeholder="F (g)" type="number" />
            </div>
            <MBInput value={m.desc} onChange={(v) => updMeal(idx, { desc: v })} placeholder="Short description (optional)" />

            <button onClick={() => updMeal(idx, { exp: !m.exp })}
              style={{ marginTop: 8, background: "transparent", border: 0, color: TEAL_BRIGHT, fontFamily: mono, fontSize: 10.5, letterSpacing: "0.06em", cursor: "pointer", padding: 0 }}>
              {m.exp ? "− Hide" : "+ Ingredients & steps"}
              {!m.exp && ((m.ingredients || []).length || (m.stepsText || "").trim())
                ? <span style={{ color: "rgba(242,237,228,0.45)" }}> · {(m.ingredients || []).filter((g) => (g.name || "").trim()).length} ingredient{(m.ingredients || []).filter((g) => (g.name || "").trim()).length === 1 ? "" : "s"}</span>
                : null}
            </button>

            {m.exp && (
              <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px solid rgba(242,237,228,0.08)" }}>
                <div style={{ fontFamily: mono, fontSize: 9.5, letterSpacing: "0.12em", color: "rgba(242,237,228,0.5)", marginBottom: 7 }}>INGREDIENTS</div>
                {(m.ingredients || []).map((g, gi) => (
                  <div key={gi} style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                    <MBInput value={g.qty} onChange={(v) => setIng(idx, gi, { qty: v })} placeholder="200 g" w={88} />
                    <MBInput value={g.name} onChange={(v) => setIng(idx, gi, { name: v })} placeholder="Ingredient" />
                    <MBInput value={g.kcal} onChange={(v) => setIng(idx, gi, { kcal: v })} placeholder="kcal" type="number" w={78} />
                    <button onClick={() => rmIng(idx, gi)} aria-label="Remove ingredient" style={{ background: "transparent", border: 0, color: "rgba(242,237,228,0.5)", fontSize: 16, cursor: "pointer", lineHeight: 1, flex: "none" }}>×</button>
                  </div>
                ))}
                <button onClick={() => addIng(idx)} style={{ background: "transparent", border: "1px dashed rgba(242,237,228,0.2)", color: "rgba(242,237,228,0.7)", fontFamily: sans, fontSize: 12, cursor: "pointer", borderRadius: 7, padding: "6px 10px", marginBottom: 10 }}>+ Ingredient</button>
                <div style={{ fontFamily: mono, fontSize: 9.5, letterSpacing: "0.12em", color: "rgba(242,237,228,0.5)", margin: "4px 0 7px" }}>STEPS — one per line</div>
                <textarea value={m.stepsText} onChange={(e) => updMeal(idx, { stepsText: e.target.value })} rows={3}
                  placeholder={"Sauté onion 4 min.\nAdd beef, brown 6 min.\nSimmer 25 min."}
                  style={{ width: "100%", background: "rgba(242,237,228,0.04)", border: "1px solid rgba(242,237,228,0.16)", borderRadius: 7, color: INK, fontFamily: sans, fontSize: 13, padding: "9px 11px", outline: "none", resize: "vertical" }} />
              </div>
            )}
          </div>
        ))}

        <button onClick={addMeal} style={{ width: "100%", padding: "11px 0", borderRadius: 9, border: "1px dashed rgba(242,237,228,0.22)", background: "transparent", color: "rgba(242,237,228,0.75)", fontFamily: sans, fontSize: 13, cursor: "pointer", marginBottom: 14 }}>
          + Add meal to {MB_DOW[activeDay]}
        </button>

        {meals.length > 0 && (
          <div style={{ fontFamily: mono, fontSize: 11, color: "rgba(242,237,228,0.6)", marginBottom: 16 }}>
            {MB_DOW[activeDay]} total · {tot.cal} kcal · {tot.p}P {tot.c}C {tot.f}F
          </div>
        )}

        {err && <div style={{ color: "#e8896b", fontSize: 12.5, marginBottom: 12 }}>{err}</div>}

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingTop: 14, borderTop: "1px solid rgba(242,237,228,0.1)" }}>
          <div style={{ fontFamily: mono, fontSize: 11, color: "rgba(242,237,228,0.55)" }}>{totalMeals} meal{totalMeals === 1 ? "" : "s"} across the week</div>
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={onClose} style={{ background: "transparent", border: "1px solid rgba(242,237,228,0.2)", color: INK, padding: "10px 18px", borderRadius: 999, fontFamily: sans, fontSize: 13, cursor: "pointer" }}>Cancel</button>
            <button onClick={submit} disabled={busy} style={{ background: TEAL, border: 0, color: "#10100e", padding: "10px 22px", borderRadius: 999, fontFamily: sans, fontSize: 13, fontWeight: 600, cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1 }}>
              {busy ? "Assigning…" : "Assign menu"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function NutritionistPlansPage() {
  const [live, setLive] = React.useState(null);
  const [clients, setClients] = React.useState([]);
  const [builderOpen, setBuilderOpen] = React.useState(false);
  const [savedMsg, setSavedMsg] = React.useState("");
  React.useEffect(() => {
    let cancelled = false;
    fetch('/api/nutritionist/programs', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (!cancelled && d && d.isNutritionist) setLive(d); })
      .catch(() => {});
    fetch('/api/nutritionist/clients', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (!cancelled && d && d.clients) setClients(d.clients); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const plans = live ? live.programs : MOCK_PLANS;

  return (
    <DashPage
      navItems={nutriNavItems("plans")}
      payoutCard={nutriPayoutCard}
      eyebrow={plans.length + " MEAL PLAN" + (plans.length === 1 ? "" : "S")}
      title="Plans"
      subtitle="Your saved meal-plan templates — generate one with AI or build it from scratch."
    >
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ fontSize: 12.5, color: "rgba(242,237,228,0.6)" }}>
          {savedMsg
            ? <span style={{ color: TEAL_BRIGHT }}>{savedMsg}</span>
            : "Build a day-by-day menu and assign it straight to a client's app."}
        </div>
        <button onClick={() => { setSavedMsg(""); setBuilderOpen(true); }}
          style={{ background: TEAL, border: 0, color: "#10100e", padding: "10px 20px", borderRadius: 999, fontFamily: sans, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
          + Build client menu
        </button>
      </div>
      <AIGeneratorCard kind="meal_plan" role="nutritionist" />
      <div style={{ marginTop: 20 }}>
        {plans.length === 0 && (
          <Card style={{ padding: "34px 22px", textAlign: "center", color: "rgba(242,237,228,0.6)", fontSize: 13.5 }}>
            No meal plans yet. Use the generator above to create your first one.
          </Card>
        )}
        {plans.length > 0 && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 280px), 1fr))", gap: 16 }}>
            {plans.map((p) => <PlanCard key={p.id} p={p} />)}
          </div>
        )}
      </div>
      {builderOpen && (
        <MealPlanBuilder
          clients={clients}
          onClose={() => setBuilderOpen(false)}
          onSaved={() => setSavedMsg("Menu assigned — it's now live in your client's app.")}
        />
      )}
    </DashPage>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<NutritionistPlansPage />);
</script>
<script src="globalChatButton.js?v=20260609" defer></script>
</body>
</html>

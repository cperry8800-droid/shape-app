<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Train · Shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#1a1612}*{box-sizing:border-box}a{text-decoration:none;color:inherit}</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="pageShell.jsx"></script>
<script type="text/babel" src="chatWidget.jsx"></script>
<script type="text/babel" src="clientChatThreads.jsx"></script>
<script type="text/babel" src="trainerDashboard.jsx"></script>
<script type="text/babel" src="clientNav.jsx"></script>
<script type="text/babel">
function trainDate(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }); }
  catch (e) { return "—"; }
}

// Mock data — shown while the API loads, or when the viewer is signed out.
const MOCK_TRAIN = {
  assignedWorkouts: [
    { id: "w1", title: "Lower strength — Block 3", description: "Squat-focused session, 5 exercises, ~52 min.", kind: "custom" },
    { id: "w2", title: "Upper pull", description: "Row and vertical-pull volume.", kind: "template" },
    { id: "w3", title: "Long run prep", description: "Zone 2 base with closing strides.", kind: "template" },
  ],
  stats: { completedCount: 42, thisWeekCount: 3, totalVolumeLb: 38450, volume7dLb: 9120, avgRpe: 7.6, lastSessionAt: new Date(Date.now() - 86400000).toISOString() },
  recentSessions: [
    { title: "Upper push", at: new Date(Date.now() - 86400000).toISOString(), durationMin: 48 },
    { title: "Lower power", at: new Date(Date.now() - 3 * 86400000).toISOString(), durationMin: 54 },
    { title: "Upper pull", at: new Date(Date.now() - 5 * 86400000).toISOString(), durationMin: 46 },
  ],
};

function ClientTrainPage() {
  const [data, setData] = React.useState(MOCK_TRAIN);
  const [live, setLive] = React.useState(false);

  React.useEffect(() => {
    let cancelled = false;
    fetch('/api/client/train', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (!cancelled && d && d.ok) { setData(d); setLive(true); } })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const stats = data.stats || {};
  const assigned = data.assignedWorkouts || [];
  const recent = data.recentSessions || [];

  const cards = [
    { k: String(stats.completedCount ?? 0), l: "Workouts logged" },
    { k: String(stats.thisWeekCount ?? 0), l: "This week" },
    { k: (stats.totalVolumeLb ?? 0).toLocaleString() + " lb", l: "Total volume" },
    { k: stats.avgRpe != null ? String(stats.avgRpe) : "—", l: "Avg RPE" },
  ];

  return (
    <DashPage
      navItems={clientNavItems("train")}
      payoutCard={clientPayoutCard}
      eyebrow="ASSIGNED WORKOUTS · TRAINING HISTORY"
      title="Train"
      subtitle="Your assigned workouts and the sessions you've logged. Volume and RPE roll up from your set logs."
    >
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 16, marginBottom: 20 }}>
        {cards.map((c, i) => (
          <Card key={i} style={{ padding: "22px 22px 20px" }}>
            <div style={{ fontFamily: serif, fontSize: 40, letterSpacing: "-0.02em", lineHeight: 1 }}>{c.k}</div>
            <div style={{ fontSize: 13, marginTop: 12 }}>{c.l}</div>
          </Card>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 20 }}>
        <Card>
          <SectionTitle right={assigned.length + " ASSIGNED"}>Your workouts</SectionTitle>
          {assigned.length === 0 && (
            <div style={{ padding: "26px 4px", color: "rgba(242,237,228,0.5)", fontSize: 13 }}>
              No workouts assigned yet. Your coach's workouts will appear here.
            </div>
          )}
          {assigned.map((w, i) => (
            <div key={w.id} style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 14, alignItems: "center", padding: "16px 4px", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.06)" }}>
              <div>
                <div style={{ fontSize: 14, fontWeight: 500 }}>{w.title}</div>
                {w.description && <div style={{ fontSize: 12, color: "rgba(242,237,228,0.5)", marginTop: 3 }}>{w.description}</div>}
              </div>
              <Pill tone={w.kind === "custom" ? "teal" : undefined}>{String(w.kind || "").toUpperCase()}</Pill>
            </div>
          ))}
        </Card>

        <Card>
          <SectionTitle right="MOST RECENT">Recent sessions</SectionTitle>
          {recent.length === 0 && (
            <div style={{ padding: "26px 4px", color: "rgba(242,237,228,0.5)", fontSize: 13 }}>
              No completed sessions yet.
            </div>
          )}
          {recent.map((s, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 12, alignItems: "center", padding: "13px 4px", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.06)" }}>
              <div>
                <div style={{ fontSize: 13.5, fontWeight: 500 }}>{s.title}</div>
                <div style={{ fontSize: 11.5, color: "rgba(242,237,228,0.5)", marginTop: 1 }}>{trainDate(s.at)}</div>
              </div>
              <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: "rgba(242,237,228,0.7)" }}>{s.durationMin} min</span>
            </div>
          ))}
        </Card>
      </div>
    </DashPage>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(
  <React.Fragment>
    <ClientTrainPage />
    <ChatWidget tabs={clientChatTabs} />
  </React.Fragment>
);
</script>
<script src="globalChatButton.js" defer></script>
</body>
</html>

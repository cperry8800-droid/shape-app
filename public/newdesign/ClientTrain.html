function trainDate(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }); }
  catch (e) { return "—"; }
}
function trainShort(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString([], { weekday: "short", day: "numeric" }); }
  catch (e) { return "—"; }
}
function trainTime(iso) {
  if (!iso) return "";
  try { return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  catch (e) { return ""; }
}

const D_AGO = (n) => new Date(Date.now() - n * 86400000).toISOString();
const D_FWD = (n) => new Date(Date.now() + n * 86400000).toISOString();

    { d: D_AGO(5),  v: 2860 }, { d: D_AGO(4),  v: 0 },     { d: D_AGO(3),  v: 4280 }, { d: D_AGO(2),  v: 0 },

function ClientTrainPage() {
  const [data, setData] = React.useState(MOCK_TRAIN);
  const [live, setLive] = React.useState(false);
  const [openWorkout, setOpenWorkout] = React.useState(null);
  const [swapExIdx, setSwapExIdx] = React.useState(null);
  const [moveOverrides, setMoveOverrides] = React.useState({});
  React.useEffect(() => {
    if (!(window.shapeDb && window.shapeDb.getUserGoals)) return;
    window.shapeDb.getUserGoals("client_workout_swaps").then(s => { if (s && typeof s === "object") setMoveOverrides(s); }).catch(() => {});
  }, []);
  const applyWorkoutSwap = (baseName, altName, coachName) => {
    const next = { ...moveOverrides };
    if (!altName) delete next[baseName]; else next[baseName] = altName;
    setMoveOverrides(next);
    setSwapExIdx(null);
    try { window.shapeDb && window.shapeDb.saveUserGoals && window.shapeDb.saveUserGoals("client_workout_swaps", next); } catch (e) {}
    if (altName) { try { window.ShapeMessages && window.ShapeMessages.sendProviderMessage && window.ShapeMessages.sendProviderMessage({ coach: { name: coachName || "Your trainer", provider_role: "trainer" }, text: "Swapped " + baseName + " → " + altName }).catch(() => {}); } catch (e) {} }
  };

  React.useEffect(() => {
    let cancelled = false;
    fetch('/api/client/train', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (!cancelled && d && d.ok) { setData({ ...MOCK_TRAIN, ...d }); setLive(true); } })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const stats = data.stats || {};
  const recent = data.recentSessions || [];
  const assignedWorkouts = data.assignedWorkouts || [];
  const upcoming = data.upcoming || [];
  const volumeByDay = data.volumeByDay || [];
  const prs = data.prs || [];
  const muscleSplit = data.muscleSplit || [];
  const focus = data.weeklyFocus || null;

  const cards = [
    { k: String(stats.completedCount ?? 0), l: "Workouts logged" },
    { k: String(stats.thisWeekCount ?? 0) + (stats.thisWeekTarget ? "/" + stats.thisWeekTarget : ""), l: "This week" },
    { k: ((stats.volume7dLb ?? 0) / 1000).toFixed(1) + "k lb", l: "Volume 7d" },
    { k: stats.avgRpe != null ? String(stats.avgRpe) : "—", l: "Avg RPE" },
    { k: (stats.currentStreak ?? 0) + "d", l: "Current streak" },
  ];

  const maxVol = Math.max(1, ...volumeByDay.map(d => d.v || 0));

  return (
    <DashPage
      navItems={clientNavItems("train")}
      payoutCard={clientPayoutCard}
      eyebrow="UPCOMING · HISTORY · PRs · VOLUME"
      title="Train"
      subtitle="Your assigned workouts, completed sessions, lifetime PRs, and weekly volume — all in one view."
    >
      {/* KPI strip — 5 cards */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(5,1fr)", gap: 12, marginBottom: 20 }}>
        {cards.map((c, i) => (
          <Card key={i} style={{ padding: "20px 20px 18px" }}>
            <div style={{ fontFamily: serif, fontSize: 36, letterSpacing: "-0.02em", lineHeight: 1, fontVariantNumeric: "tabular-nums" }}>{c.k}</div>
            <div style={{ fontSize: 12, marginTop: 10, color: "rgba(242,237,228,0.7)" }}>{c.l}</div>
          </Card>
        ))}
      </div>

      {/* Coach's weekly focus banner */}
      {focus && (
        <Card style={{ marginBottom: 20, background: "linear-gradient(180deg, rgba(10,197,168,0.10), rgba(10,197,168,0.04))", border: "1px solid rgba(10,197,168,0.28)" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 20, alignItems: "center" }}>
            <div>
              <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.14em", color: TEAL_BRIGHT, marginBottom: 8 }}>THIS WEEK'S FOCUS · {focus.block.toUpperCase()}</div>
              <div style={{ fontFamily: serif, fontSize: 24, letterSpacing: "-0.015em", marginBottom: 8 }}>{focus.primary}</div>
              <div style={{ fontSize: 13, color: "rgba(242,237,228,0.75)", lineHeight: 1.5 }}>{focus.note}</div>
            </div>
            <div style={{ textAlign: "right", display: "flex", flexDirection: "column", gap: 6 }}>
              <Pill tone="teal">{focus.week.toUpperCase()}</Pill>
              <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.1em", color: "rgba(242,237,228,0.55)" }}>{focus.coach.toUpperCase()}</div>
            </div>
          </div>
        </Card>
      )}

      {/* Volume trend + PRs */}
      <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr", gap: 20, marginBottom: 20 }}>
        <Card>
          <SectionTitle right={`${((stats.volume7dLb ?? 0)/1000).toFixed(1)}K LB · LAST 7D`}>Volume trend</SectionTitle>
          <div style={{ display: "flex", alignItems: "flex-end", gap: 5, height: 150 }}>
            {volumeByDay.map((d, i) => {
              const h = d.v ? Math.max(8, (d.v / maxVol) * 100) : 4;
              const isToday = i === volumeByDay.length - 1;
              return (
                <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6, height: "100%", justifyContent: "flex-end" }}>
                  <div style={{ width: "100%", background: d.v ? (isToday ? TEAL_BRIGHT : "rgba(10,197,168,0.55)") : "rgba(242,237,228,0.08)", height: `${h}%`, borderRadius: 3, minHeight: 4 }} />
                  {i % 2 === 1 && <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9, color: "rgba(242,237,228,0.4)" }}>{trainShort(d.d).split(" ")[1]}</div>}
                  {i % 2 === 0 && <div style={{ height: 12 }} />}
                </div>
              );
            })}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 16, paddingTop: 14, borderTop: "1px solid rgba(242,237,228,0.08)" }}>
            <div>
              <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.1em", color: "rgba(242,237,228,0.5)" }}>STREAK</div>
              <div style={{ fontFamily: serif, fontSize: 22, marginTop: 4 }}>{stats.currentStreak}d <span style={{ fontSize: 12, color: "rgba(242,237,228,0.5)" }}>· best {stats.longestStreak}d</span></div>
            </div>
            <div>
              <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.1em", color: "rgba(242,237,228,0.5)" }}>TOTAL VOLUME</div>
              <div style={{ fontFamily: serif, fontSize: 22, marginTop: 4 }}>{((stats.totalVolumeLb || 0)/1000).toFixed(1)}k <span style={{ fontSize: 12, color: "rgba(242,237,228,0.5)" }}>lb all-time</span></div>
            </div>
            <div>
              <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.1em", color: "rgba(242,237,228,0.5)" }}>AVG RPE</div>
              <div style={{ fontFamily: serif, fontSize: 22, marginTop: 4 }}>{stats.avgRpe}</div>
            </div>
          </div>
        </Card>

        <Card>
          <SectionTitle right={`${prs.length} PRs`}>Personal records</SectionTitle>
          {prs.map((p, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr auto auto", gap: 12, alignItems: "center", padding: "12px 0", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.06)" }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 500 }}>{p.lift}</div>
                <div style={{ fontSize: 11, color: "rgba(242,237,228,0.5)", marginTop: 2 }}>{trainDate(p.at)} · was {p.prev}{p.unit}</div>
              </div>
              <div style={{ fontFamily: serif, fontSize: 22, lineHeight: 1, fontVariantNumeric: "tabular-nums" }}>{p.value}<span style={{ fontSize: 11, color: "rgba(242,237,228,0.5)", marginLeft: 2 }}>{p.unit}</span></div>
              <Pill tone="teal">+{p.deltaPct.toFixed(1)}%</Pill>
            </div>
          ))}
        </Card>
      </div>

      {/* Upcoming + Recent sessions */}
      {/* Assigned workouts — tap to view exercises and swap to a coach-approved alternative. */}
      {assignedWorkouts.length > 0 && (
        <Card style={{ marginBottom: 20 }}>
          <SectionTitle right={assignedWorkouts.length + " ASSIGNED"}>Your workouts</SectionTitle>
          {assignedWorkouts.map((w, i) => {
            const hasMoves = Array.isArray(w.moves) && w.moves.length;
            return (
              <div key={w.id || i} onClick={() => { if (hasMoves) { setSwapExIdx(null); setOpenWorkout(w); } }} style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 12, alignItems: "center", padding: "14px 4px", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.06)", cursor: hasMoves ? "pointer" : "default" }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 500 }}>{w.title}{hasMoves ? <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9, letterSpacing: "0.1em", color: TEAL_BRIGHT, marginLeft: 8 }}>VIEW · SWAP</span> : null}</div>
                  <div style={{ fontSize: 11.5, color: "rgba(242,237,228,0.5)", marginTop: 2 }}>{hasMoves ? w.moves.length + " exercises" : (w.description || "")}</div>
                </div>
                <Pill tone={w.kind === "custom" ? "teal" : undefined}>{String(w.kind || "").toUpperCase()}</Pill>
              </div>
            );
          })}
        </Card>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>
        <Card>
          <SectionTitle right={upcoming.length + " UPCOMING"}>Upcoming workouts</SectionTitle>
          {upcoming.length === 0 && (
            <div style={{ padding: "26px 4px", color: "rgba(242,237,228,0.5)", fontSize: 13 }}>
              No workouts scheduled. Your coach's plan will appear here.
            </div>
          )}
          {upcoming.map((w, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "auto 1fr auto", gap: 14, alignItems: "center", padding: "14px 4px", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.06)" }}>
              <div style={{ textAlign: "center", minWidth: 56 }}>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, letterSpacing: "0.14em", color: TEAL_BRIGHT }}>{new Date(w.at).toLocaleDateString([], { weekday: "short" }).toUpperCase()}</div>
                <div style={{ fontFamily: serif, fontSize: 20, marginTop: 2 }}>{new Date(w.at).getDate()}</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, color: "rgba(242,237,228,0.5)", marginTop: 2 }}>{w.time}</div>
              </div>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 13.5, fontWeight: 500 }}>{w.title}</div>
                <div style={{ fontSize: 11.5, color: "rgba(242,237,228,0.5)", marginTop: 2 }}>{w.durationMin} min · {w.exercises} exercises · by {w.programmedBy}</div>
              </div>
              <Pill tone={w.kind === "custom" ? "teal" : undefined}>{String(w.kind || "").toUpperCase()}</Pill>
            </div>
          ))}
        </Card>

        <Card>
          <SectionTitle right="LAST 5 SESSIONS">Recent sessions</SectionTitle>
          {recent.length === 0 && (
            <div style={{ padding: "26px 4px", color: "rgba(242,237,228,0.5)", fontSize: 13 }}>
              No completed sessions yet.
            </div>
          )}
          {recent.map((s, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 12, padding: "14px 4px", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.06)" }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 13.5, fontWeight: 500 }}>{s.title}</span>
                  {s.prCount > 0 && <Pill tone="teal">PR x{s.prCount}</Pill>}
                </div>
                <div style={{ fontSize: 11.5, color: "rgba(242,237,228,0.5)", marginTop: 3 }}>{trainShort(s.at)} · {s.focus}</div>
                <div style={{ display: "flex", gap: 14, marginTop: 6, fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "rgba(242,237,228,0.7)" }}>
                  <span>{s.durationMin}m</span>
                  {s.volumeLb > 0 && <span>{(s.volumeLb/1000).toFixed(1)}k lb</span>}
                  <span>RPE {s.avgRpe}</span>
                  <span>{s.exercises} ex</span>
                </div>
              </div>
            </div>
          ))}
        </Card>
      </div>

      {/* Muscle split */}
      <Card>
        <SectionTitle right="LAST 14 DAYS">Muscle group volume split</SectionTitle>
        <div style={{ display: "flex", height: 14, borderRadius: 999, overflow: "hidden", marginBottom: 16 }}>
          {muscleSplit.map((m, i) => (
            <div key={i} style={{ width: m.pct + "%", background: m.color }} title={`${m.name}: ${m.pct}%`} />
          ))}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 14 }}>
          {muscleSplit.map((m, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ width: 10, height: 10, borderRadius: 2, background: m.color, flex: "none" }} />
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 12.5 }}>{m.name}</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "rgba(242,237,228,0.55)" }}>{m.pct}%</div>
              </div>
            </div>
          ))}
        </div>
      </Card>

      {/* Workout detail — moves list with one-tap coach-approved swap. */}
      {openWorkout && (() => {
        const w = openWorkout;
        const moves = (w.moves || []).map(m => { const ov = moveOverrides[m.name]; return ov ? { ...m, name: ov, _base: m.name } : { ...m, _base: m.name }; });
        const M = "'JetBrains Mono', monospace";
        return (
          <div onClick={() => { setOpenWorkout(null); setSwapExIdx(null); }} style={{ position: "fixed", inset: 0, zIndex: 1000, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
            <div onClick={e => e.stopPropagation()} style={{ width: "100%", maxWidth: 520, background: "#1a1612", border: "1px solid rgba(242,237,228,0.14)", borderRadius: 16, padding: 22, maxHeight: "85vh", overflowY: "auto" }}>
              <div style={{ fontFamily: M, fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: TEAL_BRIGHT }}>Workout · by {w.programmedBy || "your coach"}</div>
              <div style={{ fontFamily: serif, fontSize: 24, fontWeight: 500, color: "#f2ede4", marginTop: 4 }}>{w.title}</div>
              <div style={{ fontFamily: M, fontSize: 11, color: "rgba(242,237,228,0.55)", marginTop: 4 }}>{w.durationMin ? w.durationMin + " min · " : ""}{moves.length} exercises</div>
              <div style={{ marginTop: 16 }}>
                {moves.map((m, i) => (
                  <div key={i} style={{ padding: "13px 0", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.06)" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10 }}>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontSize: 14.5, fontWeight: 500, color: "#f2ede4" }}>{m.name}{moveOverrides[m._base] && <span style={{ fontFamily: M, fontSize: 8.5, letterSpacing: "0.12em", color: TEAL_BRIGHT, marginLeft: 8 }}>SWAPPED</span>}</div>
                        <div style={{ fontFamily: M, fontSize: 11, color: "rgba(242,237,228,0.55)", marginTop: 3 }}>{m.detail}</div>
                      </div>
                      {(w.moves[i].alternatives && w.moves[i].alternatives.length) ? <button onClick={() => setSwapExIdx(swapExIdx === i ? null : i)} style={{ background: "transparent", border: "1px solid rgba(46,224,196,0.4)", color: TEAL_BRIGHT, borderRadius: 999, padding: "5px 11px", fontFamily: M, fontSize: 10, letterSpacing: "0.1em", cursor: "pointer", whiteSpace: "nowrap" }}>SWAP</button> : null}
                    </div>
                    {swapExIdx === i && (
                      <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
                        {[{ name: m._base, _keep: true }, ...(w.moves[i].alternatives || []).map(a => ({ name: a }))].map((o, k) => (
                          <button key={k} onClick={() => applyWorkoutSwap(m._base, o._keep ? null : o.name, w.programmedBy)} style={{ textAlign: "left", cursor: "pointer", padding: "10px 12px", borderRadius: 10, border: "1px solid " + (o._keep ? "rgba(46,224,196,0.5)" : "rgba(242,237,228,0.12)"), background: o._keep ? "rgba(46,224,196,0.07)" : "rgba(242,237,228,0.03)", color: "#f2ede4", fontSize: 13 }}>{o.name}{o._keep ? "  ·  current" : ""}</button>
                        ))}
                      </div>
                    )}
                  </div>
                ))}
              </div>
              <button onClick={() => { setOpenWorkout(null); setSwapExIdx(null); }} style={{ width: "100%", marginTop: 16, padding: "12px", borderRadius: 10, border: "1px solid rgba(242,237,228,0.14)", background: "transparent", color: "rgba(242,237,228,0.7)", fontFamily: M, fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase", cursor: "pointer" }}>Close</button>
            </div>
          </div>
        );
      })()}
    </DashPage>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(
  <React.Fragment>
    <ClientTrainPage />
    <ChatWidget tabs={clientChatTabs} />
  </React.Fragment>
);
</script>
<script src="globalChatButton.js?v=20260609" defer></script>

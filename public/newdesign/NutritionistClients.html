<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Clients · Shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#1a1612}*{box-sizing:border-box}a{text-decoration:none;color:inherit}</style>
<script defer src="/_vercel/insights/script.js"></script></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="pageShell.jsx"></script>
<script type="text/babel" src="trainerDashboard.jsx"></script>
<script type="text/babel" src="coachNav.jsx"></script>
<script type="text/babel" src="sharedClientsTab.jsx"></script>
<script type="text/babel">
function clientProfileHref(name) {
  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  return `ClientProfile.html?client=${encodeURIComponent(slug)}`;
}
function ncMoney(cents) {
  try { return "$" + Math.round((cents || 0) / 100).toLocaleString(); }
  catch (e) { return "$0"; }
}
function ncLast(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" }); }
  catch (e) { return "—"; }
}

// Mock roster — shown while the API loads, or when the viewer isn't a
// signed-in nutritionist (e.g. previewing the page).
const MOCK_NUTRI_CLIENTS = [
  { name: "Elena Rivera",  sessions: 24, mrrCents: 18000, lastAt: null, isNew: false },
  { name: "Marcus Larson", sessions: 12, mrrCents: 16000, lastAt: null, isNew: false },
  { name: "Priya Shah",    sessions: 14, mrrCents: 18000, lastAt: null, isNew: false },
  { name: "Jonah Weiss",   sessions: 7,  mrrCents: 16000, lastAt: null, isNew: false },
  { name: "Ana Park",      sessions: 1,  mrrCents: 14000, lastAt: null, isNew: true  },
  { name: "Deandre Kim",   sessions: 20, mrrCents: 18000, lastAt: null, isNew: false },
];

const NC_COLS = "2fr 96px 110px 116px 64px";

function NutritionistClientsPage() {
  const [live, setLive] = React.useState(null);
  const [tab, setTab] = React.useState("all");
  const [sharedBadge, setSharedBadge] = React.useState(0);
  const [q, setQ] = React.useState("");
  const [flt, setFlt] = React.useState("all");
  React.useEffect(() => {
    let cancelled = false;
    fetch('/api/nutritionist/clients', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (!cancelled && d && d.isNutritionist) setLive(d); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const clients = live ? live.clients : MOCK_NUTRI_CLIENTS;
  const activeCount = live ? live.totals.active : clients.length;
  const mrrCents = live ? live.totals.mrrCents : clients.reduce((s, c) => s + c.mrrCents, 0);
  const avgCents = clients.length ? Math.round(mrrCents / clients.length) : 0;
  const tabStyle = (on) => ({ background: on ? "rgba(46,224,196,0.14)" : "transparent", color: on ? "#2ee0c4" : "rgba(242,237,228,0.65)", border: on ? "1px solid rgba(46,224,196,0.35)" : "1px solid rgba(242,237,228,0.12)", padding: "8px 16px", borderRadius: 999, fontFamily: "'Space Grotesk', sans-serif", fontSize: 12.5, fontWeight: 500, cursor: "pointer", letterSpacing: "0.02em" });
  // Search + filter (mirrors the mobile roster).
  const fltStyle = (on) => ({ background: on ? "rgba(46,224,196,0.14)" : "transparent", color: on ? "#2ee0c4" : "rgba(242,237,228,0.7)", border: on ? "1px solid rgba(46,224,196,0.35)" : "1px solid rgba(242,237,228,0.12)", padding: "7px 14px", borderRadius: 999, fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", cursor: "pointer" });
  const isStale = (c) => { if (c.isNew) return false; if (!c.lastAt) return (c.sessions || 0) < 3; const days = (Date.now() - new Date(c.lastAt).getTime()) / 86400000; return days > 14; };
  // Prefer the server-computed status; fall back to a local derive for the mock roster.
  const statusOf = (c) => c.status || (c.isNew ? "new" : isStale(c) ? "eyes" : "ontrack");
  const matchesFlt = (c) => flt === "all" || statusOf(c) === flt;
  const FILTERS = [["all", "All"], ["ontrack", "On track"], ["eyes", "Needs eyes"], ["new", "New"]];
  const shown = clients.filter(matchesFlt).filter((c) => { const s = q.trim().toLowerCase(); return !s || (c.name || "").toLowerCase().includes(s); });

  return (
    <DashPage
      navItems={nutriNavItems("clients")}
      payoutCard={nutriPayoutCard}
      eyebrow={activeCount + " ACTIVE CLIENT" + (activeCount === 1 ? "" : "S")}
      title="Clients"
      subtitle="Everyone you're feeding — jump to anyone's profile, plan, and logs."
      actions={
        <button style={{ background: INK, color: PAPER, border: 0, padding: "10px 22px", borderRadius: 999, fontFamily: sans, fontSize: 13, fontWeight: 500, cursor: "pointer" }}>Invite client</button>
      }
    >
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 16, marginBottom: 20 }}>
        {[
          { k: String(activeCount), l: "Active clients" },
          { k: ncMoney(mrrCents), l: "Monthly recurring" },
          { k: ncMoney(avgCents), l: "Avg / client" },
        ].map((x, i) => (
          <Card key={i} style={{ padding: "22px 22px 20px" }}>
            <div style={{ fontFamily: serif, fontSize: 40, letterSpacing: "-0.02em", lineHeight: 1 }}>{x.k}</div>
            <div style={{ fontSize: 13, marginTop: 12 }}>{x.l}</div>
          </Card>
        ))}
      </div>
      <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
        <button onClick={() => setTab("all")} style={tabStyle(tab === "all")}>All clients</button>
        <button onClick={() => setTab("shared")} style={tabStyle(tab === "shared")}>
          Shared clients{sharedBadge > 0 ? ` · ${sharedBadge} new` : ""}
        </button>
        <a href="NutritionistLiveConsole.html" style={{ ...tabStyle(false), textDecoration: "none", display: "inline-block" }}>Console</a>
        <a href="NutritionistAnalytics.html" style={{ ...tabStyle(false), textDecoration: "none", display: "inline-block" }}>Analytics</a>
      </div>
      <Card>
        {tab === "shared" ? (
          <SharedClientsTab role="nutritionist" onCountChange={setSharedBadge} />
        ) : (
          <>
            {/* Search + filter pills (mirrors the mobile roster) */}
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, border: "1px solid rgba(242,237,228,0.12)", borderRadius: 12, background: "rgba(242,237,228,0.04)", padding: "11px 14px" }}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(242,237,228,0.5)" strokeWidth="2" style={{ flex: "none" }}><circle cx="11" cy="11" r="7" /><line x1="16.5" y1="16.5" x2="21" y2="21" strokeLinecap="round" /></svg>
              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder={`Search ${clients.length} clients`} style={{ flex: 1, minWidth: 0, border: 0, background: "transparent", outline: "none", color: INK, fontFamily: sans, fontSize: 14 }} />
            </div>
            <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
              {FILTERS.map(([k, l]) => <button key={k} onClick={() => setFlt(k)} style={fltStyle(flt === k)}>{l}</button>)}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: NC_COLS, gap: 12, padding: "6px 4px 14px", fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.08em", color: "rgba(242,237,228,0.5)", borderBottom: "1px solid rgba(242,237,228,0.08)" }}>
              <span>CLIENT</span><span>CONSULTS</span><span>MRR</span><span>LAST CONSULT</span><span></span>
            </div>
            {clients.length === 0 && (
              <div style={{ padding: "34px 4px", textAlign: "center", color: "rgba(242,237,228,0.55)", fontSize: 13.5 }}>
                No clients yet. Share your public profile to start getting subscribers.
              </div>
            )}
            {clients.length > 0 && shown.length === 0 && (
              <div style={{ padding: "34px 4px", textAlign: "center", color: "rgba(242,237,228,0.55)", fontSize: 13.5 }}>
                No clients match this search or filter.
              </div>
            )}
            {shown.map((c, i) => (
              <a
                key={i}
                href={clientProfileHref(c.name)}
                aria-label={`Open ${c.name} profile`}
                style={{ display: "grid", gridTemplateColumns: NC_COLS, gap: 12, padding: "14px 4px", alignItems: "center", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.05)", color: "inherit", textDecoration: "none", cursor: "pointer" }}
              >
                <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                  <div style={{ width: 28, height: 28, borderRadius: 999, background: "#efece6" }} />
                  <span style={{ fontSize: 13.5, fontWeight: 500 }}>{c.name}</span>
                </div>
                <span style={{ fontSize: 12, fontFamily: "'JetBrains Mono', monospace" }}>{c.sessions}</span>
                <span style={{ fontSize: 12.5, fontFamily: "'JetBrains Mono', monospace", color: TEAL_BRIGHT }}>{ncMoney(c.mrrCents)}</span>
                <span style={{ fontSize: 12, fontFamily: "'JetBrains Mono', monospace", color: "rgba(242,237,228,0.7)" }}>{ncLast(c.lastAt)}</span>
                <span>{c.isNew && <Pill tone="teal">NEW</Pill>}</span>
              </a>
            ))}
          </>
        )}
      </Card>
    </DashPage>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<NutritionistClientsPage />);
</script>
<script src="globalChatButton.js?v=20260609" defer></script>
</body>
</html>

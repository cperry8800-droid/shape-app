<script>
// Role guard — keep the dashboard in sync with the signed-in user's ACTIVE role.
// A trainer/nutritionist who lands on the client SPA (e.g. a login "LOG IN AS"
// mismatch or an old link) is redirected to their own dashboard. Signed-out
// preview and clients are unaffected (no redirect).
(function () {
  fetch('/api/me', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var role = d && d.user && d.user.role;
      var dash = role === 'trainer' ? 'TrainerApp.html' : role === 'nutritionist' ? 'NutritionistApp.html' : null;
      if (dash) {
        // Reconcile client-only routes when forwarding a coach. #settings is a
        // client tab; the coach SPAs have no such route and fall back to Today
        // for unknown hashes. A coach's account controls ride their profile, so
        // translate #settings -> #profile. This is the ONE place that knows the
        // role, so it's where the role-blind ClientMe.html alias (which now
        // targets #settings) is made safe for coaches following an old link.
        var hash = window.location.hash === '#settings' ? '#profile' : (window.location.hash || '');
        window.location.replace('/newdesign/' + dash + hash);
      }
    })
    .catch(function () {});
})();
</script>

<script type="text/babel">
// Each route returns exactly what the standalone page used to mount, so behaviour
// (incl. the ChatWidget where a page had one) is identical — only the navigation
// is now client-side. The page components render their own full layout + sidebar.
const CA_ROUTES = {
  today:     () => <React.Fragment><ClientDashboardPage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  progress:  () => <React.Fragment><ClientProgressPage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  workouts:  () => <React.Fragment><ClientWorkoutsPage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  nutrition: () => <React.Fragment><ClientNutritionPage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  library:   () => <React.Fragment><ClientLibraryPage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  team:      () => <ClientTeamPage />,
  community: () => <CommunityPage navItems={clientNavItems("community")} payoutCard={clientPayoutCard} chatTabs={clientChatTabs} />,
  score:     () => <React.Fragment><ClientScorePage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  habits:    () => <React.Fragment><ClientHabitsPage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  goal:      () => <ClientGoalsPage />,
  profile:   () => <React.Fragment><LiveProfilePage demoRole="client" shell={{ navItems: clientNavItems("profile"), payoutCard: clientPayoutCard }} /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  settings:  () => <React.Fragment><ClientSettingsPage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
};

// Settings is its own dashboard tab (owner call 2026-07-23) — it used to ride the
// profile page's extras slot, which made it render under EVERY profile tab (Music
// included). ClientMeSettings brings its own "Settings." masthead + actions, so
// this shell is the bare dashboard chrome (Header + sidebar + main), not DashPage
// (whose h1 would double the title).
function ClientSettingsPage() {
  return (
    <div style={{ background: PAPER, color: INK, minHeight: "100vh", fontFamily: sans, display: "flex", flexDirection: "column" }}>
      <Header />
      <div className="dash-shell-grid" style={{ display: "grid", gridTemplateColumns: "240px 1fr", flex: 1 }}>
        <DashSidebar navItems={clientNavItems("settings")} payoutCard={clientPayoutCard} />
        <main style={{ padding: "24px 8px 80px", minWidth: 0, overflowX: "hidden" }}>
          <ClientMeSettings />
        </main>
      </div>
      <Footer />
    </div>
  );
}
function caSlug() { const h = (window.location.hash || "").replace(/^#/, "").toLowerCase(); return CA_ROUTES[h] ? h : "today"; }
function ClientApp() {
  const [route, setRoute] = React.useState(caSlug());
  React.useEffect(() => {
    if (!window.location.hash) { try { window.history.replaceState(null, "", "#" + route); } catch (e) {} }
    const onHash = () => { setRoute(caSlug()); try { window.scrollTo(0, 0); } catch (e) {} };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  return (CA_ROUTES[route] || CA_ROUTES.today)();
}
ReactDOM.createRoot(document.getElementById("root")).render(<ClientApp />);
window.ShapeDashTour && window.ShapeDashTour.init('client');
</script>

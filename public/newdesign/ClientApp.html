<script>
// Role guard — keep the dashboard in sync with the signed-in user's ACTIVE role.
// A trainer/nutritionist who lands on the client SPA (e.g. a login "LOG IN AS"
// mismatch or an old link) is redirected to their own dashboard. Signed-out
// preview and clients are unaffected (no redirect).
(function () {
  fetch('/api/me', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var role = d && d.user && d.user.role;
      var dash = role === 'trainer' ? 'TrainerApp.html' : role === 'nutritionist' ? 'NutritionistApp.html' : null;
      if (dash) window.location.replace('/newdesign/' + dash + (window.location.hash || ''));
    })
    .catch(function () {});
})();
</script>

<script type="text/babel">
// Each route returns exactly what the standalone page used to mount, so behaviour
// (incl. the ChatWidget where a page had one) is identical — only the navigation
// is now client-side. The page components render their own full layout + sidebar.
const CA_ROUTES = {
  today:     () => <React.Fragment><ClientDashboardPage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  progress:  () => <React.Fragment><ClientProgressPage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  workouts:  () => <React.Fragment><ClientWorkoutsPage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  nutrition: () => <React.Fragment><ClientNutritionPage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  library:   () => <React.Fragment><ClientLibraryPage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  team:      () => <ClientTeamPage />,
  community: () => <CommunityPage navItems={clientNavItems("community")} payoutCard={clientPayoutCard} chatTabs={clientChatTabs} />,
  score:     () => <React.Fragment><ClientScorePage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  habits:    () => <React.Fragment><ClientHabitsPage /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
  goal:      () => <ClientGoalsPage />,
  profile:   () => <React.Fragment><LiveProfilePage demoRole="client" shell={{ navItems: clientNavItems("profile"), payoutCard: clientPayoutCard }} extras={<ClientMeSettings />} /><ChatWidget tabs={clientChatTabs} /></React.Fragment>,
};
function caSlug() { const h = (window.location.hash || "").replace(/^#/, "").toLowerCase(); return CA_ROUTES[h] ? h : "today"; }
function ClientApp() {
  const [route, setRoute] = React.useState(caSlug());
  React.useEffect(() => {
    if (!window.location.hash) { try { window.history.replaceState(null, "", "#" + route); } catch (e) {} }
    const onHash = () => { setRoute(caSlug()); try { window.scrollTo(0, 0); } catch (e) {} };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  return (CA_ROUTES[route] || CA_ROUTES.today)();
}
ReactDOM.createRoot(document.getElementById("root")).render(<ClientApp />);
window.ShapeDashTour && window.ShapeDashTour.init('client');
</script>

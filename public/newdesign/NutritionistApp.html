// Role guard — keep the dashboard in sync with the signed-in user's ACTIVE role.
// A client/trainer who lands on the nutritionist SPA is redirected to their own
// dashboard. Signed-out preview and nutritionists are unaffected (no redirect).
(function () {
  fetch('/api/me', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var role = d && d.user && d.user.role;
      var dash = role === 'client' ? 'ClientApp.html' : role === 'trainer' ? 'TrainerApp.html' : null;
      if (dash) window.location.replace('/newdesign/' + dash + (window.location.hash || ''));
    })
    .catch(function () {});
})();
</script>

<script type="text/babel" data-presets="react">
// Playlists context (was inline on NutritionistPlaylists.html).
const NUTRI_CTX = {
  role: "nutritionist",
  playlists: NUTRI_PLAYLISTS,
  attachTargets: NUTRI_ATTACH_TARGETS,
  attachmentUnit: "meal",
  attachmentUnitPlural: "meals",
  navItems: nutriNavItems,
  payoutCard: nutriPayoutCard,
  subtitle: "Paste a Spotify or Apple Music link, attach it to a meal, recipe, or prep routine, and your client gets a play button in their kitchen. Optional, always skippable."
};
// Tells dashClientPageHref() that a client link is the `#client/<id>` route here
// (an instant, same-document switch that keeps the sidebar), not the standalone page.
window.__shapeCoachShell = "nutritionist";
window.__shapeDashShell = "nutritionist";   // read by pageShell's dashShellHref (R19)
const NA_ROUTES = {
  today:     () => <CoachDashboardPage role="nutritionist" />,
  week:      () => <CoachWeekPage role="nutritionist" />,
  schedule:  () => <CoachSchedulePage role="nutritionist" />,
  clients:   () => <NutritionistClientsPage />,
  plans:     () => <NutritionistPlansPage />,
  business:  () => <CoachBusinessPage role="nutritionist" />,
  playlists: () => <PlaylistPage ctx={NUTRI_CTX} />,
  community: () => <CommunityPage navItems={nutriNavItems("community")} payoutCard={nutriPayoutCard} />,
  goal:      () => <NutritionistGoalPage />,
  score:     () => <NutritionistScorePage />,
  profile:   () => <LiveProfilePage demoRole="nutritionist" shell={{ navItems: nutriNavItems("profile"), payoutCard: nutriPayoutCard }} extras={<DashProfileExtras />} />,
  settings:  () => <CoachSettingsPage role="nutritionist" />,
  // The per-client deep dive (review 2026-09-09, R2): the same page TrainerClient.html /
  // NutritionistClient.html mount standalone, keyed so switching clients remounts it.
  client:    (id) => <CoachClientDetailPage key={id} clientId={id} role="nutritionist" inShell />,
};
function naParse() {
  const raw = (window.location.hash || "").replace(/^#/, "");
  const m = /^client\/(.+)$/.exec(raw);
  if (m) { try { return { slug: "client", param: decodeURIComponent(m[1]) }; } catch (e) { return { slug: "clients", param: null }; } }
  const h = raw.toLowerCase();
  // hasOwnProperty, not a bare lookup: `#constructor` resolves through
  // Object.prototype, and the route call then returns an Object that React
  // throws on instead of falling back to Today.
  const known = h !== "client" && Object.prototype.hasOwnProperty.call(NA_ROUTES, h);
  return { slug: known ? h : "today", param: null };
}
function NutritionistApp() {
  const [route, setRoute] = React.useState(naParse());
  React.useEffect(() => {
    if (!window.location.hash) {
      try { window.history.replaceState(null, "", "#" + route.slug); } catch (e) {}
      // ⚠ THE COACH'S OWN LANDING TAB (R14), AND ONLY IF THEY ARE STILL HERE. This is
      // an async read; a coach who has clicked a tab while it was in flight must not be
      // yanked back to a default. Re-checked against the CURRENT hash, not the one this
      // effect saw — and `hashchange` does the rendering, so nothing races the router.
      cstResolveLandingTab((slug) => Object.prototype.hasOwnProperty.call(NA_ROUTES, slug)).then((slug) => {
        if (!slug) return;
        const now = (window.location.hash || "").replace(/^#/, "");
        if (now && now !== route.slug) return;   // they navigated — leave them alone
        if (slug === route.slug) return;
        // ⚠ replaceState, NOT `location.hash = …`. An assignment PUSHES a history
        // entry on top of the "#today" the line above just replaceState'd — so a coach
        // whose landing tab is Week pressed Back and landed on a tab they never chose,
        // needing a second Back to leave the dashboard at all. Replacing keeps their
        // history pointing at wherever they came from; the router state is set here
        // directly, since replaceState fires no hashchange.
        try { window.history.replaceState(null, "", "#" + slug); } catch (e) {}
        setRoute(naParse());
      }).catch(() => {});
    }
    const onHash = () => { setRoute(naParse()); try { window.scrollTo(0, 0); } catch (e) {} };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  const view = Object.prototype.hasOwnProperty.call(NA_ROUTES, route.slug) ? NA_ROUTES[route.slug] : NA_ROUTES.today;
  return view(route.param);
}
ReactDOM.createRoot(document.getElementById("root")).render(<NutritionistApp />);
window.ShapeDashTour && window.ShapeDashTour.init('nutritionist');

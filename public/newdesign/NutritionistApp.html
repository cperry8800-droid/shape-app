<script type="text/babel" data-presets="react">
// Playlists context (was inline on NutritionistPlaylists.html).
const NUTRI_CTX = {
  role: "nutritionist",
  playlists: NUTRI_PLAYLISTS,
  attachTargets: NUTRI_ATTACH_TARGETS,
  attachmentUnit: "meal",
  attachmentUnitPlural: "meals",
  navItems: nutriNavItems,
  payoutCard: nutriPayoutCard,
  subtitle: "Paste a Spotify or Apple Music link, attach it to a meal, recipe, or prep routine, and your client gets a play button in their kitchen. Optional, always skippable."
};
const NA_ROUTES = {
  today:     () => <CoachDashboardPage role="nutritionist" />,
  schedule:  () => <CoachSchedulePage role="nutritionist" />,
  clients:   () => <NutritionistClientsPage />,
  plans:     () => <NutritionistPlansPage />,
  business:  () => <CoachBusinessPage role="nutritionist" />,
  playlists: () => <PlaylistPage ctx={NUTRI_CTX} />,
  community: () => <CommunityPage navItems={nutriNavItems("community")} payoutCard={nutriPayoutCard} />,
  goal:      () => <NutritionistGoalPage />,
  score:     () => <NutritionistScorePage />,
  profile:   () => <LiveProfilePage demoRole="nutritionist" shell={{ navItems: nutriNavItems("profile"), payoutCard: nutriPayoutCard }} extras={<DashProfileExtras />} />,
};
function naSlug() { const h = (window.location.hash || "").replace(/^#/, "").toLowerCase(); return NA_ROUTES[h] ? h : "today"; }
function NutritionistApp() {
  const [route, setRoute] = React.useState(naSlug());
  React.useEffect(() => {
    if (!window.location.hash) { try { window.history.replaceState(null, "", "#" + route); } catch (e) {} }
    const onHash = () => { setRoute(naSlug()); try { window.scrollTo(0, 0); } catch (e) {} };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  return (NA_ROUTES[route] || NA_ROUTES.today)();
}
ReactDOM.createRoot(document.getElementById("root")).render(<NutritionistApp />);
</script>

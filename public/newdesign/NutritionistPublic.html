<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shape — Coach profile</title>
<style>html,body{margin:0;background:#1a1612;color:#f2ede4;font-family:system-ui}</style>
<script>
// Superseded by the living profile (MemberProfile.html renders Signal for
// coaches). Kept as a redirect so every old link keeps working:
//   ?u=<userId>      -> MemberProfile.html?u=<userId>
//   ?coach=<slug>    -> MemberProfile.html?name=<Name>&role=nutritionist
//   (no params)      -> MemberProfile.html (your own profile when signed in)
(function () {
  var q = new URLSearchParams(location.search);
  var out = new URLSearchParams();
  if (q.get('u')) {
    out.set('u', q.get('u'));
  } else if (q.get('coach')) {
    out.set('name', q.get('coach').split('-').map(function (w) { return w ? w.charAt(0).toUpperCase() + w.slice(1) : w; }).join(' '));
    out.set('role', 'nutritionist');
  }
  var qs = out.toString();
  location.replace('MemberProfile.html' + (qs ? '?' + qs : ''));
})();
</script>
</head><body></body></html>

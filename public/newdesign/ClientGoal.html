// ── Body-comp helpers (mirror mobile bsGoal*) ───────────────────────────────
function goalWeighIns(o) { return (o && Array.isArray(o.weighIns)) ? o.weighIns.filter(x => x && Number.isFinite(Number(x.kg))) : []; }
function goalNow(o) { const wi = goalWeighIns(o); return wi.length ? Number(wi[wi.length - 1].kg) : (Number(o && o.now) || 0); }
function goalSeries(o) {
  const wi = goalWeighIns(o);
  if (wi.length >= 2) return wi.map(x => Number(x.kg));
  const n = goalNow(o);
  return [Number(o && o.start) || n, n];
}

function isoFromWeeks(weeks) {
  const d = new Date();
  d.setDate(d.getDate() + weeks * 7);
  return d.toISOString().slice(0, 10);
}
function daysUntil(iso) {
  if (!iso) return null;
  const ms = new Date(iso).getTime() - Date.now();
  return Math.max(0, Math.round(ms / 86_400_000));
}

// ── Overall body-comp dashboard (ported from the mobile broadsheet) ─────────
function OverallDashboard({ overall, accent, onEdit, onLog, plans: livePlans = null, weekTargets: liveWeek = null }) {
  const start = Number(overall.start) || 0, now = goalNow(overall), target = Number(overall.target) || 0;
  const unit = overall.unit || "kg";
  const down = +(now - start).toFixed(1);
  const range = +(start - target).toFixed(1);
  const toGo = +(now - target).toFixed(1);
  const pct = range > 0 ? Math.max(0, Math.min(1, (start - now) / range)) : 0;
  const byD = overall.by ? new Date(overall.by) : null;
  const byLabel = byD && !isNaN(byD) ? byD.toLocaleDateString([], { month: "short", day: "numeric" }).toUpperCase() : "";
  const wPace = (() => {
    const wi = goalWeighIns(overall);
    if (wi.length < 2) return null;
    const a = wi[0], b = wi[wi.length - 1];
    const da = new Date(a.d), db = new Date(b.d);
    const dk = Number(b.kg) - Number(a.kg);
    if (!isNaN(da) && !isNaN(db) && db > da) { const wks = Math.max(1, (db - da) / (7 * 86400000)); return Math.round((dk / wks) * 10) / 10; }
    return Math.round((dk / Math.max(1, wi.length - 1)) * 10) / 10;
  })();
  const onTrack = wPace == null ? null : (range > 0 ? wPace < 0 : range < 0 ? wPace > 0 : Math.abs(wPace) < 0.2);
  const stats = [
    { l: "Current",     c: accent,    v: now.toLocaleString(), u: unit, sub: "Latest weigh-in" },
    { l: "To go",       c: RUST,      v: toGo.toLocaleString(), u: unit, sub: `of ${range} ${unit}` },
    { l: "Weekly pace", c: G_AMBER,   v: wPace != null ? wPace.toLocaleString() : "—", u: wPace != null ? unit : "", sub: "per week" },
    { l: "On track",    c: G_GREEN,   v: onTrack == null ? "—" : onTrack ? "Yes" : "Off", u: "", sub: byLabel ? `goal ${byLabel}` : "toward goal" },
  ];
  // Milestones from the real trajectory (start → quarter points → target).
  const milestones = (() => {
    if (!(range !== 0 && Number.isFinite(start) && Number.isFinite(target))) {
      return [{ n: "01", t: "Set a goal", sub: "add start + target", when: "Start", next: true }];
    }
    const fmtv = (v) => `${Math.round(v * 10) / 10} ${unit}`;
    const reached = (wv) => range > 0 ? now <= wv + 0.05 : now >= wv - 0.05;
    const defs = [
      { w: start, t: "Baseline set", sub: "plans live" },
      { w: start - range * 0.25, t: "25% there", sub: "habits sticking" },
      { w: start - range * 0.5, t: "Halfway", sub: "on pace" },
      { w: start - range * 0.75, t: "75% there", sub: "closing in" },
      { w: target, t: "Goal", sub: "lean & strong" },
    ];
    let nextMarked = false;
    return defs.map((m, i) => {
      const done = reached(m.w);
      const isNext = !done && !nextMarked; if (isNext) nextMarked = true;
      return { done, next: isNext, n: String(i + 1).padStart(2, "0"), t: `${m.t} · ${fmtv(m.w)}`, sub: m.sub, when: i === 0 ? (overall.startMonth || "Start") : i === defs.length - 1 ? (byLabel || "Goal") : (isNext ? "Next" : "") };
    });
  })();
  const PLAN_C = [G_AMBER, RUST];
  const plans = (Array.isArray(livePlans) && livePlans.length)
    ? livePlans.map((p, i) => ({ ...p, c: p.c || PLAN_C[i % PLAN_C.length] }))
    : [
      { role: "Training", c: G_AMBER, t: "12-wk lean strength", sub: "Jordan · 4×/wk" },
      { role: "Nutrition", c: RUST,   t: "Protein-led cut",     sub: "Dr. Maya · 1,890 kcal" },
    ];
  const WK_C = [RUST, accent, G_PURPLE, G_AMBER];
  const weekTargets = (Array.isArray(liveWeek) && liveWeek.length)
    ? liveWeek.map((w, i) => ({ ...w, c: w.c || WK_C[i % WK_C.length] }))
    : [
      { l: "Sessions",     v: "3/4",  sub: "one to go",      c: RUST },
      { l: "Protein days", v: "6/7",  sub: "≥170g hit",      c: accent },
      { l: "Steps",        v: "7.2k", sub: "avg · goal 8k",  c: G_AMBER },
      { l: "Sleep",        v: "6.8h", sub: "avg · goal 7h",  c: G_PURPLE },
    ];
  const SecHead = ({ kicker, title, action }) => (
    <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 10, margin: "30px 0 14px" }}>
      <div>
        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", color: accent }}>{kicker}</div>
        <div style={{ fontFamily: serif, fontSize: 26, letterSpacing: "-0.02em", color: INK, marginTop: 2 }}>{title}</div>
      </div>
      {action && <button onClick={action.onClick} style={{ background: "transparent", border: 0, cursor: "pointer", color: accent, fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, fontWeight: 500, letterSpacing: "0.12em", textTransform: "uppercase" }}>{action.label} →</button>}
    </div>
  );
  const miniCard = (s, i) => (
    <div key={i} style={{ borderRadius: 16, border: "1px solid rgba(242,237,228,0.1)", background: "rgba(242,237,228,0.04)", padding: 18 }}>
      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, letterSpacing: "0.16em", textTransform: "uppercase", color: s.c }}>{s.l}</div>
      <div style={{ marginTop: 6, fontFamily: serif, fontSize: 30, letterSpacing: "-0.02em", lineHeight: 1, color: INK }}>{s.v}{s.u ? <span style={{ fontSize: 15, color: "rgba(242,237,228,0.5)", marginLeft: 3 }}>{s.u}</span> : null}</div>
      <div style={{ marginTop: 8, fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "rgba(242,237,228,0.5)" }}>{s.sub}</div>
    </div>
  );
  return (
    <div>

      <Card style={{ padding: 28, border: `1px solid ${accent}44`, background: `linear-gradient(160deg, ${accent}1f, ${accent}07 55%, rgba(242,237,228,0.04) 92%)` }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16 }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.18em", textTransform: "uppercase", color: accent }}>Down so far</div>
            <div style={{ marginTop: 8, fontFamily: serif, fontSize: 64, fontWeight: 500, color: INK, letterSpacing: "-0.03em", lineHeight: 0.95 }}>{down > 0 ? "+" : "−"}{Math.abs(down)}<span style={{ fontSize: 26, color: "rgba(242,237,228,0.5)", marginLeft: 4 }}>{unit}</span></div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 14 }}>
            <button onClick={onEdit} style={{ background: "transparent", border: "1px solid rgba(242,237,228,0.25)", color: INK, padding: "8px 16px", borderRadius: 999, fontFamily: sans, fontSize: 12.5, cursor: "pointer" }}>Edit goal</button>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontFamily: serif, fontSize: 44, fontWeight: 500, color: accent, letterSpacing: "-0.02em", lineHeight: 1 }}>{Math.round(pct * 100)}%</div>
              <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", color: "rgba(242,237,228,0.5)", marginTop: 2 }}>There</div>
            </div>
          </div>
        </div>
        <div style={{ position: "relative", margin: "22px 0 16px", height: 8 }}>
          <div style={{ position: "absolute", inset: 0, borderRadius: 999, background: "rgba(242,237,228,0.1)" }} />
          <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${pct * 100}%`, borderRadius: 999, background: accent }} />
          <div style={{ position: "absolute", left: `calc(${pct * 100}% - 9px)`, top: -5, width: 18, height: 18, borderRadius: 999, background: "#fff", border: `3px solid ${accent}` }} />
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
          {[[start, "Start · " + (overall.startMonth || ""), "rgba(242,237,228,0.5)"], [now, "Now", accent], [target, "Target · " + (byLabel || ""), G_AMBER]].map(([v, lab, c], i) => (

function ClientGoalPage() {
  const [state, setState] = React.useState(DEFAULT_GOALS_STATE);
  const [signedIn, setSignedIn] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const [editGoalIdx, setEditGoalIdx] = React.useState(null);
  const [editCalc, setEditCalc] = React.useState(false);
  const [editMomentum, setEditMomentum] = React.useState(false);
  const [editOverall, setEditOverall] = React.useState(false);
  const [logWeigh, setLogWeigh] = React.useState(false);
  const [livePlans, setLivePlans] = React.useState(null);
  const [liveWeek, setLiveWeek] = React.useState(null);
  const [tab, setTab] = React.useState("overall"); // overall | training | nutrition

  React.useEffect(() => {
    (async () => {
      if (!window.shapeDb) return;
      const user = await window.shapeDb.getUser();
      if (!user) return;
      setSignedIn(true);
      try { if (user.user_metadata && user.user_metadata.full_name) window.__SHAPE_NAME__ = user.user_metadata.full_name; } catch (e) {}
      // client_goals is the canonical key (shared with mobile + read by the
      // get_client_goals RPC for coaches). Fall back to the legacy `client`
      // doc and migrate a legacy flat `goals` array into Training.
      let remote = null;
      try { remote = await window.shapeDb.getUserGoals("client_goals"); } catch (e) {}
      if (!remote || Object.keys(remote).length === 0) {
        try { remote = await window.shapeDb.getUserGoals("client"); } catch (e) {}
      }
      if (remote && Object.keys(remote).length > 0) {
        setState(s => {
          const legacy = Array.isArray(remote.goals) ? remote.goals : null;
          return {
            ...s, ...remote,
            share: remote.share !== false,
            overall: { ...s.overall, ...(remote.overall || {}) },
            trainingMeta: { ...s.trainingMeta, ...(remote.trainingMeta || {}) },
            nutritionMeta: { ...s.nutritionMeta, ...(remote.nutritionMeta || {}) },
            training: Array.isArray(remote.training) ? remote.training : (legacy || s.training),
            nutrition: Array.isArray(remote.nutrition) ? remote.nutrition : s.nutrition,
            calc: { ...s.calc, ...(remote.calc || {}) },
            momentum: Array.isArray(remote.momentum) ? remote.momentum : s.momentum,
          };
        });
      }
      // Live "Your plans" + "This week targets" for the Overall dashboard (cookie
      // auth → the same rollups mobile reads). Falls back to demo on any non-200.
      try {
        const j = async (p) => { const r = await fetch(p, { credentials: "same-origin", cache: "no-store" }); return r.ok ? r.json().catch(() => null) : null; };
        const [train, nutr, prog, plan] = await Promise.all([
          j("/api/client/train"), j("/api/client/nutrition"), j("/api/client/progress"), j("/api/client/plan"),
        ]);
        const sessTarget = (plan && plan.training && Array.isArray(plan.training.workouts) && plan.training.workouts.length) || 4;
        const kcal = (nutr && nutr.today && nutr.today.calorieTarget) || null;
        const mealTitle = (plan && plan.meals && plan.meals.title) || null;
        if (train || nutr || prog || plan) {
          setLivePlans([
            { role: "Training", t: "Training block", sub: `${sessTarget}×/wk${plan && plan.training && plan.training.hasPlan ? " · assigned" : ""}` },
            { role: "Nutrition", t: mealTitle || "Nutrition plan", sub: kcal ? `${Math.round(kcal).toLocaleString()} kcal` : "macro targets" },
          ]);
          const thisWk = (train && train.stats && Number(train.stats.thisWeekCount)) || 0;
          const adher = (nutr && Number(nutr.adherentDays7)) || 0;
          const sleep = (prog && prog.kpis && Number(prog.kpis.sleepAvg)) || 0;
          const vol7 = (train && train.stats && Number(train.stats.volume7dLb)) || 0;
          setLiveWeek([
            { l: "Sessions", v: `${thisWk}/${sessTarget}`, sub: thisWk >= sessTarget ? "done" : `${Math.max(0, sessTarget - thisWk)} to go` },
            { l: "Protein days", v: `${adher}/7`, sub: "on target" },
            { l: "Sleep", v: sleep ? `${sleep}h` : "—", sub: "avg · goal 7h" },
            { l: "7d volume", v: vol7 ? `${Math.round(vol7 / 1000)}k` : "—", sub: "load lifted" },
          ]);
        }
      } catch (e) {}
    })();
  }, []);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(null), 2500); }

  async function persist(next) {
    setState(next);
    if (window.shapeDb && window.shapeDb.saveUserGoals) {
      const res = await window.shapeDb.saveUserGoals("client_goals", next);
      showToast(res && res.error ? (res.error.message || "Save failed") : (signedIn ? "Saved." : "Sample view — sign in to save."));
    } else {
      showToast("Sample view — sign in to save.");
    }
  }

  function saveGoal(g) {
    const goals = [...(state[tab] || [])];
    if (editGoalIdx === "new") goals.push(g);
    else goals[editGoalIdx] = g;
    setEditGoalIdx(null);
    persist({ ...state, [tab]: goals });
  }
  function deleteGoal() {
    const goals = (state[tab] || []).filter((_, i) => i !== editGoalIdx);
    setEditGoalIdx(null);
    persist({ ...state, [tab]: goals });
  }
  function logWeighIn(kg) {
    const today = new Date().toISOString().slice(0, 10);
    const prev = goalWeighIns(state.overall);
    const wi = (prev.length && prev[prev.length - 1].d === today) ? [...prev.slice(0, -1), { d: today, kg }] : [...prev, { d: today, kg }];
    setLogWeigh(false);
    persist({ ...state, overall: { ...state.overall, weighIns: wi, now: kg } });
    if (signedIn && window.ShapeWeighIns && window.ShapeWeighIns.log) {
      try { window.ShapeWeighIns.log({ weight: kg, unit: state.overall.unit || "kg" }); } catch (e) {}
    }
  }

  const { calc, momentum, overall } = state;
  const accent = TAB_ACCENT[tab];
  const goals = state[tab] || [];
  const { workouts, sessions, proteinDays, sleepNights, programsOwned = 0, mealPlansOwned = 0, currentWeekly } = calc;
  // Shape Score points per action (matches score.jsx tuned rates)
  const PTS = { workout: 8, session: 15, protein: 5, sleep: 3, review: 15, programBoost: 6, mealPlanBoost: 4 };
  const weekly = workouts*PTS.workout + sessions*PTS.session + proteinDays*PTS.protein + sleepNights*PTS.sleep + PTS.review + programsOwned*PTS.programBoost + mealPlansOwned*PTS.mealPlanBoost;
  const monthly = weekly * 4.33;
  const quarterly = monthly * 3;
  const annual = monthly * 12;
  const fmt = n => Math.round(n).toLocaleString();
  const paceDelta = weekly - currentWeekly;

  const meta = tab === "training" ? state.trainingMeta : tab === "nutrition" ? state.nutritionMeta : null;
  const headTitle = tab === "overall" ? "Your goal" : (meta && meta.title) || "Goal";
  const byD = overall.by ? new Date(overall.by) : null;
  const byLabel = byD && !isNaN(byD) ? byD.toLocaleDateString([], { month: "short", day: "numeric" }).toUpperCase() : "";
  const eyebrow = tab === "overall"
    ? `YOUR GOAL${byLabel ? ` · BY ${byLabel}` : ""}`
    : (tab === "training" ? "TRAINING GOAL" : "NUTRITION GOAL");

  return (
    <DashPage
      navItems={clientNavItems("goal")}
      payoutCard={clientPayoutCard}
      eyebrow={eyebrow}
      title={headTitle}
      subtitle={meta && meta.subtitle ? meta.subtitle : (signedIn ? "What you're shaping toward — body comp, strength, sleep, calm, confidence, or just feeling like yourself again." : "Sample view — sign in to save your own goals.")}
      actions={tab === "overall" ? (
        <button onClick={() => setLogWeigh(true)} style={{ background: INK, color: PAPER, border: 0, padding: "10px 22px", borderRadius: 999, fontFamily: sans, fontSize: 13, fontWeight: 500, cursor: "pointer" }}>+ Log weigh-in</button>
      ) : (<>
        <button onClick={() => persist({ ...state, [tab]: [] })} style={{ background: "transparent", color: INK, border: "1px solid rgba(242,237,228,0.25)", padding: "10px 20px", borderRadius: 999, fontFamily: sans, fontSize: 13, cursor: "pointer" }}>Archive</button>
        <button onClick={() => setEditGoalIdx("new")} style={{ background: INK, color: PAPER, border: 0, padding: "10px 22px", borderRadius: 999, fontFamily: sans, fontSize: 13, fontWeight: 500, cursor: "pointer" }}>+ New goal</button>
      </>)}
    >
      {/* Overall / Training / Nutrition tabs */}
      <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
        {[["overall", "Overall"], ["training", "Training"], ["nutrition", "Nutrition"]].map(([k, l]) => {
          const on = tab === k;
          const ac = TAB_ACCENT[k];
          const count = k === "overall" ? null : (state[k] || []).length;
          return (
            <button key={k} onClick={() => setTab(k)}
              style={{ padding: "9px 20px", borderRadius: 999, cursor: "pointer", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase",
                border: on ? `1px solid ${ac}66` : "1px solid rgba(242,237,228,0.16)",
                background: on ? `${ac}22` : "transparent", color: on ? ac : "rgba(242,237,228,0.62)" }}>
              {l}{count != null && <span style={{ opacity: 0.6 }}> · {count}</span>}
            </button>
          );
        })}
      </div>

      {/* Share with assigned coaches */}
      <Card style={{ marginBottom: 16, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16, padding: 20 }}>
        <div>
          <div style={{ fontFamily: serif, fontSize: 19, letterSpacing: "-0.015em", marginBottom: 4 }}>Share with your coaches</div>
          <div style={{ fontSize: 12.5, color: "rgba(242,237,228,0.6)" }}>{state.share ? "Your assigned coaches can see these goals and tailor your plan around them." : "Private — your coaches can’t see these goals."}</div>
        </div>
        <button onClick={() => persist({ ...state, share: !state.share })} aria-label="Toggle coach visibility"
          style={{ flexShrink: 0, width: 52, height: 30, borderRadius: 999, border: 0, cursor: "pointer", padding: 3, background: state.share ? TEAL : "rgba(242,237,228,0.18)", display: "flex", justifyContent: state.share ? "flex-end" : "flex-start", alignItems: "center", transition: "all .15s" }}>
          <span style={{ width: 24, height: 24, borderRadius: 999, background: "#fff", display: "block" }} />
        </button>
      </Card>

      {tab === "overall" ? (
        <OverallDashboard overall={overall} accent={accent} plans={livePlans} weekTargets={liveWeek}
          onEdit={() => setEditOverall(true)} onLog={() => setLogWeigh(true)} />
      ) : (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            {goals.map((g, i) => {
              const pct = Math.min((Number(g.cur)||0) / (Number(g.tgt)||1), 1);
              const curF = g.pct ? `${g.cur}%` : Number(g.cur).toLocaleString();
              const tgtF = g.pct ? `${g.tgt}%` : Number(g.tgt).toLocaleString();
              return (
                <Card key={i} style={{ padding: 26, position: "relative" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                    <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.14em", color: accent }}>GOAL · {Math.round(pct*100)}%</div>
                    <Chip onClick={() => setEditGoalIdx(i)}>EDIT</Chip>
                  </div>
                  <div style={{ fontFamily: serif, fontSize: 26, letterSpacing: "-0.015em", marginBottom: 16 }}>{g.t}</div>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "rgba(242,237,228,0.55)", fontFamily: "'JetBrains Mono', monospace", marginBottom: 6 }}>
                    <span>{curF}</span><span>{tgtF}</span>
                  </div>
                  <div style={{ height: 8, background: "rgba(242,237,228,0.08)", borderRadius: 999, overflow: "hidden", marginBottom: 14 }}>
                    <div style={{ height: "100%", width: `${pct*100}%`, background: accent }} />
                  </div>
                  <div style={{ fontSize: 12.5, color: "rgba(242,237,228,0.6)", lineHeight: 1.5 }}>{g.sub}</div>
                  {g.date && (() => {
                    const d = daysUntil(g.date);
                    if (d === null) return null;
                    return (
                      <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px solid rgba(242,237,228,0.08)", display: "flex", justifyContent: "space-between", fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.1em", color: "rgba(242,237,228,0.55)" }}>
                        <span>TARGET · {new Date(g.date).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }).toUpperCase()}</span>
                        <span style={{ color: d < 14 ? "#ff8a6d" : accent }}>{d} DAYS LEFT</span>
                      </div>
                    );
                  })()}
                </Card>
              );
            })}
          </div>

          <Card style={{ marginTop: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <SectionTitle right="SET YOUR PACE">Score calculator</SectionTitle>
              <Chip onClick={() => setEditCalc(true)}>EDIT</Chip>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1.6fr", gap: 32, padding: "8px 4px 4px" }}>
              <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
                {[
                  ["Workouts / week", "workouts", workouts, 0, 10, 1, v => `${v}`],
                  ["Sessions with coach / week", "sessions", sessions, 0, 7, 1, v => `${v}`],
                  ["Protein target days / week", "proteinDays", proteinDays, 0, 7, 1, v => `${v}`],
                  ["Sleep ≥ 7h / week", "sleepNights", sleepNights, 0, 7, 1, v => `${v}`],
                  ["Programs purchased (active)", "programsOwned", programsOwned, 0, 10, 1, v => `${v}`],
                  ["Meal plans purchased (active)", "mealPlansOwned", mealPlansOwned, 0, 10, 1, v => `${v}`],
                ].map(([label, key, val, min, max, step, fmtV]) => (
                  <div key={key}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                      <span style={{ fontSize: 12.5, color: "rgba(242,237,228,0.7)" }}>{label}</span>
                      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5, color: INK }}>{fmtV(val)}</span>
                    </div>
                    <input type="range" min={min} max={max} step={step} value={val}
                      onChange={e => setState({ ...state, calc: { ...calc, [key]: +e.target.value } })}
                      onMouseUp={e => persist({ ...state, calc: { ...calc, [key]: +e.target.value } })}
                      onTouchEnd={e => persist({ ...state, calc: { ...calc, [key]: +e.target.value } })}
                      style={{ width: "100%", accentColor: "#0ac5a8", cursor: "pointer" }} />
                  </div>
                ))}
                <div style={{ fontSize: 11.5, color: "rgba(242,237,228,0.5)", lineHeight: 1.5, marginTop: 4 }}>
                  Projected points based on your weekly activity. Each purchased program (+{PTS.programBoost}/wk) and meal plan (+{PTS.mealPlanBoost}/wk) unlocks bonus logging streams. Weekly review auto-adds {PTS.review} when submitted.
                </div>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, alignSelf: "start" }}>
                {[
                  ["WEEKLY POINTS", fmt(weekly), `vs ${fmt(currentWeekly)} current pace`, paceDelta],
                  ["MONTHLY POINTS", fmt(monthly), "4.33 weeks avg", null],
                  ["QUARTERLY POINTS", fmt(quarterly), "3 months at this pace", null],
                  ["ANNUAL POINTS", fmt(annual), "12 months at this pace", null],
                ].map(([lab, val, sub, delta], i) => (
                  <div key={i} style={{ padding: 20, background: i === 0 ? "rgba(10,197,168,0.1)" : "rgba(242,237,228,0.04)", border: `1px solid ${i === 0 ? "rgba(10,197,168,0.25)" : "rgba(242,237,228,0.08)"}`, borderRadius: 10 }}>
                    <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.14em", color: i === 0 ? TEAL_BRIGHT : "rgba(242,237,228,0.55)", marginBottom: 10 }}>{lab}</div>
                    <div style={{ fontFamily: serif, fontSize: 32, letterSpacing: "-0.02em", lineHeight: 1 }}>{val}</div>
                    <div style={{ fontSize: 11, color: "rgba(242,237,228,0.55)", marginTop: 6 }}>
                      {delta != null ? (
                        <span style={{ color: delta >= 0 ? TEAL_BRIGHT : "#ff8a6d" }}>{delta >= 0 ? "+" : ""}{fmt(delta)} </span>
                      ) : null}
                      {sub}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </Card>

          <Card style={{ marginTop: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <SectionTitle right="THIS QUARTER">Momentum</SectionTitle>
              <Chip onClick={() => setEditMomentum(true)}>EDIT</Chip>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 20, padding: "12px 4px" }}>
              {momentum.map((m,i)=>(
                <div key={i}>
                  <div style={{ fontFamily: serif, fontSize: 36, letterSpacing: "-0.02em", lineHeight: 1 }}>{m[0]}</div>
                  <div style={{ fontSize: 12.5, marginTop: 8 }}>{m[1]}</div>
                  <div style={{ fontSize: 11, color: "rgba(242,237,228,0.5)", marginTop: 2 }}>{m[2]}</div>
                </div>
              ))}
            </div>
          </Card>
        </>
      )}

      {editGoalIdx != null && (
        <GoalEditModal
          goal={editGoalIdx === "new" ? null : goals[editGoalIdx]}
          onClose={() => setEditGoalIdx(null)}
          onSave={saveGoal}
          onDelete={editGoalIdx === "new" ? null : deleteGoal}
        />
      )}
      {editOverall && (
        <OverallEditModal
          overall={overall}
          onClose={() => setEditOverall(false)}
          onSave={o => { setEditOverall(false); persist({ ...state, overall: { ...overall, ...o } }); }}
        />
      )}
      {logWeigh && (
        <WeighInModal
          unit={overall.unit}
          current={goalNow(overall)}
          onClose={() => setLogWeigh(false)}
          onSave={logWeighIn}
        />
      )}
      {editCalc && (
        <CalcEditModal
          calc={calc}
          labels={[["workouts","Workouts / week"],["sessions","Sessions with coach / week"],["proteinDays","Protein target days / week"],["sleepNights","Sleep ≥7h nights / week"],["programsOwned","Programs purchased (active)"],["mealPlansOwned","Meal plans purchased (active)"],["currentWeekly","Current weekly points"]]}
          onClose={() => setEditCalc(false)}
          onSave={c => { setEditCalc(false); persist({ ...state, calc: c }); }}
        />
      )}
      {editMomentum && (
        <MomentumEditModal
          momentum={momentum}
          onClose={() => setEditMomentum(false)}
          onSave={m => { setEditMomentum(false); persist({ ...state, momentum: m }); }}
        />
      )}
      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: INK, color: PAPER, padding: "12px 22px", borderRadius: 999, fontFamily: sans, fontSize: 13, fontWeight: 500, zIndex: 10000, boxShadow: "0 10px 40px rgba(0,0,0,0.5)" }}>{toast}</div>
      )}
    </DashPage>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(
  <React.Fragment>
    <ClientGoalPage />
    <ChatWidget tabs={clientChatTabs} />
  </React.Fragment>
);
</script>
<script src="globalChatButton.js?v=20260609" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profile · Shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#100d0a;color:#f2ede4;-webkit-font-smoothing:antialiased}
  ::selection{background:#1ec0a8;color:#06110e}
  a{color:inherit}
  @keyframes tdTide { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  .td-tide{ animation: tdTide 6s ease-in-out infinite }
  @keyframes lvPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.35;transform:scale(0.7)} }
  .lv-pulse{ animation: lvPulse 1.6s ease-in-out infinite }
  .lv-tabrow::-webkit-scrollbar{height:0;display:none}
  @media (max-width: 1000px){
    .dk-hero{ grid-template-columns: 1fr !important; }
    .dk-grid{ grid-template-columns: 1fr !important; }
    .dk-rail{ position: static !important; }
  }
  @media (max-width: 720px){
    .dk-3up{ grid-template-columns: 1fr !important; }
    .dk-feed{ grid-template-columns: 1fr !important; }
  }
  @media (prefers-reduced-motion: reduce){ .td-tide,.lv-pulse{ animation: none !important } }
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script type="text/babel" data-presets="react" src="pageShell.jsx"></script>
<script type="text/babel" data-presets="react" src="chatWidget.jsx"></script>
<script type="text/babel" data-presets="react" src="clientChatThreads.jsx"></script>
<script type="text/babel" data-presets="react" src="livingShared.jsx"></script>
<script type="text/babel" data-presets="react" src="livingTerrain.jsx"></script>
<script type="text/babel" data-presets="react" src="livingSignal.jsx"></script>
<script type="text/babel" data-presets="react" src="livingDesktop.jsx"></script>
<script type="text/babel" data-presets="react">
// Live wiring — the desktop Terrain (member) / Signal (coach) profile, fed by
// get_public_profile + the follow graph. Rich sub-data stays illustrative
// (same as mobile); name / tier / score / avatar / goal / privacy are live.
function liveTier(points, coach) {
  const member = [[0, "Base", "#8a93a0", "I"], [750, "Tempo", "#d8a23a", "II"], [2000, "Form", "#1ec0a8", "III"], [5000, "Peak", "#8a5cf6", "IV"], [15000, "Legend", "#e0518a", "V"]];
  const coachL = [[0, "Certified", "#8a93a0", "I"], [750, "Pro", "#d8a23a", "II"], [2000, "Elite", "#e0463c", "III"], [5000, "Master", "#8fe3e6", "IV"], [15000, "Icon", "#34d6c5", "V"]];
  const T = coach ? coachL : member;
  let t = T[0]; for (const x of T) if (points >= x[0]) t = x;
  return { name: t[1], color: t[2], rank: t[3] };
}

function LiveProfilePage() {
  const [st, setSt] = React.useState({ loading: true, status: "", row: null, isSelf: false, uid: null });
  const [follow, setFollow] = React.useState({ followers: 0, following: 0, isFollowing: false });
  const [busy, setBusy] = React.useState(false);
  const [sheet, setSheet] = React.useState(null);
  const [list, setList] = React.useState(null);

  const cl = () => (window.shapeDb && window.shapeDb.client) || null;
  React.useEffect(() => {
    let on = true;
    (async () => {
      const c = cl();
      if (!c || !c.rpc) { if (on) setSt({ loading: false, status: "unavailable" }); return; }
      const qid = new URLSearchParams(window.location.search).get("u");
      let me = null; try { const r = await c.auth.getUser(); me = r && r.data ? r.data.user : null; } catch (e) {}
      const uid = qid || (me && me.id);
      if (!uid) { if (on) setSt({ loading: false, status: "signin" }); return; }
      let row = null; try { const res = await c.rpc("get_public_profile", { p_user_id: uid }); row = Array.isArray(res && res.data) ? res.data[0] : (res && res.data); } catch (e) {}
      if (!on) return;
      setSt({ loading: false, status: row ? "ok" : "notfound", row: row || null, isSelf: !!(me && me.id === uid), uid });
      c.rpc("get_follow_stats", { p_user_id: uid }).then((r) => { if (!on || !r || r.error) return; const d = Array.isArray(r.data) ? r.data[0] : r.data; if (d) setFollow((f) => ({ ...f, followers: +d.followers || 0, following: +d.following || 0, isFollowing: !!d.is_following })); }).catch(() => {});
    })();
    return () => { on = false; };
  }, []);

  const onMessage = () => {
    if (st.isSelf) { window.location.href = "/newdesign/ClientMe.html"; return; }
    const nm = st.row && st.row.full_name;
    try { if (window.__openChat) { window.__openChat({ who: nm }); return; } } catch (e) {}
    const b = document.getElementById("shape-global-chat-button"); if (b) { b.click(); return; }
    window.location.href = "/newdesign/ClientCommunity.html";
  };
  const onFollow = async () => {
    const c = cl(); if (!c || busy || !st.uid) return;
    setBusy(true); const prev = follow;
    setFollow((x) => ({ ...x, isFollowing: !x.isFollowing, followers: Math.max(0, x.followers + (x.isFollowing ? -1 : 1)) }));
    try { const r = await c.rpc("toggle_follow", { p_user_id: st.uid }); if (r && r.error) throw r.error; const d = Array.isArray(r.data) ? r.data[0] : r.data; if (d) setFollow({ followers: +d.followers || 0, following: +d.following || 0, isFollowing: !!d.is_following }); }
    catch (e) { setFollow(prev); alert((e && e.message) || "Sign in to follow."); }
    finally { setBusy(false); }
  };
  const openList = (kind) => {
    const c = cl(); setSheet(kind); setList(null);
    if (!c || !c.rpc || !st.uid) { setList([]); return; }
    c.rpc("get_follow_list", { p_user_id: st.uid, p_kind: kind }).then((r) => { const rows = (r && !r.error && Array.isArray(r.data)) ? r.data : []; setList(rows.map((x) => ({ userId: x.user_id, name: x.full_name || "Shape member", role: x.role || "client" }))); }).catch(() => setList([]));
  };

  const center = (msg, cta) => (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 18, padding: 40, textAlign: "center", fontFamily: "'Space Grotesk', sans-serif" }}>
      <div style={{ fontFamily: "Fraunces, serif", fontSize: 30 }}>Profile</div>
      <div style={{ color: "rgba(242,237,228,0.6)", fontSize: 15 }}>{msg}</div>
      {cta}
    </div>
  );
  if (st.loading) return center("Loading profile…");
  if (st.status === "signin") return center("Sign in to view your public profile.", <a href="/login" style={{ background: "#1ec0a8", color: "#06110e", borderRadius: 999, padding: "12px 24px", fontFamily: "'Space Grotesk',sans-serif", fontWeight: 600, fontSize: 14 }}>Sign in →</a>);
  if (st.status !== "ok") return center(st.status === "notfound" ? "This profile isn't available." : "Profiles aren't available right now.");

  const row = st.row;
  const role = row.role === "trainer" ? "trainer" : row.role === "nutritionist" ? "nutritionist" : "client";
  const coach = role !== "client";
  const direction = coach ? "signal" : "terrain";
  const points = Number.isFinite(row.points) ? row.points : 0;
  const tk = liveTier(points, coach);
  LV_TIERS.__live = { name: tk.name, color: tk.color, rank: tk.rank };
  const name = row.full_name || "Shape member";
  const first = String(name).trim().split(/\s+/)[0] || "Member";
  const initials = String(name).trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase() || "?";
  const isPrivate = row.is_public === false || row.can_view === false;
  const base = LV_PEOPLE[role] || LV_PEOPLE.client;
  const person = Object.assign({}, base, {
    name, first, initials, tier: "__live", score: points,
    roleLabel: coach ? (role === "nutritionist" ? "Nutritionist" : "Trainer") : "Member",
    role,
    handle: row.handle || ("@" + first.toLowerCase().replace(/[^a-z0-9]/g, "")),
    pronouns: (!isPrivate && row.pronouns) || base.pronouns,
    goal: (!isPrivate && row.goal) || base.goal,
    portrait: row.avatar || "",
    link: (!isPrivate && row.link) ? ["Link", String(row.link).replace(/^https?:\/\//, "")] : base.link,
  });
  const variant = (isPrivate && !st.isSelf) ? "locked" : (st.isSelf ? "own" : "public");
  const followProps = Object.assign({}, follow, { openList });

  return (
    <React.Fragment>
      <DesktopProfile direction={direction} persona={role} person={person} variant={variant} onMessage={onMessage} onFollow={onFollow} follow={followProps} coachingHref="/Marketplace.html" />
      {sheet && (
        <div onClick={() => setSheet(null)} style={{ position: "fixed", inset: 0, zIndex: 240, background: "rgba(10,10,8,0.78)", backdropFilter: "blur(8px)", WebkitBackdropFilter: "blur(8px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ width: "min(440px,100%)", maxHeight: "76vh", overflowY: "auto", background: "#1b1714", color: "#f2ede4", border: "1px solid rgba(242,237,228,0.12)", borderRadius: 16, padding: 22, fontFamily: "'Space Grotesk',sans-serif" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 11, fontWeight: 700, letterSpacing: "0.16em", textTransform: "uppercase", color: "#2ee0c4" }}>{sheet === "following" ? "Following" : "Followers"}</span>
              <button onClick={() => setSheet(null)} aria-label="Close" style={{ background: "transparent", border: 0, color: "rgba(242,237,228,0.6)", fontSize: 22, cursor: "pointer", lineHeight: 1 }}>×</button>
            </div>
            {list == null ? <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: "rgba(242,237,228,0.5)", padding: "8px 0" }}>Loading…</div>
            : list.length === 0 ? <div style={{ fontFamily: "Fraunces,serif", fontSize: 16, fontStyle: "italic", color: "rgba(242,237,228,0.6)", padding: "8px 0 14px" }}>{sheet === "following" ? "Not following anyone yet." : "No followers yet."}</div>
            : list.map((u, i) => (
              <a key={u.userId || i} href={u.userId ? `MemberProfile.html?u=${u.userId}` : undefined} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderTop: i ? "1px solid rgba(242,237,228,0.08)" : "none", textDecoration: "none", color: "#f2ede4" }}>
                <span style={{ width: 36, height: 36, flex: "none", borderRadius: 999, background: "#3a322a", display: "grid", placeItems: "center", fontFamily: "Fraunces,serif", fontSize: 14 }}>{String(u.name).trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase()}</span>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 14, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{u.name}</div>
                  <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9.5, letterSpacing: "0.1em", textTransform: "uppercase", color: "rgba(242,237,228,0.45)", marginTop: 2 }}>{u.role === "trainer" ? "Trainer" : u.role === "nutritionist" ? "Nutritionist" : "Member"}</div>
                </div>
              </a>
            ))}
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <React.Fragment>
    <LiveProfilePage />
    <ChatWidget tabs={clientChatTabs} />
  </React.Fragment>
);
</script>
<script src="globalChatButton.js" defer></script>
</body>
</html>

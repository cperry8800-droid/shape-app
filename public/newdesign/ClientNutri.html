<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Nutri · Shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#1a1612}*{box-sizing:border-box}a{text-decoration:none;color:inherit}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="pageShell.jsx"></script>
<script type="text/babel" src="chatWidget.jsx"></script>
<script type="text/babel" src="clientChatThreads.jsx"></script>
<script type="text/babel" src="trainerDashboard.jsx"></script>
<script type="text/babel" src="clientNav.jsx"></script>
<script type="text/babel">
function nutriNum(v, suffix) {
  if (v == null) return "—";
  return Math.round(v) + (suffix || "");
}
function dayLabel(iso) {
  if (!iso) return "";
  try { return new Date(iso).toLocaleDateString([], { weekday: "short" }).charAt(0); }
  catch (e) { return ""; }
}

// Mock data — shown while the API loads, or when the viewer is signed out.
const MMIN_DAY = (n) => new Date(Date.now() - n * 86400000).toISOString().slice(0, 10);
const MOCK_NUTRI = {
  today: { date: MMIN_DAY(0), calories: 1530, protein: 112, carbs: 158, fat: 42, hydration: 1.8 },
  week: [
    { date: MMIN_DAY(6), calories: 2210, logged: true },
    { date: MMIN_DAY(5), calories: 2340, logged: true },
    { date: MMIN_DAY(4), calories: 1980, logged: true },
    { date: MMIN_DAY(3), calories: 2410, logged: true },
    { date: MMIN_DAY(2), calories: null, logged: false },
    { date: MMIN_DAY(1), calories: 2280, logged: true },
    { date: MMIN_DAY(0), calories: 1530, logged: true },
  ],
  loggedDays7: 6,
};

function ClientNutriPage() {
  const [data, setData] = React.useState(MOCK_NUTRI);
  const [live, setLive] = React.useState(false);

  React.useEffect(() => {
    let cancelled = false;
    fetch('/api/client/nutrition', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (!cancelled && d && d.ok) { setData(d); setLive(true); } })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const today = data.today;
  const week = data.week || [];
  const maxCal = Math.max(1, ...week.map(d => d.calories || 0));

  const macros = today ? [
    { l: "Protein", v: nutriNum(today.protein, "g"), color: "#1ec0a8" },
    { l: "Carbs", v: nutriNum(today.carbs, "g"), color: "#f4b860" },
    { l: "Fat", v: nutriNum(today.fat, "g"), color: "#e07856" },
    { l: "Water", v: today.hydration != null ? today.hydration + " L" : "—", color: "#6a8cff" },
  ] : [];

  return (
    <DashPage
      navItems={clientNavItems("nutri")}
      payoutCard={clientPayoutCard}
      eyebrow="LOGGED NUTRITION"
      title="Nutrition"
      subtitle="What you've logged — today's macros and the last 7 days. Rolls up from your daily logs and connected apps."
    >
      <div style={{ display: "grid", gridTemplateColumns: "1.1fr 1.9fr", gap: 20 }}>
        <Card>
          <SectionTitle right="TODAY">Macros</SectionTitle>
          {!today && (
            <div style={{ padding: "26px 4px", color: "rgba(242,237,228,0.5)", fontSize: 13 }}>
              No nutrition logged yet. Log a day to see your macros here.
            </div>
          )}
          {today && (
            <>
              <div style={{ fontFamily: serif, fontSize: 46, letterSpacing: "-0.02em", lineHeight: 1, marginTop: 4 }}>
                {today.calories != null ? today.calories.toLocaleString() : "—"}
              </div>
              <div style={{ fontSize: 12.5, color: "rgba(242,237,228,0.55)", marginTop: 6 }}>calories logged today</div>
              <div style={{ marginTop: 18, borderTop: "1px solid rgba(242,237,228,0.08)", paddingTop: 8 }}>
                {macros.map((m, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.06)" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
                      <span style={{ width: 8, height: 8, borderRadius: 999, background: m.color }} />
                      <span style={{ fontSize: 13 }}>{m.l}</span>
                    </div>
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }}>{m.v}</span>
                  </div>
                ))}
              </div>
            </>
          )}
        </Card>

        <Card>
          <SectionTitle right={`${data.loggedDays7 || 0} OF 7 DAYS LOGGED`}>Last 7 days</SectionTitle>
          <div style={{ display: "flex", gap: 8, alignItems: "flex-end", height: 150, marginTop: 8 }}>
            {week.map((d, i) => {
              const h = d.calories ? Math.max(6, (d.calories / maxCal) * 100) : 4;
              return (
                <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 8, height: "100%", justifyContent: "flex-end" }}>
                  <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: "rgba(242,237,228,0.5)" }}>{d.calories ? Math.round(d.calories) : ""}</div>
                  <div style={{ width: "100%", background: d.logged ? TEAL : "rgba(242,237,228,0.12)", height: `${h}%`, borderRadius: 3, minHeight: 4 }} />
                  <div style={{ fontSize: 10, fontFamily: "'JetBrains Mono', monospace", color: "rgba(242,237,228,0.5)" }}>{dayLabel(d.date)}</div>
                </div>
              );
            })}
          </div>
          <div style={{ fontSize: 12, color: "rgba(242,237,228,0.55)", marginTop: 16 }}>
            {live ? "Calories logged per day. Bars in grey are days with no log." : "Sample data — sign in to see your own logs."}
          </div>
        </Card>
      </div>
    </DashPage>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(
  <React.Fragment>
    <ClientNutriPage />
    <ChatWidget tabs={clientChatTabs} />
  </React.Fragment>
);
</script>
<script src="globalChatButton.js" defer></script>
</body>
</html>

<script type="text/babel">
function nutriNum(v, suffix) {
  if (v == null) return "—";
  return Math.round(v) + (suffix || "");
}
function dayLabel(iso) {
  if (!iso) return "";
  try { return new Date(iso).toLocaleDateString([], { weekday: "short" }).charAt(0); }
  catch (e) { return ""; }
}
function dateLong(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }); }
  catch (e) { return "—"; }
}

const NMIN_DAY = (n) => new Date(Date.now() - n * 86400000).toISOString().slice(0, 10);
const NFWD_DAY = (n) => new Date(Date.now() + n * 86400000).toISOString().slice(0, 10);

// Mock data — shown while the API loads, or when the viewer is signed out.
const MOCK_NUTRI = {
  today: { date: NMIN_DAY(0), calories: 1530, protein: 112, carbs: 158, fat: 42, hydration: 1.8 },
  targets: { calories: 2200, protein: 175, carbs: 240, fat: 70, hydration: 3.0 },
  week: [
    { date: NMIN_DAY(6), calories: 2210, protein: 168, carbs: 230, fat: 65, logged: true, adherent: true },
    { date: NMIN_DAY(5), calories: 2340, protein: 182, carbs: 245, fat: 72, logged: true, adherent: true },
    { date: NMIN_DAY(4), calories: 1980, protein: 145, carbs: 210, fat: 58, logged: true, adherent: false },
    { date: NMIN_DAY(3), calories: 2410, protein: 188, carbs: 260, fat: 74, logged: true, adherent: true },
    { date: NMIN_DAY(2), calories: null, protein: null, carbs: null, fat: null, logged: false, adherent: false },
    { date: NMIN_DAY(1), calories: 2280, protein: 172, carbs: 238, fat: 68, logged: true, adherent: true },
    { date: NMIN_DAY(0), calories: 1530, protein: 112, carbs: 158, fat: 42, logged: true, adherent: false },
  ],
  loggedDays7: 6,
  adherentDays7: 4,
  currentStreak: 4,
  longestStreak: 11,
  todayMeals: [
    { time: "07:30", name: "Greek yogurt + berries + granola", kcal: 420, protein: 28, carbs: 52, fat: 12, logged: true },
    { time: "12:30", name: "Grilled chicken bowl", kcal: 620, protein: 52, carbs: 68, fat: 18, logged: true },
    { time: "15:30", name: "Protein shake + banana", kcal: 290, protein: 28, carbs: 38, fat: 4, logged: true },
    { time: "19:00", name: "Salmon + rice + asparagus", kcal: 720, protein: 48, carbs: 72, fat: 28, planned: true },
  ],
  upcomingMeals: [
    { date: NFWD_DAY(0), time: "19:00", name: "Salmon + rice + asparagus", kcal: 720, source: "Rae's plan" },
    { date: NFWD_DAY(1), time: "07:30", name: "Overnight oats + whey", kcal: 480, source: "Rae's plan" },
    { date: NFWD_DAY(1), time: "12:30", name: "Turkey wrap + side salad", kcal: 540, source: "Rae's plan" },
    { date: NFWD_DAY(1), time: "19:00", name: "Lean steak + sweet potato", kcal: 680, source: "Rae's plan" },
    { date: NFWD_DAY(2), time: "07:30", name: "Egg scramble + toast", kcal: 510, source: "Rae's plan" },
    { date: NFWD_DAY(2), time: "12:30", name: "Chicken caesar (lite)", kcal: 490, source: "Rae's plan" },
  ],
  topFoods: [
    { name: "Greek yogurt", count: 6, avgKcal: 180 },
    { name: "Chicken breast", count: 5, avgKcal: 260 },
    { name: "Brown rice", count: 5, avgKcal: 220 },
    { name: "Protein shake", count: 5, avgKcal: 150 },
    { name: "Eggs (2)", count: 4, avgKcal: 160 },
    { name: "Avocado (½)", count: 4, avgKcal: 120 },
  ],
  grocery: [
    { item: "Chicken breast (3 lb)",     status: "pending" },
    { item: "Greek yogurt (32 oz)",       status: "pending" },
    { item: "Sweet potatoes (5)",         status: "pending" },
    { item: "Whey protein",               status: "pending" },
    { item: "Salmon fillets (2)",         status: "pending" },
    { item: "Frozen mixed berries",       status: "have" },
    { item: "Almond milk",                status: "have" },
  ],
  hydration7d: [1.4, 2.6, 2.2, 3.1, 0, 2.8, 1.8],
  coachNotes: {
    plan: "Week 3 · Lean recomp",
    dish: "Tonight: Sheet-pan salmon + sweet potato + asparagus",
    text: "We're holding 2,200 kcal and pushing protein to 175g this week. Tonight's salmon hits 48g protein and front-loads your weekend carbs — eat it within 2 hours of training.",
    coach: "Rae · Nutritionist",
    at: "yesterday",
  },
};

// Coach-approved meal substitutions — same macro neighbourhood as a planned meal.
const MEAL_SWAPS = [
  { name: "Turkey & rice bowl", kcal: 610, protein: 48, carbs: 66, fat: 14 },
  { name: "Cod, potato, greens", kcal: 560, protein: 46, carbs: 52, fat: 16 },
  { name: "Tofu stir-fry + rice", kcal: 580, protein: 34, carbs: 72, fat: 16 },
  { name: "Chicken wrap + side salad", kcal: 600, protein: 44, carbs: 58, fat: 18 },
  { name: "Lean steak + sweet potato", kcal: 640, protein: 50, carbs: 54, fat: 20 },
];

function ClientNutriPage() {
  const [data, setData] = React.useState(MOCK_NUTRI);
  const [mealOverrides, setMealOverrides] = React.useState({});
  const [swapMealIdx, setSwapMealIdx] = React.useState(null);
  React.useEffect(() => {
    if (!(window.shapeDb && window.shapeDb.getUserGoals)) return;
    window.shapeDb.getUserGoals("client_meal_swaps").then(s => { if (s && typeof s === "object") setMealOverrides(s); }).catch(() => {});
  }, []);
  const applyMealSwap = (idx, alt, baseName) => {
    const next = { ...mealOverrides };
    if (!alt) delete next[baseName];
    else next[baseName] = { name: alt.name, kcal: alt.kcal, protein: alt.protein, carbs: alt.carbs, fat: alt.fat };
    setMealOverrides(next);
    setSwapMealIdx(null);
    try { window.shapeDb && window.shapeDb.saveUserGoals && window.shapeDb.saveUserGoals("client_meal_swaps", next); } catch (e) {}
    if (alt) { try { window.ShapeMessages && window.ShapeMessages.sendProviderMessage && window.ShapeMessages.sendProviderMessage({ coach: { name: "Dr. Maya Patel", provider_role: "nutritionist" }, text: "Swapped " + baseName + " → " + alt.name + " · today" }).catch(() => {}); } catch (e) {} }
  };
  const [live, setLive] = React.useState(false);

  React.useEffect(() => {
    let cancelled = false;
    fetch('/api/client/nutrition', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (!cancelled && d && d.ok) { setData({ ...MOCK_NUTRI, ...d }); setLive(true); } })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const today = data.today;
  const targets = data.targets || {};
  const week = data.week || [];
  // Recipes added from a recipe page via "Add to today's plan" (shared store).
  const planExtras = (() => {
    try {
      const raw = window.localStorage.getItem("shape.todaysPlan.v1");
      const store = raw ? JSON.parse(raw) : null;
      if (!store || typeof store !== "object") return [];
      const d = new Date();
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      const arr = Array.isArray(store[key]) ? store[key] : [];
      return arr.map((m) => ({ name: m.name, time: m.time || "—", kcal: m.kcal, protein: m.protein, carbs: m.carbs, fat: m.fat, planned: true, source: m.source || "Shape Kitchen", _baseName: m.name }));
    } catch (e) { return []; }
  })();
  const baseTodayMeals = (data.todayMeals || []).map((m) => { const ov = mealOverrides[m.name]; return ov ? { ...m, ...ov, _baseName: m.name } : { ...m, _baseName: m.name }; });
  // Dedupe localStorage extras against the API's meals (signed-in users get their
  // planned meals from the server, so don't double-show the localStorage copy).
  const baseNames = new Set(baseTodayMeals.map((m) => String(m.name || '').toLowerCase()));
  const todayMeals = [...baseTodayMeals, ...planExtras.filter((m) => !baseNames.has(String(m.name || '').toLowerCase()))];
  const upcomingMeals = data.upcomingMeals || [];
  const topFoods = data.topFoods || [];
  const grocery = data.grocery || [];
  const hydration7d = data.hydration7d || [];
  const coachNote = data.coachNotes;
  const maxCal = Math.max(1, ...week.map(d => d.calories || 0), targets.calories || 0);
  const maxHyd = Math.max(1, ...hydration7d, targets.hydration || 0);

  // Calorie progress
  const calPct = today?.calories && targets.calories ? Math.min(100, Math.round((today.calories / targets.calories) * 100)) : 0;
  const calRemaining = today?.calories && targets.calories ? Math.max(0, targets.calories - today.calories) : 0;

  // Top KPIs
  const cards = [
    { k: today?.calories ? today.calories.toLocaleString() : "—", l: "Calories today", sub: targets.calories ? `of ${targets.calories.toLocaleString()}` : null },
    { k: today?.protein != null ? today.protein + "g" : "—", l: "Protein", sub: targets.protein ? `of ${targets.protein}g` : null },
    { k: `${data.loggedDays7 || 0}/7`, l: "Days logged", sub: "this week" },
    { k: `${data.adherentDays7 || 0}/7`, l: "Adherent days", sub: "macros hit" },
    { k: (data.currentStreak || 0) + "d", l: "Logging streak", sub: `best ${data.longestStreak || 0}d` },
  ];

  // Average macros (logged days only)
  const loggedDays = week.filter(d => d.logged);
  const avgProtein = loggedDays.length ? Math.round(loggedDays.reduce((a, d) => a + (d.protein || 0), 0) / loggedDays.length) : 0;
  const avgCarbs = loggedDays.length ? Math.round(loggedDays.reduce((a, d) => a + (d.carbs || 0), 0) / loggedDays.length) : 0;
  const avgFat = loggedDays.length ? Math.round(loggedDays.reduce((a, d) => a + (d.fat || 0), 0) / loggedDays.length) : 0;
  const avgCal = loggedDays.length ? Math.round(loggedDays.reduce((a, d) => a + (d.calories || 0), 0) / loggedDays.length) : 0;

  const macroProgress = (label, color, current, target) => {
    const pct = target ? Math.min(100, Math.round((current / target) * 100)) : 0;
    return (
      <div style={{ marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
            <span style={{ width: 9, height: 9, borderRadius: 999, background: color }} />
            <span style={{ fontSize: 13 }}>{label}</span>
          </span>
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12 }}>{current}<span style={{ color: "rgba(242,237,228,0.5)" }}>/{target}g</span></span>
        </div>
        <div style={{ position: "relative", height: 6, background: "rgba(242,237,228,0.08)", borderRadius: 999 }}>
          <div style={{ position: "absolute", left: 0, top: 0, height: "100%", width: pct + "%", background: color, borderRadius: 999 }} />
        </div>
      </div>
    );
  };

  return (
    <DashPage
      navItems={clientNavItems("nutri")}
      payoutCard={clientPayoutCard}
      eyebrow="LOGGED · PLANNED · MACROS · GROCERY"
      title="Nutrition"
      subtitle="Today's macros, the week's logged meals, what's coming next, and your grocery list — all in one place."
    >
      {/* Tab strip — Nutrition (active) + Grocery sub-page */}
      <div style={{ display: "flex", gap: 6, marginBottom: 20, borderBottom: "1px solid rgba(242,237,228,0.08)", paddingBottom: 1 }}>
        {[
          { label: "Nutrition", href: null, active: true },
          { label: "Grocery",   href: "ClientGrocery.html" },
        ].map(t => {
          const baseStyle = {
            fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase",
            padding: "10px 18px", borderRadius: "8px 8px 0 0", textDecoration: "none",
            border: "1px solid rgba(242,237,228,0.08)", borderBottom: "none",
          };
          if (t.active) {
            return <span key={t.label} style={{ ...baseStyle, background: "rgba(10,197,168,0.12)", color: TEAL_BRIGHT, borderColor: "rgba(10,197,168,0.28)", marginBottom: -1 }}>{t.label}</span>;
          }
          return <a key={t.label} href={t.href} style={{ ...baseStyle, background: "rgba(242,237,228,0.02)", color: "rgba(242,237,228,0.65)", cursor: "pointer" }}>{t.label}</a>;
        })}
      </div>

      {/* 5 KPI cards */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(5,1fr)", gap: 12, marginBottom: 20 }}>
        {cards.map((c, i) => (
          <Card key={i} style={{ padding: "20px 20px 18px" }}>
            <div style={{ fontFamily: serif, fontSize: 32, letterSpacing: "-0.02em", lineHeight: 1, fontVariantNumeric: "tabular-nums" }}>{c.k}</div>
            <div style={{ fontSize: 12, marginTop: 10, color: "rgba(242,237,228,0.85)" }}>{c.l}</div>
            {c.sub && <div style={{ fontSize: 10.5, color: "rgba(242,237,228,0.5)", marginTop: 3, fontFamily: "'JetBrains Mono', monospace", letterSpacing: "0.06em" }}>{c.sub}</div>}
          </Card>
        ))}
      </div>

      {/* Coach's note banner — current meal plan + tonight's dish */}
      {coachNote && (
        <Card style={{ marginBottom: 20, background: "linear-gradient(180deg, rgba(244,184,96,0.10), rgba(244,184,96,0.04))", border: "1px solid rgba(244,184,96,0.28)" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 20, alignItems: "center" }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8, flexWrap: "wrap" }}>
                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.14em", color: "#f4b860" }}>FROM YOUR NUTRITIONIST</span>
                {coachNote.plan && (
                  <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, letterSpacing: "0.12em", color: "rgba(244,184,96,0.85)", padding: "3px 9px", borderRadius: 999, background: "rgba(244,184,96,0.10)", border: "1px solid rgba(244,184,96,0.3)" }}>{coachNote.plan.toUpperCase()}</span>
                )}
              </div>
              {coachNote.dish && (
                <div style={{ fontFamily: serif, fontSize: 18, letterSpacing: "-0.01em", color: INK, marginBottom: 6 }}>{coachNote.dish}</div>
              )}
              <div style={{ fontSize: 13.5, color: "rgba(242,237,228,0.78)", lineHeight: 1.5 }}>{coachNote.text}</div>
            </div>
            <div style={{ textAlign: "right", fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.1em", color: "rgba(242,237,228,0.55)" }}>{coachNote.coach.toUpperCase()} · {coachNote.at.toUpperCase()}</div>
          </div>
        </Card>
      )}

      {/* Today macros + 7-day calories chart */}
      <div style={{ display: "grid", gridTemplateColumns: "1.1fr 1.9fr", gap: 20, marginBottom: 20 }}>
        <Card>
          <SectionTitle right="TODAY">Macros</SectionTitle>
          {!today && (
            <div style={{ padding: "26px 4px", color: "rgba(242,237,228,0.5)", fontSize: 13 }}>
              No nutrition logged yet.
            </div>
          )}
          {today && (
            <>
              <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
                <div style={{ fontFamily: serif, fontSize: 46, letterSpacing: "-0.02em", lineHeight: 1 }}>{today.calories?.toLocaleString() || "—"}</div>
                {targets.calories && <div style={{ fontSize: 14, color: "rgba(242,237,228,0.5)" }}>/ {targets.calories.toLocaleString()} kcal</div>}
              </div>
              <div style={{ fontSize: 12, color: "rgba(242,237,228,0.55)", marginTop: 6 }}>{calRemaining} kcal remaining · {calPct}% of target</div>
              <div style={{ position: "relative", height: 6, background: "rgba(242,237,228,0.08)", borderRadius: 999, marginTop: 10, marginBottom: 18 }}>
                <div style={{ position: "absolute", left: 0, top: 0, height: "100%", width: calPct + "%", background: TEAL_BRIGHT, borderRadius: 999 }} />
              </div>
              {macroProgress("Protein", "#7ed4ff", today.protein || 0, targets.protein)}
              {macroProgress("Carbs", "#f4b860", today.carbs || 0, targets.carbs)}
              {macroProgress("Fat", "#e07856", today.fat || 0, targets.fat)}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingTop: 12, borderTop: "1px solid rgba(242,237,228,0.08)", marginTop: 4 }}>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 8, fontSize: 13 }}>
                  <span style={{ width: 9, height: 9, borderRadius: 999, background: "#6a8cff" }} />Water
                </span>
                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12 }}>{today.hydration || 0}<span style={{ color: "rgba(242,237,228,0.5)" }}> / {targets.hydration || 3} L</span></span>
              </div>
            </>
          )}
        </Card>

        <Card>
          <SectionTitle right={`${data.loggedDays7 || 0} OF 7 DAYS LOGGED`}>Last 7 days · calories</SectionTitle>
          <div style={{ display: "flex", gap: 8, alignItems: "flex-end", height: 150, marginTop: 8 }}>
            {week.map((d, i) => {
              const h = d.calories ? Math.max(6, (d.calories / maxCal) * 100) : 4;
              const targetH = targets.calories ? (targets.calories / maxCal) * 100 : 0;
              return (
                <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 8, height: "100%", justifyContent: "flex-end", position: "relative" }}>
                  <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: "rgba(242,237,228,0.5)" }}>{d.calories ? Math.round(d.calories) : ""}</div>
                  <div style={{ position: "relative", width: "100%", height: `${h}%`, background: d.logged ? (d.adherent ? TEAL : "rgba(244,184,96,0.6)") : "rgba(242,237,228,0.12)", borderRadius: 3, minHeight: 4 }} />
                  <div style={{ fontSize: 10, fontFamily: "'JetBrains Mono', monospace", color: "rgba(242,237,228,0.5)" }}>{dayLabel(d.date)}</div>
                </div>
              );
            })}
          </div>
          <div style={{ display: "flex", gap: 16, marginTop: 14, paddingTop: 12, borderTop: "1px solid rgba(242,237,228,0.08)", flexWrap: "wrap" }}>
            <div style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11, color: "rgba(242,237,228,0.7)" }}>
              <span style={{ width: 9, height: 9, borderRadius: 2, background: TEAL }} /> hit macros
            </div>
            <div style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11, color: "rgba(242,237,228,0.7)" }}>
              <span style={{ width: 9, height: 9, borderRadius: 2, background: "rgba(244,184,96,0.6)" }} /> logged, missed targets
            </div>
            <div style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11, color: "rgba(242,237,228,0.7)" }}>
              <span style={{ width: 9, height: 9, borderRadius: 2, background: "rgba(242,237,228,0.12)" }} /> no log
            </div>
            <div style={{ flex: 1, textAlign: "right", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: "rgba(242,237,228,0.55)" }}>
              AVG {avgCal} KCAL · {avgProtein}g P · {avgCarbs}g C · {avgFat}g F
            </div>
          </div>
        </Card>
      </div>

      {/* Today's meals + Upcoming meals */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>
        <Card>
          <SectionTitle right={`${todayMeals.filter(m => m.logged).length} LOGGED · ${todayMeals.filter(m => m.planned).length} PLANNED`}>Today's meals</SectionTitle>
          {todayMeals.length === 0 && (
            <div style={{ padding: "26px 4px", color: "rgba(242,237,228,0.5)", fontSize: 13 }}>No meals yet today.</div>
          )}
          {todayMeals.map((m, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "auto 1fr auto", gap: 12, alignItems: "center", padding: "13px 4px", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.06)" }}>
              <div style={{ width: 52, fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: m.logged ? TEAL_BRIGHT : "rgba(242,237,228,0.55)" }}>{m.time}</div>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 13.5, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{m.name}{mealOverrides[m._baseName] && <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 8.5, letterSpacing: "0.12em", color: TEAL_BRIGHT, marginLeft: 8 }}>SWAPPED</span>}</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "rgba(242,237,228,0.55)", marginTop: 3 }}>{m.kcal} kcal · {m.protein}P · {m.carbs}C · {m.fat}F</div>
              </div>
              {m.logged ? <Pill tone="done">DONE</Pill> : (
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <button onClick={() => setSwapMealIdx(i)} style={{ background: "transparent", border: "1px solid rgba(46,224,196,0.4)", color: TEAL_BRIGHT, borderRadius: 999, padding: "5px 11px", fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.1em", cursor: "pointer", whiteSpace: "nowrap" }}>SWAP</button>
                  <Pill tone="teal">PLANNED</Pill>
                </div>
              )}
            </div>
          ))}
        </Card>

        <Card>
          <SectionTitle right={`${upcomingMeals.length} UPCOMING`}>Upcoming meals</SectionTitle>
          {upcomingMeals.length === 0 && (
            <div style={{ padding: "26px 4px", color: "rgba(242,237,228,0.5)", fontSize: 13 }}>
              No meals scheduled.
            </div>
          )}
          {upcomingMeals.map((m, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "auto 1fr auto", gap: 12, alignItems: "center", padding: "13px 4px", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.06)" }}>
              <div style={{ width: 60, textAlign: "center" }}>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, letterSpacing: "0.14em", color: TEAL_BRIGHT }}>{new Date(m.date + "T00:00:00").toLocaleDateString([], { weekday: "short" }).toUpperCase()}</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: "rgba(242,237,228,0.55)", marginTop: 2 }}>{m.time}</div>
              </div>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 13.5, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{m.name}</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "rgba(242,237,228,0.55)", marginTop: 3 }}>{m.source}</div>
              </div>
              <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: "rgba(242,237,228,0.7)" }}>{m.kcal}<span style={{ color: "rgba(242,237,228,0.45)" }}>kcal</span></span>
            </div>
          ))}
        </Card>
      </div>

      {/* Hydration trend + Top foods + Grocery */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 20 }}>
        <Card>
          <SectionTitle right="LAST 7D">Hydration trend</SectionTitle>
          <div style={{ display: "flex", gap: 6, alignItems: "flex-end", height: 120, marginTop: 4 }}>
            {hydration7d.map((h, i) => {
              const pct = h ? Math.max(8, (h / maxHyd) * 100) : 4;
              const hit = h >= (targets.hydration || 3);
              return (
                <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6, height: "100%", justifyContent: "flex-end" }}>
                  <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, color: "rgba(242,237,228,0.5)" }}>{h ? h.toFixed(1) : ""}</div>
                  <div style={{ width: "100%", background: hit ? "#6a8cff" : (h ? "rgba(106,140,255,0.4)" : "rgba(242,237,228,0.1)"), height: pct + "%", borderRadius: 3, minHeight: 4 }} />
                </div>
              );
            })}
          </div>
          <div style={{ fontSize: 11.5, color: "rgba(242,237,228,0.55)", marginTop: 12, paddingTop: 10, borderTop: "1px solid rgba(242,237,228,0.08)" }}>
            Target {targets.hydration || 3} L/day · Hit {hydration7d.filter(h => h >= (targets.hydration || 3)).length} of 7
          </div>
        </Card>

        <Card>
          <SectionTitle right={`${topFoods.length} FOODS`}>Top foods this week</SectionTitle>
          {topFoods.slice(0, 6).map((f, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr auto auto", gap: 10, alignItems: "center", padding: "10px 0", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.06)" }}>
              <div style={{ fontSize: 13, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{f.name}</div>
              <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "rgba(242,237,228,0.55)" }}>{f.avgKcal}kcal</div>
              <Pill>×{f.count}</Pill>
            </div>
          ))}
        </Card>

        <Card>
          <SectionTitle right={`${grocery.filter(g => g.status === "pending").length} TO BUY`}>Grocery list</SectionTitle>
          {grocery.map((g, i) => {
            const pending = g.status === "pending";
            return (
              <div key={i} style={{ display: "grid", gridTemplateColumns: "auto 1fr", gap: 10, alignItems: "center", padding: "10px 0", borderTop: i === 0 ? "none" : "1px solid rgba(242,237,228,0.06)" }}>
                <span style={{ width: 16, height: 16, borderRadius: 4, border: `1px solid ${pending ? "rgba(242,237,228,0.3)" : "rgba(10,197,168,0.5)"}`, background: pending ? "transparent" : "rgba(10,197,168,0.2)", display: "inline-flex", alignItems: "center", justifyContent: "center", color: TEAL_BRIGHT, fontSize: 10 }}>{!pending && "✓"}</span>
                <span style={{ fontSize: 13, color: pending ? INK : "rgba(242,237,228,0.5)", textDecoration: pending ? "none" : "line-through" }}>{g.item}</span>
              </div>
            );
          })}
          <a href="ClientGrocery.html" style={{ display: "block", textAlign: "center", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.14em", color: TEAL_BRIGHT, marginTop: 14, paddingTop: 12, borderTop: "1px solid rgba(242,237,228,0.08)" }}>OPEN FULL LIST →</a>
        </Card>
      </div>

      {/* Meal swap — coach-approved alternates for the chosen planned meal. */}
      {swapMealIdx != null && (() => {
        const base = (data.todayMeals || [])[swapMealIdx];
        const orig = todayMeals[swapMealIdx];
        if (!base || !orig) return null;
        // Prefer the nutritionist's own approved alternatives (name-only — they
        // carry the base meal's macros); fall back to the built-in list.
        const coachAlts = Array.isArray(base.alternatives) ? base.alternatives.filter(Boolean) : [];
        const alts = coachAlts.length
          ? coachAlts.filter(n => n !== orig.name).map(n => ({ name: n, kcal: base.kcal, protein: base.protein, carbs: base.carbs, fat: base.fat }))
          : MEAL_SWAPS.filter(a => a.name !== orig.name);
        const options = [
          { name: base.name, kcal: base.kcal, protein: base.protein, carbs: base.carbs, fat: base.fat, _keep: true },
          ...alts,
        ];
        return (
          <div onClick={() => setSwapMealIdx(null)} style={{ position: "fixed", inset: 0, zIndex: 1000, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
            <div onClick={e => e.stopPropagation()} style={{ width: "100%", maxWidth: 460, background: "#1a1612", border: "1px solid rgba(242,237,228,0.14)", borderRadius: 16, padding: 22, maxHeight: "80vh", overflowY: "auto" }}>
              <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: TEAL_BRIGHT, fontWeight: 600 }}>Swap meal</div>
              <div style={{ fontFamily: "Fraunces, serif", fontSize: 22, fontWeight: 500, color: "#f2ede4", marginTop: 4 }}>{orig.name}</div>
              <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 8 }}>
                {options.map((o, k) => (
                  <button key={k} onClick={() => applyMealSwap(swapMealIdx, o._keep ? null : o, base.name)} style={{ width: "100%", textAlign: "left", cursor: "pointer", padding: "13px 14px", borderRadius: 12, border: "1px solid " + (o._keep ? "rgba(46,224,196,0.5)" : "rgba(242,237,228,0.12)"), background: o._keep ? "rgba(46,224,196,0.07)" : "rgba(242,237,228,0.03)" }}>
                    <div style={{ fontSize: 14, fontWeight: 500, color: "#f2ede4" }}>{o.name}{o._keep ? "  ·  current" : ""}</div>
                    <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "rgba(242,237,228,0.55)", marginTop: 3 }}>{o.kcal} kcal · {o.protein}P · {o.carbs}C · {o.fat}F</div>
                  </button>
                ))}
              </div>
              <button onClick={() => setSwapMealIdx(null)} style={{ width: "100%", marginTop: 14, padding: "12px", borderRadius: 10, border: "1px solid rgba(242,237,228,0.14)", background: "transparent", color: "rgba(242,237,228,0.7)", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase", cursor: "pointer" }}>Cancel</button>
            </div>
          </div>
        );
      })()}
    </DashPage>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(
  <React.Fragment>
    <ClientNutriPage />
    <ChatWidget tabs={clientChatTabs} />
  </React.Fragment>
);
</script>
<script src="globalChatButton.js?v=20260609" defer></script>
</body>
</html>

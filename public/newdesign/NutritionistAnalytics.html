<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Analytics · Shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#1a1612}*{box-sizing:border-box}a{text-decoration:none;color:inherit}</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="pageShell.jsx"></script>
<script type="text/babel" src="trainerDashboard.jsx"></script>
<script type="text/babel" src="coachNav.jsx"></script>
<script type="text/babel">
function anMoney(cents) {
  if (cents == null) return "—";
  try { return "$" + Math.round(cents / 100).toLocaleString(); }
  catch (e) { return "$0"; }
}
function anDate(ms) {
  if (!ms) return "—";
  try { return new Date(ms).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }); }
  catch (e) { return "—"; }
}

// Mock data — shown while the API loads, or when the viewer isn't a
// signed-in nutritionist.
const MOCK_ANALYTICS = {
  metrics: { mrrGrossCents: 532000, mrrNetCents: 452200, activeClients: 28, totalSessions: 214, completedSessions: 186, upcomingSessions: 9 },
  stripe: {
    connected: true, status: "connected", balanceCents: 96400,
    payouts: [
      { id: "po_1", amountCents: 241000, currency: "usd", status: "paid", arrivalDate: Date.now() - 5 * 86400000, created: Date.now() - 7 * 86400000 },
      { id: "po_2", amountCents: 228500, currency: "usd", status: "paid", arrivalDate: Date.now() - 35 * 86400000, created: Date.now() - 37 * 86400000 },
      { id: "po_3", amountCents: 233900, currency: "usd", status: "paid", arrivalDate: Date.now() - 65 * 86400000, created: Date.now() - 67 * 86400000 },
    ],
  },
};

function NutritionistAnalyticsPage() {
  const [data, setData] = React.useState(MOCK_ANALYTICS);
  const [live, setLive] = React.useState(false);

  React.useEffect(() => {
    let cancelled = false;
    fetch('/api/nutritionist/analytics', { credentials: 'same-origin' })
      .then(r => (r.ok ? r.json() : null))
      .then(d => { if (!cancelled && d && d.isNutritionist) { setData(d); setLive(true); } })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const m = data.metrics || {};
  const s = data.stripe || { connected: false, payouts: [] };
  const payouts = s.payouts || [];

  const cards = [
    { k: anMoney(m.mrrNetCents), l: "Net monthly revenue" },
    { k: String(m.activeClients ?? 0), l: "Active clients" },
    { k: String(m.completedSessions ?? 0), l: "Sessions completed" },
    { k: String(m.upcomingSessions ?? 0), l: "Upcoming sessions" },
  ];

  return (
    <DashPage
      navItems={nutriNavItems("analytics")}
      payoutCard={nutriPayoutCard}
      eyebrow="REVENUE · ROSTER · SESSIONS"
      title="Analytics"
      subtitle="Your real numbers — recurring revenue, active roster, sessions, and Stripe payouts."
    >
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 16, marginBottom: 20 }}>
        {cards.map((c, i) => (
          <Card key={i} style={{ padding: "22px 22px 20px" }}>
            <div style={{ fontFamily: serif, fontSize: 38, letterSpacing: "-0.02em", lineHeight: 1 }}>{c.k}</div>
            <div style={{ fontSize: 13, marginTop: 12 }}>{c.l}</div>
          </Card>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1.25fr", gap: 20 }}>
        <Card>
          <SectionTitle right="MONTHLY">Recurring revenue</SectionTitle>
          <div style={{ fontFamily: serif, fontSize: 44, letterSpacing: "-0.02em", lineHeight: 1, marginTop: 4 }}>{anMoney(m.mrrNetCents)}</div>
          <div style={{ fontSize: 12.5, color: "rgba(242,237,228,0.55)", marginTop: 8 }}>
            net to you · gross {anMoney(m.mrrGrossCents)} less 15% Shape fee
          </div>
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px solid rgba(242,237,228,0.08)", display: "flex", justifyContent: "space-between", fontSize: 12.5 }}>
            <span style={{ color: "rgba(242,237,228,0.6)" }}>Stripe available balance</span>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", color: TEAL_BRIGHT }}>{s.connected ? anMoney(s.balanceCents) : "—"}</span>
          </div>
        </Card>

        <Card>
          <SectionTitle right={s.connected ? "STRIPE CONNECT" : "NOT CONNECTED"}>Recent payouts</SectionTitle>
          {!s.connected && (
            <div style={{ padding: "26px 4px", color: "rgba(242,237,228,0.55)", fontSize: 13 }}>
              Connect a Stripe account to receive and track payouts.
            </div>
          )}
          {s.connected && payouts.length === 0 && (
            <div style={{ padding: "26px 4px", color: "rgba(242,237,228,0.55)", fontSize: 13 }}>
              No payouts yet. They'll appear here once Stripe sends your first transfer.
            </div>
          )}
          {s.connected && payouts.length > 0 && (
            <RecentPayouts rows={payouts.map((p) => ({
              date: anDate(p.arrivalDate || p.created),
              mid: String(p.status || "").toUpperCase(),
              amount: anMoney(p.amountCents),
            }))} />
          )}
        </Card>
      </div>
    </DashPage>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<NutritionistAnalyticsPage />);
</script>
<script src="globalChatButton.js" defer></script>
</body>
</html>

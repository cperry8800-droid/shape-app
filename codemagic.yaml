# Codemagic CI for the Shape iOS app.
#
# On every push to `main`, builds the Capacitor web bundle, syncs it into
# the iOS project, signs the .ipa, and uploads to TestFlight.
#
# Setup (one-time, in the Codemagic dashboard):
#   1. Add this repo to Codemagic.
#   2. Settings → Integrations → App Store Connect → add an API key
#      (created in App Store Connect → Users and Access → Keys, role
#      "App Manager"). Name it exactly "ShapeApp ASC API key" or update
#      the `integrations.app_store_connect` reference below to match.
#   3. Settings → Code signing identities → automatic provisioning
#      with that same API key (Codemagic generates and manages the
#      distribution cert + provisioning profile for you).
#   4. Make sure the bundle id `com.theshapecommunity.app` exists in
#      App Store Connect with a corresponding app record.
#
# After that, every push to main rebuilds + uploads. Testers install
# Apple's TestFlight app, accept the invite, and pull the latest build.

workflows:
  ios-testflight:
    name: Shape — iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ShapeApp ASC API key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.theshapecommunity.app
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install root deps
        script: npm ci
      - name: Install mobile-app deps + build web bundle
        script: |
          cd mobile-app
          npm ci
          # Sentry release for the TestFlight IPA. Vite inlines import.meta.env.*
          # at BUILD time, so it has to be exported HERE — a shipped binary can
          # never be fixed by redeploying. Without it, mobile-app/src/sentry.mjs
          # initialises with `release: undefined` and the runbook's release
          # verification can never pass on iOS.
          #
          # CM_COMMIT is Codemagic's own commit variable; the `git rev-parse`
          # fallback makes this independent of Codemagic's variable naming (older
          # runners used FCI_COMMIT) and always resolves, since the repo is
          # already checked out by the time this runs.
          #
          # ⚠ SAFE TO WIRE NOW, unlike the DSN. This references no Codemagic
          # variable GROUP, so it cannot break the build when nothing is
          # configured — unset simply yields the git SHA. The Sentry DSN + upload
          # vars are deliberately STILL an owner step (docs/WORKLOG.md step 2c),
          # because referencing a group that does not exist yet WOULD break the
          # iOS build on the next push to main.
          #
          # VITE_SHAPE_ENV is deliberately not set: unset, sentry.mjs falls back
          # to Vite's MODE, which is 'production' — correct for the artifact this
          # pipeline ships. Set it explicitly only if TestFlight betas should be
          # a separate Sentry environment from App Store releases.
          export VITE_SHAPE_RELEASE="${CM_COMMIT:-$(git rev-parse HEAD)}"
          npm run build
      - name: Capacitor sync iOS
        script: |
          cd mobile-app
          npx cap sync ios
      - name: Pod install
        script: |
          cd mobile-app/ios/App
          pod install --repo-update
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      - name: Bump build number from TestFlight
        script: |
          cd mobile-app/ios/App
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo "0")
          NEXT_BUILD=$((LATEST_BUILD + 1))
          agvtool new-version -all "$NEXT_BUILD"
      - name: Build ipa
        script: |
          cd mobile-app/ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile-app/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal

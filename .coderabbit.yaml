# Shape — CodeRabbit config. Place at repo root. Enforces the same invariants as CLAUDE.md.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# NOTE: this file configures CodeRabbit; it only takes effect once the CodeRabbit
# GitHub App is installed on this repo (https://coderabbit.ai → add this repo).
language: "en-US"
tone_instructions: "Be concise and direct. Prioritize scalability and long-term maintainability. Treat security, RLS, and committed-secret issues as blocking."

reviews:
  profile: assertive               # thorough; switch to "chill" if it feels nitpicky
  request_changes_workflow: true   # don't auto-approve until comments are resolved
  high_level_summary: true
  auto_review:
    enabled: true
    auto_incremental_review: true  # re-review on each push
    drafts: false
    base_branches:
      - main
      - staging

  # Pre-merge checks. Quality checks stay advisory (warning) so they never block
  # the owner's bypass merges; the SECURITY check is raised to "error" so a
  # security finding fails CodeRabbit's check (require it in branch protection to
  # make it a hard gate — that can't be set from the repo).
  pre_merge_checks:
    docstrings:
      mode: "warning"        # advisory — flag undocumented exported/public APIs
    issue_assessment:
      mode: "warning"        # advisory — assess the PR against its description/linked issue
    title:
      mode: "warning"
      requirements: "Concise, descriptive title; conventional-commit style preferred — e.g. feat/fix/docs/chore(scope): summary."
    description:
      mode: "warning"
    custom_checks:
      - name: "Security review"
        mode: "error"
        instructions: >-
          Block on security regressions in the diff. API routes
          (src/app/api/**): missing auth or RLS scoping; IDOR on dynamic-id
          routes; a service-role / admin Supabase client used for a
          USER-initiated action (RLS bypass — RLS must stay authoritative at the
          endpoint; the admin client is for system-only writes like audit /
          notify-cron); unbounded request bodies (the shared readJson size guard
          must be used). Secrets: any API key, token, or service-role key
          committed, or AI/model keys shipped into a client bundle
          (mobile-app/src, public/) or the Edge proxy. Injection: SQL/RPC built
          from unsanitized input; unescaped HTML (dangerouslySetInnerHTML). AI
          write paths: any change that bypasses the preview/confirm +
          ai_audit_log scaffold, or a confirm token that isn't
          single-use/actor-bound. Nutrition/health: individualized (clinical)
          actions not gated by provider licensure + scope (the
          NUTRITION_COMPLIANCE controls). Auth/membership: gated /api prefixes
          removed from the proxy gate, or RLS policies weakened/dropped in a
          migration.

  # Security scanners. On by default, but pinned here so the posture is durable
  # in the repo (the file overrides dashboard toggles). Gitleaks = secret
  # scanning; Semgrep = SAST; Checkov = IaC/config.
  tools:
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    checkov:
      enabled: true

  path_filters:
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/*-lock.json"
    - "!**/*.min.js"
    - "!**/dist/**"
    - "!**/.next/**"
    - "!**/build/**"
    - "!public/m/**"

  path_instructions:
    - path: "**"
      instructions: >-
        Shape = a coaching marketplace (Next.js + Supabase/RLS, with a separate mobile
        app). Treat as BLOCKING: (1) any hardcoded secret/key/token/password or a
        committed .env file other than .env.example; (2) fabricated or placeholder data
        where it should be live-or-"—" (honest-data principle); (3) a visual restyle
        where only a layout/hierarchy change was intended (keep the look — reuse
        existing components/tokens, no new motifs/colors/gradients).

    - path: "src/**/*.ts"
      instructions: "Focus on architecture and system design."

    - path: "src/app/api/**"
      instructions: >-
        Server API routes. RLS is the authoritative gate: verify auth + membership +
        is_coach_on_client (or owner) checks on every read/write. Flag as BLOCKING any
        service-role / RLS-bypassing write performed for a user action, any missing
        authorization, any IDOR (acting on another user's or client's data), and any
        unvalidated input. Secrets come from server env only and must never be returned
        to the client.

    - path: "mobile-app/src/**"
      instructions: >-
        Mobile bundle. NEVER allow API keys/secrets or direct LLM/provider calls here —
        AI is server-side only. Apple Health / Health Connect are on-device: data is
        read in the app and uploaded to the backend; flag any attempted server-side
        pull. Don't fork business logic that should live in the shared engine/lib. Keep
        the existing look. Remember edits here require re-syncing public/m.

    - path: "src/lib/**"
      instructions: >-
        Shared logic + AI helper. All LLM calls go through the server-side ai helper
        (src/lib/ai.ts); never ship keys to the client. AI output used as data must be
        validated/parsed — flag raw model text written to the record. Don't duplicate
        logic that the web and mobile apps should share.

    - path: "src/{app,components}/**"
      instructions: >-
        UI. Enforce "lead with the directive, demote the data": one lead per surface,
        wins/streaks over bare percentages, and honest "—" over fabricated numbers.
        Reuse existing components/tokens (BSPlate/DashPlate, dark teal/magenta
        instrument-plate aesthetic) — flag new visual motifs/gradients/colors when a
        restructure was the intent. AI writes must be human-in-the-loop
        (preview/confirm), never auto-applied.

    - path: "public/newdesign/**"
      instructions: >-
        Self-contained website pages (HTML + babel .jsx). Flag missing ?v= cache-bust
        bumps on edited referenced .jsx, and theme-token violations (hardcoded ink/paper
        on themed surfaces, or theme tokens on fixed-background screens).

    - path: "**/*.sql"
      instructions: >-
        Database / migrations. Every new table must have RLS enabled with
        owner/role-scoped policies before use. Flag any new table without RLS, and any
        policy that could expose another user's or client's rows.

chat:
  auto_reply: true

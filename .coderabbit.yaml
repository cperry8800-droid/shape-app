# CodeRabbit — automated AI code review on every PR.
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit
# NOTE: this file configures CodeRabbit; it only takes effect once the CodeRabbit
# GitHub App is installed on this repo (https://coderabbit.ai → add this repo).
language: en-US
reviews:
  profile: assertive             # stricter reviews (more findings); "chill" for fewer
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: false
  # Pre-merge checks. Quality checks stay advisory (warning) so they never block
  # the owner's bypass merges; the SECURITY check is raised to "error" so a
  # security finding fails CodeRabbit's check (require it in branch protection to
  # make it a hard gate — see note below).
  pre_merge_checks:
    docstrings:
      mode: "warning"        # advisory — flag undocumented exported/public APIs
    issue_assessment:
      mode: "warning"        # advisory — assess the PR against its description/linked issue
    title:
      mode: "warning"
      requirements: "Concise, descriptive title; conventional-commit style preferred — e.g. feat/fix/docs/chore(scope): summary."
    description:
      mode: "warning"
    # Security pre-merge check (custom). Raised to "error" — this is the
    # increased security gate. It fails CodeRabbit's check on a finding; to make
    # the merge itself blocking, add the CodeRabbit status to branch protection
    # on main (Settings → Branches), which can't be set from the repo.
    custom_checks:
      - name: "Security review"
        mode: "error"
        instructions: >-
          Block on security regressions in the diff. API routes
          (src/app/api/**): missing auth or RLS scoping; IDOR on dynamic-id
          routes; a service-role / admin Supabase client used for a
          USER-initiated action (RLS bypass — RLS must stay authoritative at the
          endpoint; the admin client is for system-only writes like audit /
          notify-cron); unbounded request bodies (the shared readJson size guard
          must be used). Secrets: any API key, token, or service-role key
          committed, or AI/model keys shipped into a client bundle
          (mobile-app/src, public/) or the Edge proxy. Injection: SQL/RPC built
          from unsanitized input; unescaped HTML (dangerouslySetInnerHTML). AI
          write paths: any change that bypasses the preview/confirm +
          ai_audit_log scaffold, or a confirm token that isn't
          single-use/actor-bound. Nutrition/health: individualized (clinical)
          actions not gated by provider licensure + scope (the
          NUTRITION_COMPLIANCE controls). Auth/membership: gated /api prefixes
          removed from the proxy gate, or RLS policies weakened/dropped in a
          migration.
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - staging
  # Security scanners. On by default, but pinned here so the posture is durable
  # in the repo (the file overrides dashboard toggles). Gitleaks = secret
  # scanning; Semgrep = SAST; Checkov = IaC/config.
  tools:
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    checkov:
      enabled: true
  # Skip generated/built output — review the source, not the bundle.
  path_filters:
    - "!public/m/**"
    - "!**/*.min.js"
    - "!**/*-lock.json"
  path_instructions:
    # Shape review invariants — apply to EVERY change.
    - path: "**"
      instructions: >-
        Shape's core invariants — check every change against all five:
        (1) RLS is authoritative — enforce access at the endpoint + RLS, never
        trust the client. Flag any service-role / admin Supabase client used for
        a USER-initiated action (system-only writes like audit / notify-cron are
        the only exception).
        (2) No client-side secrets — AI/model keys (OPENAI_API_KEY, etc.),
        service-role keys, and webhook secrets must never reach a client bundle
        (mobile-app/src, public/) or the Edge proxy; server-only.
        (3) Honest data — demo / illustrative values may appear ONLY signed-out
        (preview). A signed-in / live account must never be shown invented or
        demo numbers; flag demo-vs-live data leaks.
        (4) Keep the look — preserve the editorial aesthetic and theme tokens
        (t.INK / t.PAPER / t.RULE / t.ACCENT). No hardcoded ink/paper on themed
        surfaces, no theme tokens on fixed-background screens; bump the ?v=
        cache-bust on any edited referenced public/newdesign/*.jsx.
        (5) Don't fork web vs mobile — the website (public/newdesign) and the
        mobile app (mobile-app/src) must stay in parity for shared features; a
        change to shared behavior on one surface should not silently diverge from
        the other. Remember mobile edits require re-syncing public/m.
    - path: "mobile-app/src/broadsheet/**"
      instructions: >-
        Broadsheet mobile app. Flag: theme-token violations (hardcoded ink/paper
        on themed surfaces, or theme tokens on fixed-background screens),
        demo-vs-live data leaks, and changes to shared components
        (BSPage/BSPlate/BSClientFeed/BSFacetAvatar) that ripple across multiple
        profiles or roles. Remember edits here require re-syncing public/m.
    - path: "public/newdesign/**"
      instructions: >-
        Self-contained website pages (HTML + babel .jsx). Flag missing ?v=
        cache-bust bumps on edited referenced .jsx, and theme-token violations.
    - path: "src/app/api/**"
      instructions: >-
        Next.js API routes. Flag missing auth/RLS scoping, IDOR on dynamic-id
        routes, and unbounded request bodies (use the shared readJson guard).
chat:
  auto_reply: true

# Shape Radio's own station (README.md): the stream server, its standby loop, Nora's engine playing
# the station around the clock, and HTTPS in front. On one always-on machine with Docker:
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
#
# Listeners: https://$STATION_HOST/live
services:
  icecast:
    build: ./icecast
    restart: always
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?set it in .env}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?set it in .env}
      STATION_HOST: ${STATION_HOST:?set it in .env}
      ICECAST_ADMIN_EMAIL: ${ICECAST_ADMIN_EMAIL:-}
      ICECAST_MAX_LISTENERS: ${ICECAST_MAX_LISTENERS:-2000}
      # Shape checks each listener's pass (src/lib/radio/pass.mjs) and keeps each session
      # (src/lib/radio/listens.mjs); the station signs in with the engine's token
      SHAPE_URL: ${SHAPE_URL:-https://www.theshapecommunity.com}
      NORA_ENGINE_TOKEN: ${NORA_ENGINE_TOKEN:?set it in .env}
      # This start's name, for the door below
      STATION_BOOT_FILE: /run/station/boot
    volumes:
      - station_run:/run/station
    # Reachable from this machine only (for a look at Icecast's status page over an SSH tunnel);
    # the public reach it through Caddy.
    ports:
      - "127.0.0.1:8000:8000"

  standby:
    build: ./standby
    restart: always
    depends_on: [icecast]
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?set it in .env}
      NORA_BITRATE: ${NORA_BITRATE:-192k}
      # Your own loop: put the file in ./standby-audio and name it here, e.g. /standby/standby.mp3
      STANDBY_FILE: ${STANDBY_FILE:-}
    volumes:
      - ./standby-audio:/standby:ro

  engine:
    build: ../nora-engine
    restart: always
    depends_on: [icecast]
    environment:
      SHAPE_URL: ${SHAPE_URL:-https://www.theshapecommunity.com}
      NORA_ENGINE_TOKEN: ${NORA_ENGINE_TOKEN:?set it in .env}
      NORA_STREAM_URL: icecast://source:${ICECAST_SOURCE_PASSWORD:?set it in .env}@icecast:8000/live
      NORA_BITRATE: ${NORA_BITRATE:-192k}

  # The door: drops the listeners Shape names (a second device on one account, or a membership that
  # ended or went past due), with Icecast's own admin command, inside this machine only.
  door:
    build: ./door
    restart: always
    depends_on: [icecast]
    environment:
      SHAPE_URL: ${SHAPE_URL:-https://www.theshapecommunity.com}
      NORA_ENGINE_TOKEN: ${NORA_ENGINE_TOKEN:?set it in .env}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?set it in .env}
      ICECAST_URL: http://icecast:8000
      STATION_BOOT_FILE: /run/station/boot
    volumes:
      - station_run:/run/station:ro

  caddy:
    image: caddy:2.8.4
    restart: always
    depends_on: [icecast]
    environment:
      STATION_HOST: ${STATION_HOST:?set it in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  station_run:

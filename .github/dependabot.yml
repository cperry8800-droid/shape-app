# Dependabot version updates — monthly, grouped; npm minor/patch, actions incl. majors.
#
# Goal: the security patch cadence runs itself without PR noise. One grouped
# PR per ecosystem per month.
#
# Majors are excluded for npm ONLY — both npm ecosystems carry the ignore
# rule, because an npm major (Next 17, Capacitor 8, …) is a deliberate
# project and can typecheck, build green, and still break at runtime.
# github-actions deliberately does NOT ignore majors: a workflow bump is
# self-testing, since the changed file IS what CI executes, so a green run
# has demonstrated the new action works. Dependabot ALERTS fire either way.
#
# Both workflows SHA-pin their actions; Dependabot updates the SHA and its
# trailing version comment together.
#
# Every PR runs through the CI gate; mobile-dep bumps will fail the public/m
# sync check until the bundle is republished (correct — handle those in a
# session, don't auto-merge).
#
# Note: mobile-app pins a patch-package patch for
# @capacitor-community/bluetooth-le@7.3.2 — if Dependabot bumps that
# package, the patch file must be regenerated in the same PR.
#
# Note: @sentry/react is IGNORED in mobile-app — it is not independently
# upgradable. @sentry/capacitor peers it at an EXACT version (4.3.0 wants
# exactly 10.69.0), so raising react alone fails `npm ci` on an eresolve
# before anything builds. That took down #1995 and again #1999. The pair
# moves in lockstep: when a capacitor bump goes red on this peer, raise
# @sentry/react by hand in that same PR to whatever the new capacitor
# peers. @sentry/vite-plugin is NOT coupled and stays in the group.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      web-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/mobile-app"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      mobile-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned by @sentry/capacitor's exact peer — see the note above.
      - dependency-name: "@sentry/react"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

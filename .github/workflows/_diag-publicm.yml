name: diag-publicm
on:
  push:
    branches: [claude/shape-radio-nora-dj]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
        working-directory: mobile-app
      - run: VITE_BASE=/m/ npm run build
        working-directory: mobile-app
      - name: Show what differs
        run: |
          echo '===== file-list diff ====='
          diff -qr mobile-app/dist public/m || true
          echo
          echo '===== index.html CR counts (dist vs committed) ====='
          printf 'dist    CR: '; tr -cd '\r' < mobile-app/dist/index.html | wc -c
          printf 'publicm CR: '; tr -cd '\r' < public/m/index.html | wc -c
          echo
          echo '===== unified diff of index.html (cat -A: $=LF, ^M=CR) ====='
          diff -u <(cat -A public/m/index.html) <(cat -A mobile-app/dist/index.html) || true
          echo
          echo '===== sha256 of each index.html ====='
          sha256sum mobile-app/dist/index.html public/m/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-dist
          path: mobile-app/dist

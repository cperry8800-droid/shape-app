# Main-branch gate: blocks PR merges when the web app or mobile bundle is broken.
#
# public/m is now built at DEPLOY time from mobile-app/ (Vercel buildCommand ->
# scripts/build-m.sh), so it is NOT committed to git. The mobile job below only
# verifies the /m/ bundle still BUILDS — there is no committed public/m to sync
# against anymore. The job NAME is kept ("Mobile (build + public/m sync)") so the
# existing branch-protection required check keeps matching; rename it + the
# required check together if you want the honest name.
#
# Runs on every PR into main + pushes to main/staging. To make it a hard
# gate, add a branch protection rule on main requiring the "Web (typecheck
# + build)", "Mobile (build + public/m sync)" and "Tests (unit + mount)"
# checks. ⚠ A job in this file is ADVISORY until it is in that required list —
# adding the job is half the change.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]
  workflow_dispatch:

# Least-privilege token: these CI jobs only read the repo (no writes/pushes).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Compile gate for the website JSX: the Vercel buildCommand precompiles
      # public/newdesign at deploy (scripts/build-newdesign.mjs), so a JSX file
      # that doesn't compile must fail the PR here, not the deploy.
      - name: Newdesign JSX precompile (check)
        run: node scripts/build-newdesign.mjs --check

      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # ⚠ THE ONLY CI JOB THAT EXECUTES A REACT COMPONENT.
  #
  # tsc, next build and the Vite mobile build all pass a module with a TDZ
  # reference, a conditionally-called hook, or a throw in a render body —
  # nothing in them RUNS the component. One shipped exactly that way (#1781).
  # Until this job existed, the mount tests written to catch that class ran
  # ONLY from the pre-commit hook, which is bypassable four ways
  # (--no-verify, SKIP_VERIFY=1, missing node_modules, and silently for any
  # path its patterns miss). A gate a developer can skip is not a gate.
  #
  # Both dependency trees are installed on purpose: tests/helpers/load-real-module.mjs
  # resolves a source file's bare imports with createRequire from the SOURCE's
  # location, so a mobile module under test pulls @sentry/capacitor and friends
  # from mobile-app/node_modules — root-only would fail at import, not at assert.
  tests:
    name: Tests (unit + mount)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          # BOTH lockfiles — this job is the only one that installs both trees,
          # so keying on the root lock alone would serve a stale cache after a
          # mobile-only dependency change.
          cache-dependency-path: |
            package-lock.json
            mobile-app/package-lock.json

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (mobile-app)
        working-directory: mobile-app
        run: npm ci

      - name: Run the suite
        run: npm test

  mobile:
    name: Mobile (build + public/m sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      # Verifies the /m/ bundle still builds from source. public/m itself is
      # generated at deploy time (scripts/build-m.sh), not committed, so there's
      # no byte-diff against a committed copy anymore — a failed build fails here.
      - name: Build (/m/ bundle)
        working-directory: mobile-app
        run: VITE_BASE=/m/ npm run build

      # ⚠ The build above EXITS 0 when an asset the bundle requests is missing.
      # Measured: with shape-logo.png moved out of mobile-app/public/, the build
      # succeeds without naming it, the emitted bundle still requests it three
      # times, and dist/ does not contain it. tsc, next build, gitleaks and the
      # suite are equally blind — the first sign is a broken image in the app.
      # This step reads the ARTIFACT, so a comment or a dead branch cannot raise
      # a false alarm: the bundler removed both before it runs.
      # Rides this job on purpose — "Mobile" is already a required check on main,
      # so the gate is real on day one without a branch-protection change.
      - name: Asset references resolve
        run: node scripts/mobile-asset-refs.mjs mobile-app/dist

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the PR commit-range scan below can diff base..head.
          # (The working-tree scan doesn't need it; the git-mode scan does.)
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Scan the working tree for secrets
        run: |
          # --no-git scans the current checkout (deterministic, fast); the
          # config allowlists the by-design publishable key + generated bundles.
          /tmp/gitleaks detect --no-git --source . --config .gitleaks.toml \
            --redact --no-banner --exit-code 1 || {
            echo "::error::gitleaks flagged a potential secret in the working tree — review the (redacted) findings above. If it is a false-positive, allowlist it in .gitleaks.toml."
            exit 1
          }
          echo "working tree clean ✓"

      - name: Scan this PR's commits for secrets
        if: github.event_name == 'pull_request'
        run: |
          # git-mode scan over ONLY this PR's commits (base..head). Catches a
          # secret that was added in one commit and "removed" in a later commit
          # of the same PR — the working-tree scan above never sees those, but
          # the secret is still exposed in history once pushed.
          BASE='${{ github.event.pull_request.base.sha }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          /tmp/gitleaks detect --source . --config .gitleaks.toml \
            --log-opts="--diff-merges=first-parent ${BASE}..${HEAD}" \
            --redact --no-banner --exit-code 1 || {
            echo "::error::gitleaks flagged a potential secret in this PR's commit history (base..head). Even if it is not in the final diff, a secret committed at any point is exposed — rotate it and rewrite the branch to purge it. If it is a false-positive, allowlist it in .gitleaks.toml."
            exit 1
          }
          echo "PR commits clean ✓"

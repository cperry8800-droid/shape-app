# Main-branch gate: blocks PR merges when the web app or mobile bundle is broken.
#
# public/m is now built at DEPLOY time from mobile-app/ (Vercel buildCommand ->
# scripts/build-m.sh), so it is NOT committed to git. The mobile job below only
# verifies the /m/ bundle still BUILDS — there is no committed public/m to sync
# against anymore. The job NAME is kept ("Mobile (build + public/m sync)") so the
# existing branch-protection required check keeps matching; rename it + the
# required check together if you want the honest name.
#
# Runs on every PR into main + pushes to main/staging. To make it a hard
# gate, add a branch protection rule on main requiring the "Web (typecheck
# + build)" and "Mobile (build + public/m sync)" checks.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]
  workflow_dispatch:

# Least-privilege token: these CI jobs only read the repo (no writes/pushes).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  mobile:
    name: Mobile (build + public/m sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      # Verifies the /m/ bundle still builds from source. public/m itself is
      # generated at deploy time (scripts/build-m.sh), not committed, so there's
      # no byte-diff against a committed copy anymore — a failed build fails here.
      - name: Build (/m/ bundle)
        working-directory: mobile-app
        run: VITE_BASE=/m/ npm run build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so the PR commit-range scan below can diff base..head.
          # (The working-tree scan doesn't need it; the git-mode scan does.)
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Scan the working tree for secrets
        run: |
          # --no-git scans the current checkout (deterministic, fast); the
          # config allowlists the by-design publishable key + generated bundles.
          /tmp/gitleaks detect --no-git --source . --config .gitleaks.toml \
            --redact --no-banner --exit-code 1 || {
            echo "::error::gitleaks flagged a potential secret in the working tree — review the (redacted) findings above. If it is a false-positive, allowlist it in .gitleaks.toml."
            exit 1
          }
          echo "working tree clean ✓"

      - name: Scan this PR's commits for secrets
        if: github.event_name == 'pull_request'
        run: |
          # git-mode scan over ONLY this PR's commits (base..head). Catches a
          # secret that was added in one commit and "removed" in a later commit
          # of the same PR — the working-tree scan above never sees those, but
          # the secret is still exposed in history once pushed.
          BASE='${{ github.event.pull_request.base.sha }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          /tmp/gitleaks detect --source . --config .gitleaks.toml \
            --log-opts="--diff-merges=first-parent ${BASE}..${HEAD}" \
            --redact --no-banner --exit-code 1 || {
            echo "::error::gitleaks flagged a potential secret in this PR's commit history (base..head). Even if it is not in the final diff, a secret committed at any point is exposed — rotate it and rewrite the branch to purge it. If it is a false-positive, allowlist it in .gitleaks.toml."
            exit 1
          }
          echo "PR commits clean ✓"

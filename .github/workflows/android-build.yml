# Android build CI for the Capacitor app in mobile-app/.
#
# What this does on every PR / push that touches the mobile app:
#   1. builds the Vite web bundle (relative base — correct for the native shell)
#   2. syncs it into the Android project with Capacitor
#   3. assembles a DEBUG apk with Gradle and uploads it as an artifact
#
# A debug APK is debug-signed automatically, so this runs with no secrets and
# proves the Android build stays green. Producing an installable RELEASE build
# needs your signing keystore — that part is intentionally left as documented,
# opt-in steps (see the "release" job at the bottom) so nothing here depends on
# secrets you haven't added yet. To enable release signing later, add these
# repository secrets and the release job runs automatically:
#   ANDROID_KEYSTORE_BASE64  — `base64 -w0 my-release.keystore`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Every action here is pinned to a commit SHA (the version tag rides in the
# trailing comment), matching ci.yml. That matters most for the release job:
# it is the one place in this repo that reads a signing keystore, so a moved
# tag must not be able to change what executes next to those secrets. Pinned
# BEFORE the secrets exist, deliberately — hardening a workflow that already
# has keystore access is the harder moment. Dependabot bumps the SHA and its
# version comment together.

name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

# Cancel an in-flight run when a newer commit is pushed to the same ref.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ⚠ Sentry rides in HERE or not at all. Vite inlines `import.meta.env.*` at
      # BUILD time, so an APK built without these bakes in an empty DSN and can
      # never be switched on later — no redeploy reaches a shipped binary. GitHub
      # secrets are NOT exposed to a step implicitly, and Vercel env vars do not
      # exist in this runner at all: scripts/build-m.sh only covers the hosted
      # /m/ bundle. Every SECRET here is optional — unset, the SDK stays inert
      # (dsn '') and the upload plugin is simply absent, so Sentry does nothing.
      # ⚠ That is NOT the same as "byte-identical", which this comment used to
      # claim. VITE_SHAPE_RELEASE is `${{ github.sha }}` — a context expression,
      # always set, never a secret — and sentry.mjs reads it via
      # `import.meta.env.VITE_SHAPE_RELEASE`, which Vite inlines at build time.
      # So the bundle carries the commit SHA even with no Sentry configured.
      # Functionally inert, different bytes.
      - name: Build web assets
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SHAPE_RELEASE: ${{ github.sha }}
          # ⚠ Without this the debug APK reports environment:'production', because
          # Vite's MODE is 'production' for any production build regardless of what
          # the artifact is for — PR/debug errors would be indistinguishable from
          # live ones and would defeat production-only alert filtering.
          VITE_SHAPE_ENV: debug
          # ⚠ UPLOAD CREDENTIALS ARE WITHHELD ON pull_request, DELIBERATELY.
          #
          # These three are what switch the Sentry Vite plugin from "absent" to
          # "create a release and upload source maps". This job runs on EVERY PR
          # touching mobile-app/**, and the artifact it produces is a debug APK
          # that is never distributed — so with the secrets present, every such
          # PR would mint a Sentry release named after its head SHA and upload
          # maps for a binary nobody installs. That burns the upload quota and
          # fills the release list with junk that has to be cleaned up by hand.
          #
          # This cannot misfire today (no secrets exist), which is exactly why it
          # has to land BEFORE they are created — after is a cleanup job.
          # The release-apk job below is already push/dispatch-only, so it needs
          # no equivalent guard.
          #
          # Withholding the token alone would disable the upload, but org and
          # project are withheld too so the intent reads at a glance.
          SENTRY_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ github.event_name != 'pull_request' && secrets.SENTRY_ORG || '' }}
          SENTRY_PROJECT_MOBILE: ${{ github.event_name != 'pull_request' && secrets.SENTRY_PROJECT_MOBILE || '' }}

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Sync Capacitor Android
        run: npx cap sync android

      # A silent strip that regresses looks identical to one that works, so
      # assert it rather than trust it. The strip itself lives in
      # mobile-app/vite.config.ts (`stripSourcemaps`), because dist/ is the one
      # chokepoint every consumer copies from. ⚠ There is NO equivalent gate on
      # the iOS side — codemagic.yaml builds the TestFlight IPA on a Codemagic
      # Mac mini, outside this workflow — so the vite-level strip is the SOLE
      # guard on the App Store path. Do not move it into a CI step here.
      - name: Fail if source maps reached the native bundle
        run: |
          n=$(find android/app/src/main/assets/public -name '*.map' -type f | wc -l)
          echo "sourcemaps in native assets: $n"
          [ "$n" -eq 0 ] || { echo "::error::$n .map file(s) would ship in the APK"; exit 1; }

      - name: Assemble debug APK
        working-directory: mobile-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shape-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Opt-in release build. Skips entirely until the signing secrets are present,
  # so the workflow stays green before you've set up a keystore.
  release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    # Only attempt on main / manual runs; the secret check below makes it a
    # no-op until a keystore is configured.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for signing secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret — skipping release build."
          fi

      - name: Set up Node
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        if: steps.secrets.outputs.present == 'true'
        run: npm ci

      # Same reasoning as the debug job above — this is the SIGNED build that
      # actually ships, so it is the one that must not bake in an empty DSN.
      - name: Build web assets
        if: steps.secrets.outputs.present == 'true'
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SHAPE_RELEASE: ${{ github.sha }}
          # This is the signed build that actually ships, so it is genuinely
          # production — unlike the debug job above.
          VITE_SHAPE_ENV: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_MOBILE: ${{ secrets.SENTRY_PROJECT_MOBILE }}

      - name: Set up JDK 21
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: steps.secrets.outputs.present == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle
        if: steps.secrets.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Sync Capacitor Android
        if: steps.secrets.outputs.present == 'true'
        run: npx cap sync android

      # Same assertion as the debug job — and this is the SIGNED build that
      # actually ships, so it is the one that matters most.
      - name: Fail if source maps reached the native bundle
        if: steps.secrets.outputs.present == 'true'
        run: |
          n=$(find android/app/src/main/assets/public -name '*.map' -type f | wc -l)
          echo "sourcemaps in native assets: $n"
          [ "$n" -eq 0 ] || { echo "::error::$n .map file(s) would ship in the APK"; exit 1; }

      - name: Decode keystore
        if: steps.secrets.outputs.present == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble signed release APK
        if: steps.secrets.outputs.present == 'true'
        working-directory: mobile-app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload release APK
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shape-release-apk
          path: mobile-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
